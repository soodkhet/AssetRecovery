// Standard: DD/MM/YYYY หรือ DD/MM/YYYY HH:mm
// ═══════════════════════════════════════════════════════
const TZ = 'Asia/Bangkok';

function toBKK(date = new Date()) {
  // คืน Date object ที่ตรงกับเวลา Asia/Bangkok
  return new Date(date.toLocaleString('en-US', { timeZone: TZ }));
}

function fmtDate(date = new Date()) {
  // DD/MM/YYYY (พ.ศ.) — วันที่อย่างเดียว
  const d = toBKK(date instanceof Date ? date : new Date(date));
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const yyyy = d.getFullYear() + 543; // ค.ศ. → พ.ศ.
  return `${dd}/${mm}/${yyyy}`;
}

function fmtDateTime(date = new Date()) {
  // DD/MM/YYYY HH:mm (พ.ศ.) — วันที่และเวลา
  const d = toBKK(date instanceof Date ? date : new Date(date));
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const yyyy = d.getFullYear() + 543;
  const hh = String(d.getHours()).padStart(2,'0');
  const min = String(d.getMinutes()).padStart(2,'0');
  return `${dd}/${mm}/${yyyy} ${hh}:${min}`;
}

function nowDate() { return fmtDate(new Date()); }
function nowDateTime() { return fmtDateTime(new Date()); }

function filterInput(placeholder, bindKey, small=false){
  return`<div class="relative">
    <div class="absolute left-3 top-1/2 -translate-y-1/2">${SVG.search}</div>
    <input type="text" placeholder="${placeholder}" value="${st[bindKey]||''}"
      oninput="S({${bindKey}:this.value})"
      class="pl-9 pr-3 ${small?'py-1.5 text-xs':'py-2 text-sm'} border border-slate-200 rounded-lg focus-ring bg-white w-full">
  </div>`;
}
function filterSelect(label, opts, bindKey, small=false){
  return`<select onchange="S({${bindKey}:this.value})" class="border border-slate-200 rounded-lg px-3 ${small?'py-1.5 text-xs':'py-2 text-sm'} focus-ring bg-white">
    <option value="">${label}</option>
    ${opts.map(o=>`<option value="${o.v}" ${st[bindKey]===o.v?'selected':''}>${o.l}</option>`).join('')}
  </select>`;
}

// SUMMARY CARDS
// ═══════════════════════════════════════════════════════
function renderSummary(){
  const cnt=(s)=>store.assets.filter(a=>a.asset_status===s).length;
  const lotCnt=(s)=>store.handoverLots.filter(l=>l.status===s).length;
  const cards=[
    {l:'รอรับเข้าคลัง', n:cnt('pending_intake')+cnt('intake_rejected'), bg:'bg-sky-50 border-sky-200',     txt:'text-sky-700',    dot:'bg-sky-400',    tab:'intake'},
    {l:'ในคลัง',         n:cnt('in_custody'),                           bg:'bg-violet-50 border-violet-200',txt:'text-violet-700', dot:'bg-violet-400', tab:'custody'},
    {l:'รอส่งมอบ (Lot)', n:store.handoverLots.filter(l=>l.status==='pending_attach').length, bg:'bg-amber-50 border-amber-200',   txt:'text-amber-700',  dot:'bg-amber-400',  tab:'pending_handover'},
    {l:'ส่งมอบแล้ว',     n:lotCnt('confirmed'),                         bg:'bg-emerald-50 border-emerald-200',txt:'text-emerald-700',dot:'bg-emerald-400',tab:'delivered'},
  ];
  return`<div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
    ${cards.map(c=>`<button data-action="set-tab" data-id="${c.tab}" class="text-left ${c.bg} ${c.txt} border rounded-xl p-4 hover:opacity-90 transition focus-ring">
      <div class="flex items-center gap-1.5 mb-1"><div class="w-2 h-2 rounded-full ${c.dot}"></div><div class="text-[10px] font-bold uppercase opacity-70">${c.l}</div></div>
      <div class="text-2xl font-extrabold">${c.n}</div>
    </button>`).join('')}
  </div>`;
}

function renderTabs(){
  const tabs=[
    {id:'intake',           l:'รับเข้าคลัง',      cnt:store.assets.filter(a=>['pending_intake','intake_rejected'].includes(a.asset_status)).length},
    {id:'custody',          l:'ในคลัง',            cnt:store.assets.filter(a=>a.asset_status==='in_custody').length},
    {id:'pending_handover', l:'รอส่งมอบ',          cnt:store.handoverLots.filter(l=>l.status==='pending_attach').length},
    {id:'delivered',        l:'ส่งมอบแล้ว',        cnt:store.handoverLots.filter(l=>l.status==='confirmed').length},

  return`<div class="flex gap-6 border-b border-slate-200 mb-5 no-scroll overflow-x-auto">

    </button>`).join('')}

}

  if(st.fIntakeAgent) assets=assets.filter(a=>a.agent===st.fIntakeAgent);

  if(st.fIntakeCond) assets=assets.filter(a=>a.condition===st.fIntakeCond);

  const allTeams=[...new Set(store.assets.map(a=>a.team))];
  const allAgents=[...new Set(store.assets.map(a=>a.agent))];

        ${filterSelect('ทุกพนักงาน',allAgents.map(a=>({v:a,l:a})),'fIntakeAgent')}

        ${filterSelect('ทุกสภาพ',[{v:'normal',l:'ปกติ'},{v:'damaged',l:'ชำรุด'},{v:'partial_loss',l:'สูญหายบางส่วน'}],'fIntakeCond')}

    <!-- Table -->
    <div class="overflow-x-auto">
      <table class="w-full text-sm text-left">

          <tr>
            <th class="px-4 py-3">เคส / บริษัท</th>
            <th class="px-4 py-3">ลูกหนี้</th>
            <th class="px-4 py-3">อุปกรณ์ / IMEI</th>
            <th class="px-4 py-3">ทีม / พนักงาน</th>
            <th class="px-4 py-3">ปิดงานเมื่อ</th>
            <th class="px-4 py-3">สถานะ</th>
            <th class="px-4 py-3 text-right">จัดการ</th>
          </tr>
        </thead>
        <tbody>
          ${assets.length===0?`<tr><td colspan="7" class="text-center py-12 text-slate-400">ไม่พบรายการ</td></tr>`:
          assets.map(a=>`<tr class="border-b border-slate-100 hover:bg-slate-50">
            <td class="px-4 py-3">
              <div class="font-mono text-xs text-violet-700 font-bold">${a.caseRef}</div>
              <div class="text-[10px] text-slate-400 mt-0.5">${getCompany(a.companyId).short}</div>
            </td>
            <td class="px-4 py-3 font-semibold text-slate-900">${a.debtor}</td>
            <td class="px-4 py-3">
              <div class="font-medium">${a.device}</div>
              <div class="font-mono text-[10px] text-slate-400">${a.imeiContract}</div>
            </td>
            <td class="px-4 py-3 text-xs text-slate-600">
              <div>${a.team}</div>
              <div class="text-slate-400">${a.agent}</div>
            </td>
            <td class="px-4 py-3 text-xs text-slate-500">${a.closedAt}</td>
            <td class="px-4 py-3">${pill(ASL[a.asset_status],ASC[a.asset_status])}</td>
            <td class="px-4 py-3 text-right whitespace-nowrap">
              <div class="inline-flex items-center gap-1.5">
                ${a.asset_status==='pending_intake'?
                  btn(`${SVG.check} รับเข้าคลัง`,'bg-violet-600 text-white border-violet-600 hover:bg-violet-700',`data-action="open-modal" data-type="intake" data-id="${a.id}"`)+

// TAB: ในคลัง / รอส่งมอบ
// ═══════════════════════════════════════════════════════
function renderCustodyTab(){
  // ── DRILL-DOWN VIEW ──────────────────────────────────
  if(st.custodyCompanyOpen){
    const c = getCompany(st.custodyCompanyOpen);
    let assets = store.assets.filter(a=>a.companyId===st.custodyCompanyOpen&&a.asset_status==='in_custody');
    if(st.fCustodyDetailSearch) assets=assets.filter(a=>matchSearch(a,st.fCustodyDetailSearch));
    if(st.fCustodyDetailDate) assets=assets.filter(a=>a.receivedAt?.includes(st.fCustodyDetailDate.replace(/-/g,'/')));
    const readyToSend = assets; // ทุกรายการใน drill-down คือ in_custody แล้ว
    const selIds = Object.keys(st.selectedAssets).filter(id=>st.selectedAssets[id]);
    const selCount = selIds.length;
    const allReadySelected = readyToSend.length>0 && readyToSend.every(a=>st.selectedAssets[a.id]);

    return`<div>
      <button data-action="custody-back" class="flex items-center gap-2 text-sm text-violet-700 font-semibold mb-4 hover:underline">${SVG.back} กลับ</button>
      <div class="flex items-center justify-between mb-3 flex-wrap gap-3">
        <div>
          <h3 class="font-bold text-slate-900">${c.name}</h3>
          <div class="text-xs text-slate-500 mt-0.5">${assets.length} เครื่องในคลัง — ทั้งหมดพร้อมส่งมอบ</div>
        </div>
        <div class="flex items-center gap-2">
          ${btn(`${SVG.xl} Export Excel`,'text-emerald-700 border-emerald-200 hover:bg-emerald-50',`data-action="export-xl"`)}
          ${selCount>0?btn(`${SVG.truck} นัดวันส่งมอบ (${selCount})`,'bg-violet-700 text-white border-violet-700 hover:bg-violet-800',`data-action="open-modal" data-type="handover-lot" data-id="${st.custodyCompanyOpen}"`):
          btn(`${SVG.truck} นัดวันส่งมอบ`,'text-slate-400 border-slate-200 cursor-not-allowed opacity-50',`disabled`)}
        </div>
      </div>
      <!-- Filters -->
      <div class="bg-slate-50 border border-slate-200 rounded-xl p-3 mb-4 flex flex-wrap gap-3">
        ${filterInput('IMEI / ชื่อลูกหนี้ / เลขสัญญา','fCustodyDetailSearch',true)}
        <input type="date" value="${st.fCustodyDetailDate||''}" onchange="S({fCustodyDetailDate:this.value})" class="border border-slate-200 rounded-lg px-3 py-1.5 text-xs focus-ring bg-white">
      </div>
      <!-- Table -->
      <div class="overflow-x-auto">
        <table class="w-full text-sm text-left">
          <thead class="bg-slate-50 border-b border-slate-200 text-[11px] text-slate-500 uppercase font-bold tracking-wide">
            <tr>
              <th class="px-4 py-3">
                <input type="checkbox" class="focus-ring rounded" ${allReadySelected?'checked':''}
                  onchange="toggleAllReady('${st.custodyCompanyOpen}',this.checked)">
              </th>
              <th class="px-4 py-3">เคส / ลูกหนี้</th>
              <th class="px-4 py-3">อุปกรณ์ / IMEI</th>
              <th class="px-4 py-3">วันที่รับเข้า</th>
              <th class="px-4 py-3">สภาพ</th>
              <th class="px-4 py-3">สถานะ</th>
              <th class="px-4 py-3 text-right">รายละเอียด</th>
            </tr>
          </thead>
          <tbody>
            ${assets.length===0?`<tr><td colspan="7" class="text-center py-8 text-slate-400">ไม่พบรายการ</td></tr>`:
            assets.map(a=>{
              const ready = a.asset_status==='in_custody';
              const sel = !!st.selectedAssets[a.id];
              return`<tr class="border-b border-slate-100 ${sel?'bg-violet-50':''} hover:bg-violet-50/50">
                <td class="px-4 py-3">
                  <input type="checkbox" class="focus-ring rounded" ${sel?'checked':''} ${!ready?'disabled title="นัดส่งมอบแล้ว — ยกเลิก lot ก่อน"':''}
                    onchange="toggleAsset('${a.id}',this.checked)">
                </td>
                <td class="px-4 py-3">
                  <div class="font-mono text-xs text-violet-700 font-bold">${a.caseRef}</div>
                  <div class="font-semibold text-slate-900">${a.debtor}</div>
                </td>
                <td class="px-4 py-3">
                  <div class="font-medium">${a.device}</div>
                  <div class="font-mono text-[10px] text-slate-400">${a.imeiContract}</div>

                <td class="px-4 py-3 text-xs text-slate-500">${a.receivedAt||'—'}</td>

            }).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
  }

  // ── CARD VIEW (grouped by company) ───────────────────
  let allCustody = store.assets.filter(a=>a.asset_status==='in_custody');
  if(st.fCustodySearch)  allCustody=allCustody.filter(a=>matchSearch(a,st.fCustodySearch));
  if(st.fCustodyCompany) allCustody=allCustody.filter(a=>a.companyId===st.fCustodyCompany);

  const byCompany = {};
  allCustody.forEach(a=>{ if(!byCompany[a.companyId])byCompany[a.companyId]=[]; byCompany[a.companyId].push(a); });

  return`<div>
    <div class="bg-slate-50 border border-slate-200 rounded-xl p-3 mb-5 flex flex-wrap gap-3">
      ${filterInput('IMEI / ชื่อลูกหนี้ / เลขสัญญา','fCustodySearch',true)}

      ${Object.entries(byCompany).map(([compId, assets])=>{
        const co = getCompany(compId);

        const condMap = {};
        assets.forEach(a=>{ if(a.condition)condMap[a.condition]=(condMap[a.condition]||0)+1; });
        return`<div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm hover:shadow-md transition-shadow cursor-pointer group"
          data-action="open-company" data-id="${compId}">
          <div class="flex items-start justify-between mb-4">

              <div class="font-bold text-slate-900 group-hover:text-violet-700 transition-colors">${co.short}</div>
              <div class="text-[10px] text-slate-400 mt-0.5">${co.name}</div>
            </div>
            <div class="text-right">
              <div class="text-2xl font-extrabold text-violet-700">${assets.length}</div>
              <div class="text-[10px] text-slate-400">เครื่องทั้งหมด</div>
            </div>
          </div>
          <div class="flex gap-2 mb-3">
            ${ready>0?`<span class="pill bg-violet-100 text-violet-700">${ready} เครื่อง พร้อมส่ง</span>`:'<span class="pill bg-slate-100 text-slate-400">ไม่มีรายการพร้อมส่ง</span>'}
          </div>
          ${Object.keys(condMap).length>0?`<div class="flex gap-1.5 flex-wrap">
            ${Object.entries(condMap).map(([c,n])=>`<span class="pill ${c==='normal'?'bg-emerald-50 text-emerald-700':c==='damaged'?'bg-red-50 text-red-700':'bg-amber-50 text-amber-700'}">${n} ${CLN[c]}</span>`).join('')}
          </div>`:''}
          <div class="mt-4 pt-4 border-t border-slate-100 flex items-center justify-between">
            <div class="text-xs text-slate-400">คลิกเพื่อดูรายการ</div>

          </div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

            ${isPickup
              ? `<div class="${isConfirmed?'text-emerald-700':'text-slate-500'}">📄 ใบส่งมอบลายเซ็นผู้รับ ${isConfirmed?'✅ แนบแล้ว':'⏳ รอแนบ'}</div>`

            }
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

    footer=`<button data-action="close-modal" class="px-4 py-2 text-sm font-semibold text-slate-700 border border-slate-200 rounded-lg hover:bg-slate-50 focus-ring">ยกเลิก</button>

  }


  // ── view-attached-doc ──────────────────────────────────
  else if(type==='view-attached-doc'){
    const l = getLot(id);
    const lco = getCompany(l.companyId);
    const isPickup = l.type==='finance_pickup';
    title=`เอกสารที่แนบ — ${l.id}`;
    body=`<div class="space-y-4">
      <div class="border border-slate-200 rounded-xl p-3 text-xs space-y-1.5">
        <div class="flex justify-between"><span class="text-slate-400">Lot:</span><span class="font-mono font-bold text-violet-700">${l.id}</span></div>

        <div class="flex justify-between"><span class="text-slate-400">ประเภท:</span><span>${isPickup?'🏢 บริษัทไฟแนนซ์มารับ':'🚚 เราจัดส่งไปให้'}</span></div>
        <div class="flex justify-between"><span class="text-slate-400">ยืนยันเมื่อ:</span><span class="font-semibold text-emerald-700">${l.confirmedAt}</span></div>
      </div>
      <!-- เอกสาร 1: ใบเซ็นรับ (ทุกประเภท) -->

        <div class="w-10 h-10 rounded-xl bg-emerald-100 flex items-center justify-center text-emerald-600 shrink-0">${SVG.clip}</div>
        <div class="flex-1 min-w-0">
          <div class="font-bold text-emerald-900 text-sm">① ใบส่งมอบที่มีลายเซ็นผู้รับ</div>
          <div class="text-xs text-emerald-700 mt-0.5">DLV-${l.id}-signed.pdf</div>
        </div>
        ${btn(`${SVG.dl} ดาวน์โหลด`,'text-emerald-700 border-emerald-200 hover:bg-emerald-100 shrink-0',`data-action="toast-dl"`)}
      </div>
      <!-- เอกสาร 2: หลักฐานจัดส่ง (we_deliver เท่านั้น) -->
      ${!isPickup?`
      <div class="border border-orange-200 rounded-xl p-4 bg-orange-50 flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-orange-100 flex items-center justify-center text-orange-600 shrink-0">${SVG.clip}</div>
        <div class="flex-1 min-w-0">
          <div class="font-bold text-orange-900 text-sm">② หลักฐานส่งพัสดุ / Delivered</div>
          <div class="text-xs text-orange-700 mt-0.5">${l.trackingNo?l.trackingNo:'delivery-proof.jpg'}</div>
        </div>
        ${btn(`${SVG.dl} ดาวน์โหลด`,'text-orange-700 border-orange-200 hover:bg-orange-100 shrink-0',`data-action="toast-dl"`)}
      </div>`:''}
    </div>`;
    footer=`<button data-action="close-modal" class="px-4 py-2 text-sm font-semibold text-white bg-slate-900 rounded-lg focus-ring">ปิด</button>`;
  }

  // ── preview-delivery-doc (from handover-lot modal) ─────
  else if(type==='preview-delivery-doc'){
    const companyId = st.custodyCompanyOpen;
    const co = getCompany(companyId||'SF');
    const selIds = Object.keys(st.selectedAssets).filter(i=>st.selectedAssets[i]);
    const selAssets = selIds.map(getAsset).filter(Boolean);
    wide=true;
    title='ตัวอย่างใบส่งมอบ (Preview)';
    body=`<div class="border-2 border-dashed border-slate-200 rounded-xl bg-white p-6 text-sm">
      <div class="text-center text-slate-400 text-xs mb-4">— ตัวอย่าง Preview — เลขที่ใบส่งมอบจะออกอัตโนมัติเมื่อบันทึก Lot —</div>
      <div class="flex justify-between items-start mb-4">
        <div><div class="font-extrabold text-xl">ใบส่งมอบสินทรัพย์คืน</div></div>
        <div class="text-right text-xs text-slate-400">เลขที่: DLV-2569-00${store.lotSeq+1} (Auto)</div>
      </div>
      <table class="w-full text-xs border border-slate-200 rounded-lg overflow-hidden">
        <thead class="bg-slate-50 border-b border-slate-200"><tr class="font-bold text-slate-600">
          <th class="px-3 py-2 text-left">#</th><th class="px-3 py-2 text-left">เลขสัญญา</th><th class="px-3 py-2 text-left">ลูกหนี้</th><th class="px-3 py-2 text-left">อุปกรณ์</th><th class="px-3 py-2 text-left">IMEI</th>
        </tr></thead>
        <tbody>
          ${selAssets.map((a,i)=>`<tr class="border-b border-slate-100">
            <td class="px-3 py-2">${i+1}</td><td class="px-3 py-2 font-mono">${a.caseRef}</td><td class="px-3 py-2">${a.debtor}</td><td class="px-3 py-2">${a.device}</td><td class="px-3 py-2 font-mono">${a.imeiContract}</td>
          </tr>`).join('')}
        </tbody>
      </table>
      <div class="text-center text-slate-400 text-xs mt-4">ผู้รับมอบไม่ต้องระบุในระบบ — เซ็นต์ลงในเอกสารที่พิมพ์</div>
    </div>`;
    footer=`<button data-action="close-modal" class="px-4 py-2 text-sm font-semibold text-slate-700 border border-slate-200 rounded-lg hover:bg-slate-50 focus-ring">กลับ</button>
    <button onclick="window.print()" class="px-5 py-2 text-sm font-semibold text-white bg-violet-700 rounded-lg hover:bg-violet-800 focus-ring flex items-center gap-1.5">${SVG.dl} พิมพ์ / ดาวน์โหลด PDF</button>`;
  }

  const maxW = xlWide?'max-w-4xl':wide?'max-w-2xl':'max-w-lg';
  return`<div class="fixed inset-0 modal-bg z-50 flex items-center justify-center p-4 fade-in" id="modal-backdrop">
    <div class="bg-white rounded-2xl shadow-2xl ${maxW} w-full max-h-[90vh] flex flex-col slide-up">
      <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100 shrink-0">
        <h2 class="font-bold text-slate-900">${title}</h2>
        <button data-action="close-modal" class="text-slate-400 hover:text-slate-700 p-1.5 rounded-lg hover:bg-slate-100 focus-ring">${SVG.x}</button>
      </div>
      <div class="overflow-y-auto px-6 py-5 flex-1">${body}</div>
      ${footer?`<div class="flex justify-end gap-3 px-6 py-4 border-t border-slate-100 bg-slate-50/50 rounded-b-2xl shrink-0">${footer}</div>`:''}
    </div>
  </div>`;
}

// ═══════════════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════════════
function renderToast(){
  if(!st.toast) return'';
  return`<div class="fixed bottom-6 right-6 z-50 slide-up">
    <div class="bg-slate-900 text-white px-5 py-3.5 rounded-xl shadow-2xl text-sm font-semibold flex items-center gap-3">
      <div class="w-5 h-5 rounded-full bg-${st.toast.color}-500 flex items-center justify-center">${SVG.check}</div>
      ${st.toast.msg}
    </div>
  </div>`;
}

// ═══════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════
function render(){
  let tabContent='';
  if(st.tab==='intake')           tabContent=renderIntakeTab();
  if(st.tab==='custody')          tabContent=renderCustodyTab();
  if(st.tab==='pending_handover') tabContent=renderPendingHandoverTab();
  if(st.tab==='delivered')        tabContent=renderDeliveredTab();
  document.getElementById('app').innerHTML=`
    ${renderNav()}
    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
      <div class="mb-6"><h1 class="text-2xl font-extrabold text-slate-900">คลังสินค้า</h1><p class="text-sm text-slate-500 mt-1">รับเครื่อง · ตรวจสภาพ · ส่งมอบเป็นล็อตคืนบริษัทไฟแนนซ์</p></div>
      ${renderSummary()}
      <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
        ${renderTabs()}${tabContent}
      </div>
    </main>
    ${renderModal()}${renderToast()}`;
}

// ═══════════════════════════════════════════════════════
// GLOBAL HELPERS (called from inline html)
// ═══════════════════════════════════════════════════════
window.toggleAsset=function(id,v){const s={...st.selectedAssets};s[id]=v;S({selectedAssets:s});}
window.toggleAllReady=function(companyId,v){
  const s={...st.selectedAssets};
  store.assets.filter(a=>a.companyId===companyId&&a.asset_status==='in_custody').forEach(a=>s[a.id]=v);
  S({selectedAssets:s});
}

// ═══════════════════════════════════════════════════════
// EVENTS
// ═══════════════════════════════════════════════════════
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]');
  if(!el){if(e.target.id==='modal-backdrop')closeModal();return;}
  const action=el.dataset.action, id=el.dataset.id;

  if(action==='set-tab') S({tab:id,custodyCompanyOpen:null,deliveredLotOpen:null,pendingLotOpen:null});
  else if(action==='open-modal') openModal(el.dataset.type,id);
  else if(action==='close-modal') closeModal();
  else if(action==='open-company') S({custodyCompanyOpen:id,selectedAssets:{},fCustodyDetailSearch:'',fCustodyDetailDate:''});
  else if(action==='custody-back') S({custodyCompanyOpen:null,selectedAssets:{}});
  else if(action==='open-pending-lot') S({pendingLotOpen:id,fPendingDetailSearch:''});
  else if(action==='pending-back') S({pendingLotOpen:null});
  else if(action==='open-lot') S({deliveredLotOpen:id,fDelivDetailSearch:''});
  else if(action==='delivered-back') S({deliveredLotOpen:null});
  else if(action==='export-xl') toast('Export Excel เสร็จสิ้น — กำลังดาวน์โหลด','emerald');
  else if(action==='toast-dl') toast('ดาวน์โหลดเอกสารเสร็จสิ้น','emerald');
  else if(action==='preview-delivery-doc') openModal('preview-delivery-doc');

  else if(action==='do-intake'){
    const a=store.assets.find(x=>x.id===id);
    a.asset_status='in_custody';
    a.receivedAt=nowDateTime();
    a.imeiActual=st.mIntakeImei||a.imeiContract;
    a.condition=st.mIntakeCond;
    a.conditionNote=st.mIntakeNote;
    a.photos=['front.jpg','back.jpg','imei.jpg'];
    closeModal();
    toast('รับเครื่องเข้าคลังแล้ว — Field Agent เริ่มเบิกได้เมื่อส่งมอบสำเร็จ');
  }
  else if(action==='do-reject'){
    const a=store.assets.find(x=>x.id===id);
    a.asset_status='intake_rejected';
    a.rejectAt=nowDate();
    a.rejectReason='IMEI ไม่ตรงกับที่ระบุในสัญญา — ให้ทีมตรวจสอบและนำเครื่องที่ถูกต้องมาส่งใหม่';
    closeModal();
    toast('ตีกลับแล้ว — แจ้งทีมติดตามตรวจสอบ','amber');
  }
  else if(action==='do-handover'){
    const companyId=id;
    const selIds=Object.keys(st.selectedAssets).filter(i=>st.selectedAssets[i]);
    const lotId=nextLotId();
    const docRef=nextDocRef();
    const isPickup = st.mHandoverType==='finance_pickup';
    store.handoverLots.push({
      id:lotId, companyId, type:st.mHandoverType,
      createdAt:nowDate(),
      deliveredAt: isPickup ? null : nowDate(),
      assetIds:selIds,
      docRef,
      scheduledAt: null,
      trackingNo: st.mHandoverTracking||null,
      attachedDoc: false,
      // finance_pickup → pending_attach (รอแนบเซ็น) → อยู่ใน "รอส่งมอบ"
      // we_deliver → pending_delivery_proof (รอหลักฐาน) → ย้ายไป "ส่งมอบแล้ว" ทันที
      status: isPickup ? 'pending_attach' : 'pending_delivery_proof',
      confirmedAt: null,
      note: st.mHandoverNote
    });
    selIds.forEach(aid=>{
      const a=store.assets.find(x=>x.id===aid);
      if(a){
        // finance_pickup: ยังอยู่ใน "รอส่งมอบ" รอแนบเซ็น
        // we_deliver: ส่งออกไปแล้ว → handed_over เลย
        a.asset_status = isPickup ? 'handover_pending' : 'handed_over';
        a.lotId=lotId;
      }
    });
    closeModal();
    S({tab:'pending_handover',pendingLotOpen:lotId});
    toast(`สร้าง ${lotId} สำเร็จ — กรุณาแนบใบส่งมอบเพื่อยืนยัน`,'violet');
  }
  else if(action==='do-confirm-lot'){
    const l=getLot(id);
    l.attachedDoc=true;
    l.status='confirmed';
    l.confirmedAt=nowDate()+' '+new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
    if(!l.deliveredAt) l.deliveredAt=nowDate();
    // finance_pickup: asset ยังเป็น handover_pending → เปลี่ยนเป็น handed_over เมื่อยืนยัน
    // we_deliver: asset เป็น handed_over อยู่แล้ว
    l.assetIds.forEach(aid=>{
      const a=store.assets.find(x=>x.id===aid);
      if(a) a.asset_status='handed_over';
    });
    closeModal();
    S({tab:'delivered',deliveredLotOpen:id,pendingLotOpen:null,fDelivStatus:''});
    toast('ยืนยันส่งมอบสำเร็จ — ปลดล็อกรายได้และรายการเบิกทั้งหมดในล็อตนี้แล้ว');
  }
});

render();
</script>
