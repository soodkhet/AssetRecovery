function setState(p) { state = { ...state, ...p }; render(); }
function showToast(msg, type='success') {
  state.toast = { msg, type };
  render();
  setTimeout(() => { state.toast = null; render(); }, 2600);
}
function money(n) { return Number(n||0).toLocaleString('th-TH'); }

// ─── Getters ─────────────────────────────────────────────────────────
function getTeam(id)  { return teams.find(t=>t.id===id) || {}; }
function getAgent(id) { return agents.find(a=>a.id===id) || {}; }
function getCase(id)  { return store.cases.find(c=>c.id===id) || {}; }
function currentUser() { return ROLES[currentRole]; }

function filteredCases() {
  return store.cases.filter(c => {
    const matchStatus = state.filterStatus === 'all'
      || (state.filterStatus === 'pending_reassignment' ? c.pending_reassignment != null : c.assignment_status === state.filterStatus);
    const matchTeam   = state.filterTeam   === 'all' || c.team_id   === state.filterTeam;
    const matchSearch = !state.searchQuery
      || c.case_ref.includes(state.searchQuery)
      || c.debtor.includes(state.searchQuery)
      || c.province.includes(state.searchQuery);
    return matchStatus && matchTeam && matchSearch;
  });
}

function kpiCounts() {
  return {
    ready:    store.cases.filter(c=>c.assignment_status==='ready_to_assign').length,
    assigned: store.cases.filter(c=>c.assignment_status==='assigned').length,
    accepted: store.cases.filter(c=>c.assignment_status==='accepted').length,
    consent:  store.cases.filter(c=>c.pending_reassignment!=null).length,
  };
}

// เคสที่ agent ปัจจุบัน (role=agent) ต้องรับ / ตอบคำขอ
function myPendingAccept() {
  const u = currentUser();
  return store.cases.filter(c => c.assigned_agent_id===u.id && c.assignment_status==='assigned');
}
function myPendingConsent() {
  const u = currentUser();
  return store.cases.filter(c => c.assigned_agent_id===u.id && c.pending_reassignment!=null);
}

// ─── Helpers ─────────────────────────────────────────────────────────
function statusBadge(c) {
  if (c.pending_reassignment) {
    return `<span class="badge-consent inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold">${I.alert} รอความยินยอม</span>`;
  }
  const map = {
    ready_to_assign: { cls:'badge-pending',  label:'พร้อมมอบหมาย' },
    assigned:        { cls:'badge-assigned', label:'มอบหมายแล้ว (รอรับ)' },
    accepted:        { cls:'badge-accepted', label:'รับงานแล้ว' },
  };
  const s = map[c.assignment_status] || { cls:'', label:c.assignment_status };
  return `<span class="${s.cls} inline-block px-2.5 py-0.5 rounded-full text-[10px] font-bold">${s.label}</span>`;
}

function teamBadge(team) {
  if (!team || !team.id) return '';
  const cls = team.side==='inhouse' ? 'badge-inhouse' : 'badge-outsource';
  const lbl = team.side==='inhouse' ? 'Inhouse' : 'Outsource';
  return `<span class="${cls} inline-block px-1.5 py-px rounded uppercase tracking-wider">${lbl}</span>`;
}

function agentName(id) {
  if (!id) return '<span class="text-slate-400">—</span>';
  const a = getAgent(id);
  return a.name || '—';
}

function assignedInfo(c) {
  if (!c.assigned_agent_id) return '';
  const agent = getAgent(c.assigned_agent_id);
  let lines = `<div class="font-semibold text-slate-800 text-xs">${agent.name || '—'}</div>`;
  if (c.assigned_at)  lines += `<div class="text-[10px] text-slate-400 mt-0.5">มอบหมายเมื่อ ${c.assigned_at}</div>`;
  if (c.accepted_at)  lines += `<div class="text-[10px] text-emerald-600">รับงานเมื่อ ${c.accepted_at}</div>`;
  return lines;
}

// ─── Actions ─────────────────────────────────────────────────────────
function doAssign(caseId) {
  const agentId = state.selectedAgentId;
  if (!agentId) { showToast('กรุณาเลือกพนักงานก่อน', 'error'); return; }
  const c = getCase(caseId);
  c.assigned_agent_id   = agentId;
  c.assignment_status   = 'assigned';
  c.assigned_at         = '27/06/2569 ' + new Date().toLocaleTimeString('th-TH', {hour:'2-digit',minute:'2-digit'});
  c.accepted_at         = null;
  c.pending_reassignment= null;
  const agent = getAgent(agentId);
  setState({ modal: null, selectedAgentId: null });
  showToast(`มอบหมาย ${c.case_ref} ให้ ${agent.name} เรียบร้อย`);
}

function doReassign(caseId) {
  const agentId = state.selectedAgentId;
  const reason  = state.reassignReason.trim();
  if (!agentId) { showToast('กรุณาเลือกพนักงานก่อน', 'error'); return; }
  if (!reason)  { showToast('กรุณาระบุเหตุผลก่อน (ASSIGNMENT_REASON_REQUIRED)', 'error'); return; }
  const c = getCase(caseId);
  const agent = getAgent(agentId);
  if (c.assignment_status === 'assigned') {
    // เปลี่ยนทันที
    c.assigned_agent_id = agentId;
    c.assigned_at = '27/06/2569 ' + new Date().toLocaleTimeString('th-TH', {hour:'2-digit',minute:'2-digit'});
    c.accepted_at = null;
    setState({ modal: null, selectedAgentId: null, reassignReason: '' });
    showToast(`เปลี่ยนผู้รับผิดชอบ ${c.case_ref} เป็น ${agent.name} เรียบร้อย`);
  } else {
    // สร้าง pending_reassignment
    c.pending_reassignment = {
      requested_by: currentUser().id, requested_by_name: currentUser().name,
      requested_at: '27/06/2569 ' + new Date().toLocaleTimeString('th-TH', {hour:'2-digit',minute:'2-digit'}),
      new_agent_id: agentId, new_agent_name: agent.name,
      reason, expires_at: '27/06/2569 (ครบ 3 ชม.)', status: 'waiting_consent'
    };
    setState({ modal: null, selectedAgentId: null, reassignReason: '' });
    showToast(`ส่งคำขอเปลี่ยนผู้รับผิดชอบ ${c.case_ref} แล้ว — รอ ${agentName(c.assigned_agent_id)} ยืนยัน`);
  }
}

function doAccept(caseId) {
  const c = getCase(caseId);
  c.assignment_status = 'accepted';
  c.accepted_at = '27/06/2569 ' + new Date().toLocaleTimeString('th-TH', {hour:'2-digit',minute:'2-digit'});
  setState({ modal: null });
  showToast(`รับงาน ${c.case_ref} เรียบร้อย — เคสพร้อมเข้าสู่รอบจัดเส้นทาง`);
}

function doConsent(caseId) {
  const c = getCase(caseId);
  const pr = c.pending_reassignment;
  c.assigned_agent_id = pr.new_agent_id;
  c.assignment_status = 'assigned';
  c.accepted_at = null;
  c.pending_reassignment = null;
  setState({ modal: null });
  showToast(`ยินยอมแล้ว — ${c.case_ref} โอนให้ ${pr.new_agent_name} เรียบร้อย`);
}

function doDecline(caseId) {
  const reason = state.declineReason.trim();
  if (!reason) { showToast('กรุณาระบุเหตุผล (DECLINE_REASON_REQUIRED)', 'error'); return; }
  const c = getCase(caseId);
  c.pending_reassignment = null;
  setState({ modal: null, declineReason: '' });
  showToast(`ปฏิเสธคำขอ ${c.case_ref} แล้ว — เคสยังอยู่กับคุณตามเดิม`);
}

// ─── Render: Agent Picker Section ────────────────────────────────────

  const eligibleAgents = agents.filter(a => a.team_id === targetTeamId);
  return `
  <div class="space-y-2">
    ${eligibleAgents.map(a=>{
      const expanded = !!state.expandedAgents[a.id];
      const team = getTeam(a.team_id);
      const isSelected = state.selectedAgentId === a.id;
      return `
      <div class="agent-card border border-slate-200 rounded-xl p-3 cursor-pointer ${isSelected?'selected':''}"
        onclick="setState({selectedAgentId:'${a.id}'})">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-full bg-slate-900 text-white flex items-center justify-center font-bold text-sm shrink-0">${a.name.charAt(0)}</div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2">
              <span class="font-bold text-slate-900 text-sm">${a.name}</span>
              ${isSelected ? `<span class="text-emerald-600 text-xs font-bold flex items-center gap-0.5">${I.check} เลือกแล้ว</span>` : ''}

            <div class="flex items-center gap-1 mt-0.5">${teamBadge(team)}</div>

          </div>
        </div>
        <div class="flex items-center gap-1 text-[10px] text-slate-400 mt-2 flex-wrap">
          ${I.pin} ${a.provinces.join(' · ')}
        </div>
        <!-- Toggle ดูเคสที่ถืออยู่ -->
        <button class="mt-2 flex items-center gap-1 text-xs text-blue-600 hover:text-blue-800 font-semibold focus-ring"
          onclick="event.stopPropagation(); toggleAgentExpand('${a.id}')">
          ${expanded ? I.collapse : I.expand}
          ${expanded ? 'ซ่อนเคสที่ถืออยู่' : `ดูเคสที่ถืออยู่ (${a.active_cases})`}
        </button>
        ${expanded ? `
        <div class="mt-2 border-t border-slate-100 pt-2 space-y-1">

          <div class="flex items-center justify-between text-[11px] bg-slate-50 rounded-lg px-2.5 py-1.5">

              <span class="font-mono text-slate-500">${ac.case_ref}</span>
              <span class="font-semibold text-slate-800 ml-1.5">${ac.debtor}</span>
              <span class="text-slate-400 ml-1">${ac.province} / ${ac.asset}</span>

            <div class="flex items-center gap-1.5 ml-2 shrink-0">
              <span class="text-rose-600 font-bold">฿ ${money(ac.debt)}</span>
              <span class="${ac.status==='accepted'?'badge-accepted':'badge-assigned'} px-1.5 py-px rounded-full text-[9px] font-bold">${ac.status==='accepted'?'รับแล้ว':'รอรับ'}</span>

function toggleAgentExpand(agentId) {
  const exp = { ...state.expandedAgents };
  exp[agentId] = !exp[agentId];
  setState({ expandedAgents: exp });
}

// ─── Render: Modals ───────────────────────────────────────────────────
function openModal(type, caseId='', agentId='') {
  setState({ modal: { type, caseId, agentId }, selectedAgentId: null, expandedAgents: {}, reassignReason: '', declineReason: '' });
}
function closeModal() { setState({ modal: null }); }

function renderModal() {
  if (!state.modal) return '';
  const { type, caseId } = state.modal;
  const c = getCase(caseId);

  let title='', body='', footer='', wide=false;

  // ── assign modal ──────────────────────────────────────────────────
  if (type==='assign') {
    wide = true;
    title = `มอบหมายงาน — ${c.case_ref}`;
    body = `
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div>
        <div class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">รายละเอียดเคส</div>
        ${renderCaseDetailSection(c)}
      </div>
      <div>
        <div class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">
          เลือกพนักงาน — ${getTeam(c.team_id).name||''}
          <span class="ml-1">${teamBadge(getTeam(c.team_id))}</span>
        </div>
        ${renderAgentPicker(c.team_id, false)}
      </div>
    </div>`;
    footer = `
    <button onclick="closeModal()" class="px-4 py-2 text-sm font-semibold text-slate-700 border border-slate-300 rounded-lg hover:bg-slate-50 focus-ring">ยกเลิก</button>
    <button onclick="doAssign('${c.id}')" class="px-5 py-2 text-sm font-semibold bg-slate-900 text-white rounded-lg hover:bg-slate-700 focus-ring flex items-center gap-1.5">
      ${I.assign} ยืนยันมอบหมาย
    </button>`;
  }

  // ── reassign modal ────────────────────────────────────────────────
  else if (type==='reassign') {
    wide = true;
    const isAccepted = c.assignment_status === 'accepted';
    title = `เปลี่ยนผู้รับผิดชอบ — ${c.case_ref}`;
    body = `
    ${c.pending_reassignment ? `
    <div class="bg-amber-50 border border-amber-200 rounded-lg p-3 text-xs text-amber-800 mb-4 flex items-start gap-2">
      ${I.alert} <div><b>มีคำขอเปลี่ยนผู้รับผิดชอบค้างอยู่</b> (REASSIGNMENT_ALREADY_PENDING) — รอให้ ${agentName(c.assigned_agent_id)} ตอบหรือหมดเวลาก่อน</div>
    </div>` : ''}
    ${isAccepted && !c.pending_reassignment ? `
    <div class="bg-blue-50 border border-blue-200 rounded-lg p-3 text-xs text-blue-800 mb-4 flex items-start gap-2">
      ${I.alert} <div>เคสนี้<b>รับงานแล้ว</b> — การเปลี่ยนผู้รับผิดชอบจะไม่ทันที แต่จะ<b>ส่งคำขอ</b>ให้ ${agentName(c.assigned_agent_id)} ยืนยันก่อน (ครบ 3 ชม. ระบบจะ auto-approve)</div>
    </div>` : ''}
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div>
        <div class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">รายละเอียดเคส</div>
        ${renderCaseDetailSection(c)}
      </div>
      <div>
        <div class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">เลือกพนักงานคนใหม่</div>
        ${c.pending_reassignment ? `<div class="text-slate-400 text-sm py-8 text-center">ไม่สามารถเลือกได้ขณะมีคำขอค้างอยู่</div>` : renderAgentPicker(c.team_id, true)}
        ${!c.pending_reassignment ? `
        <div class="mt-4">
          <label class="block text-xs font-bold text-slate-700 mb-1.5">เหตุผลในการเปลี่ยน <span class="text-red-500">*</span></label>
          <textarea rows="3" placeholder="ระบุเหตุผล (ASSIGNMENT_REASON_REQUIRED)…"
            oninput="state.reassignReason=this.value"
            class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus-ring resize-none">${state.reassignReason}</textarea>
        </div>` : ''}
      </div>
    </div>`;
    footer = `
    <button onclick="closeModal()" class="px-4 py-2 text-sm font-semibold text-slate-700 border border-slate-300 rounded-lg hover:bg-slate-50 focus-ring">ยกเลิก</button>
    ${!c.pending_reassignment ? `
    <button onclick="doReassign('${c.id}')"
      class="px-5 py-2 text-sm font-semibold ${isAccepted?'bg-amber-600 hover:bg-amber-700':'bg-slate-900 hover:bg-slate-700'} text-white rounded-lg focus-ring flex items-center gap-1.5">
      ${I.reassign} ${isAccepted ? 'ส่งคำขอเปลี่ยนผู้รับผิดชอบ' : 'ยืนยันเปลี่ยน'}
    </button>` : ''}`;
  }

  // ── case detail (read-only) ───────────────────────────────────────
  else if (type==='case_detail') {
    wide = true;
    title = `รายละเอียดเคส — ${c.case_ref}`;
    body = renderCaseDetailSection(c);
    footer = `<button onclick="closeModal()" class="px-4 py-2 text-sm font-semibold text-slate-700 border border-slate-300 rounded-lg hover:bg-slate-50 focus-ring">ปิด</button>`;
  }

  // ── decline consent modal ─────────────────────────────────────────
  else if (type==='decline') {
    title = `ไม่ยินยอมเปลี่ยนผู้รับผิดชอบ — ${c.case_ref}`;
    body = `
    <div class="bg-red-50 border border-red-200 rounded-lg p-3 text-xs text-red-800 mb-4">
      หากไม่ยินยอม เคสนี้จะยังคงเป็นของคุณต่อไป — โปรดระบุเหตุผลเพื่อแจ้งผู้จัดการ
    </div>
    <label class="block text-xs font-bold text-slate-700 mb-1.5">เหตุผลที่ไม่ยินยอม <span class="text-red-500">*</span></label>
    <textarea rows="4" placeholder="ระบุเหตุผล (DECLINE_REASON_REQUIRED)…"
      oninput="state.declineReason=this.value"
      class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus-ring resize-none">${state.declineReason}</textarea>`;
    footer = `
    <button onclick="closeModal()" class="px-4 py-2 text-sm font-semibold text-slate-700 border border-slate-300 rounded-lg hover:bg-slate-50 focus-ring">ยกเลิก</button>
    <button onclick="doDecline('${c.id}')" class="px-5 py-2 text-sm font-semibold bg-red-600 text-white rounded-lg hover:bg-red-700 focus-ring">ยืนยันไม่ยินยอม</button>`;
  }

  return `
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4" onclick="if(event.target===this)closeModal()">
    <div class="modal-overlay absolute inset-0"></div>
    <div class="relative bg-white rounded-2xl shadow-2xl slide-in w-full ${wide ? 'max-w-4xl' : 'max-w-lg'} max-h-[92vh] flex flex-col">
      <!-- Modal header -->
      <div class="flex items-center justify-between px-6 py-4 border-b border-slate-200 shrink-0">
        <h2 class="font-bold text-slate-900 text-base">${title}</h2>
        <button onclick="closeModal()" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-slate-100 text-slate-500 focus-ring">${I.x}</button>
      </div>
      <!-- Modal body -->
      <div class="flex-1 overflow-y-auto px-6 py-5">${body}</div>
      <!-- Modal footer -->
      <div class="flex items-center justify-end gap-2 px-6 py-4 border-t border-slate-200 bg-slate-50 rounded-b-2xl shrink-0">${footer}</div>
    </div>
  </div>`;
}

// ─── Render: Toast ────────────────────────────────────────────────────
function renderToast() {
  if (!state.toast) return '';
  const { msg, type } = state.toast;
  const cls = type==='error' ? 'bg-red-600' : 'bg-slate-900';
  return `
  <div class="fixed top-4 right-4 z-[100] ${cls} text-white text-sm font-semibold px-4 py-3 rounded-xl shadow-xl max-w-sm toast-in flex items-center gap-2">
    ${type==='error' ? I.alert : I.check} ${msg}
  </div>`;
}

// ─── Main Render ──────────────────────────────────────────────────────
function render() {
  const isAgent = currentRole === 'agent';
  document.getElementById('app').innerHTML = `
  ${renderNav()}
  <div class="max-w-screen-xl mx-auto px-4 sm:px-6 py-6">
    ${isAgent
      ? renderAgentView()
      : (state.view === 'kanban'
          ? renderKanban()
          : `
          <div class="mb-5">
            <h1 class="text-2xl font-extrabold text-slate-900">มอบหมายและวางแผนงาน</h1>
            <p class="text-sm text-slate-500 mt-1">งานติดตามทรัพย์ → จัดการมอบหมาย / ภาพรวมทีม</p>
          </div>
          ${renderKPI()}
          ${renderToolbar()}
          ${renderCaseTable()}`)
    }
  </div>
  ${renderModal()}
  ${renderToast()}`;
}

// ─── Global helpers (called from onclick) ────────────────────────────
function switchRole(role) {
  currentRole = role;
  setState({ modal: null, view: 'list', filterStatus:'all', filterTeam:'all', searchQuery:'', selectedAgentId:null });
}

// Initial render
render();
</script>
</body>
</html>
