<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AssetRecovery — จัดการเคส (Case Management)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', 'Noto Sans Thai', sans-serif; background-color: #f8fafc; color: #0f172a; }
  .focus-ring:focus { outline: 2px solid #0f172a; outline-offset: 2px; }
  .modal-backdrop { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(2px); }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
</style>
</head>
<body class="min-h-screen flex flex-col">
<div id="app" class="flex-1 flex flex-col"></div>
<div id="modal"></div>

<script>
// ═══════════════════════════════════════════════════════════════
// จัดการเคส (Case Management) — เมนู Top nav ตามไฟล์ 06 §8
// ครอบคลุม: รายการเคสทั้งหมด · คิวพิจารณารับเคส (เจ้าหน้าที่อนุมัติเคส)
//           · Recycle Review (ไฟล์ 38 §6.6/§10, state pending_recycle_review)
// ฟอร์มรับเคส (สร้างเคสใหม่) → ดู 38-case-submission-mockup.html
// สถานะทั้งหมด = enum case_status จริง (ไฟล์ 02 §3) · tracking_round/
// projected_revenue/suggested_team ตามไฟล์ 38 §6.4-6.5
// ═══════════════════════════════════════════════════════════════

const state = { tab: 'review', modal: null };

const STATUS_CLS = {
  draft: 'bg-slate-100 text-slate-700', pending_review: 'bg-amber-100 text-amber-800',
  need_info: 'bg-orange-100 text-orange-800', approved: 'bg-blue-100 text-blue-800',
  rejected: 'bg-red-100 text-red-800', active: 'bg-emerald-100 text-emerald-800',
  closed_success: 'bg-emerald-100 text-emerald-800', closed_fail: 'bg-red-100 text-red-800',
  pending_recycle_review: 'bg-purple-100 text-purple-800',
  pending: 'bg-amber-100 text-amber-800'
};
const STATUS_TH = {
  draft: 'ร่าง', pending_review: 'รอพิจารณา', need_info: 'ขอข้อมูลเพิ่ม', approved: 'อนุมัติ — รอมอบหมาย',
  rejected: 'ปฏิเสธ', active: 'กำลังติดตาม', closed_success: 'สำเร็จ', closed_fail: 'ไม่สำเร็จ',
  pending_recycle_review: 'รอพิจารณา Recycle', pending: 'รอพิจารณา'
};
const badge = s => `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${STATUS_CLS[s]||'bg-slate-100 text-slate-700'}">${STATUS_TH[s]||s}</span>`;
const money = n => n.toLocaleString('th-TH');

// mock data — field ตามไฟล์ 38 (source/tracking_round/suggested_team/projected_revenue/doc slots)
const cases = [
  { ref: 'CASE-26-0061', company: 'สยามไฟแนนซ์',    debtor: 'อนันต์ มีทรัพย์',  asset: 'iPhone 15 Pro Max',        province: 'เชียงใหม่',  source: 'api',    round: 1, suggestedTeam: 'ทีมรับเหมาเหนือ', team: null,               projected: 8500,  status: 'pending_review', docs: { contract_doc: true, national_id_doc: true, product_photo: 3 } },
  { ref: 'CASE-26-0058', company: 'กรุงไทยลีสซิ่ง',  debtor: 'วรรณา สุขใจ',     asset: 'Samsung S24 Ultra',        province: 'กรุงเทพฯ',   source: 'import', round: 1, suggestedTeam: 'ทีม A',            team: null,               projected: 12000, status: 'pending_review', docs: { contract_doc: true, national_id_doc: false, product_photo: 1 } },
  { ref: 'CASE-26-0055', company: 'สยามไฟแนนซ์',    debtor: 'สมบัติ รุ่งเรือง',  asset: 'MacBook Air M3',           province: 'ขอนแก่น',    source: 'manual', round: 1, suggestedTeam: 'ทีม B',            team: null,               projected: 9800,  status: 'need_info',      docs: { contract_doc: true, national_id_doc: true, product_photo: 0 }, needInfoNote: 'ขอรูปสินค้าอย่างน้อย 1 รูปก่อนพิจารณา (บังคับตาม §6.3.1)' },
  { ref: 'CASE-26-0051', company: 'อยุธยา แคปปิตอล', debtor: 'ประสงค์ ตั้งใจ',   asset: 'Toyota Yaris Ativ 2023',   province: 'ชลบุรี',     source: 'api',    round: 1, suggestedTeam: 'ทีม A',            team: 'ทีม A',            projected: 45000, status: 'active',         docs: { contract_doc: true, national_id_doc: true, product_photo: 5 } },
  { ref: 'CASE-26-0044', company: 'กรุงไทยลีสซิ่ง',  debtor: 'มาลี ใจงาม',      asset: 'Honda PCX 160',            province: 'กรุงเทพฯ',   source: 'import', round: 2, suggestedTeam: 'ทีม A',            team: 'ทีม A',            projected: 6200,  status: 'active',         docs: { contract_doc: true, national_id_doc: true, product_photo: 2 } },
  { ref: 'CASE-26-0034', company: 'สยามไฟแนนซ์',    debtor: 'สุชาติ พอเพียง',   asset: 'iPad Pro 12.9"',           province: 'เชียงราย',   source: 'api',    round: 1, suggestedTeam: 'ทีมรับเหมาเหนือ', team: 'ทีมรับเหมาเหนือ', projected: 7400,  status: 'closed_success', docs: { contract_doc: true, national_id_doc: true, product_photo: 4 } },
  { ref: 'CASE-26-0012', company: 'สยามไฟแนนซ์',    debtor: 'ชูชาติ กลับใจ',    asset: 'Samsung A54',              province: 'อุดรธานี',   source: 'manual', round: 1, suggestedTeam: 'ทีม B',            team: 'ทีม B',            projected: 4800,  status: 'pending_recycle_review', docs: { contract_doc: true, national_id_doc: true, product_photo: 2 } },
  { ref: 'CASE-26-0009', company: 'กรุงไทยลีสซิ่ง',  debtor: 'บุญมา ไกลบ้าน',    asset: 'Oppo Reno 11',             province: 'สงขลา',      source: 'import', round: 1, suggestedTeam: 'ทีมรับเหมาใต้',   team: 'ทีมรับเหมาใต้',   projected: 3900,  status: 'closed_fail',    docs: { contract_doc: true, national_id_doc: true, product_photo: 2 } }
];

// recycle_requests — ไฟล์ 38 §6.6: enum recycle_status (pending/approved/rejected), recycle_history object
const recycles = [
  { id: 'RCY-26-0003', caseRef: 'CASE-26-0012', company: 'สยามไฟแนนซ์', note: 'ลูกหนี้ย้ายกลับภูมิลำเนา จ.อุดรธานี — ไฟแนนซ์ยืนยันเบอร์ติดต่อใหม่', requestedBy: 'แอดมิน (สยามไฟแนนซ์)', requestedAt: '01/07/2569', prevRound: 1, status: 'pending' },
  { id: 'RCY-26-0002', caseRef: 'CASE-26-0044', company: 'กรุงไทยลีสซิ่ง', note: 'พบเบาะแสที่ทำงานใหม่ของลูกหนี้',                                       requestedBy: 'หัวหน้า (กรุงไทยฯ)',   requestedAt: '12/06/2569', prevRound: 1, status: 'approved', decidedBy: 'สมศักดิ์ ตรวจการณ์', decidedAt: '13/06/2569', newRound: 2 },
  { id: 'RCY-26-0001', caseRef: 'CASE-26-0007', company: 'อยุธยา แคปปิตอล', note: 'ขอลองใหม่',                                                              requestedBy: 'แอดมิน (อยุธยาฯ)',    requestedAt: '02/06/2569', prevRound: 1, status: 'rejected', decidedBy: 'สมศักดิ์ ตรวจการณ์', decidedAt: '03/06/2569', rejectReason: 'ไม่มีข้อมูลใหม่จากรอบก่อน — แจ้งไฟแนนซ์ให้ส่งเบาะแสเพิ่มก่อนยื่นซ้ำ' }
];

const docsOk = d => d.contract_doc && d.national_id_doc && d.product_photo > 0;

function render() {
  const pendingN = cases.filter(c=>['pending_review','need_info'].includes(c.status)).length;
  const recycleN = recycles.filter(r=>r.status==='pending').length;
  const tabs = [
    { id: 'all',     label: `รายการเคสทั้งหมด (${cases.length})` },
    { id: 'review',  label: `รอพิจารณารับเคส (${pendingN})` },
    { id: 'recycle', label: `Recycle Review (${recycleN})` }
  ];
  let content = '';

  if (state.tab === 'recycle') {
    content = `
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6">
      <h3 class="font-bold text-slate-800 mb-1">คำขอนำเคสกลับเข้า Pipeline (Recycle) — ไฟล์ 38 §6.6</h3>
      <p class="text-xs text-slate-500 mb-4">เคส closed_fail ที่ไฟแนนซ์ขอให้ลองใหม่ — อนุมัติแล้ว tracking_round +1 และเคสกลับเข้าคิวมอบหมาย · บันทึกทุกครั้งลง recycle_history</p>
      <div class="border border-slate-200 rounded-lg overflow-hidden bg-white">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-50 text-xs text-slate-600 border-b border-slate-200">
            <tr><th class="px-4 py-3">คำขอ</th><th class="px-4 py-3">เคส</th><th class="px-4 py-3">เหตุผลจากไฟแนนซ์</th><th class="px-4 py-3">รอบ</th><th class="px-4 py-3">สถานะ</th><th class="px-4 py-3 text-right">จัดการ</th></tr>
          </thead>
          <tbody class="divide-y divide-slate-100">
            ${recycles.map(r=>`
            <tr class="hover:bg-slate-50">
              <td class="px-4 py-3"><div class="font-mono text-xs text-blue-600">${r.id}</div><div class="text-[10px] text-slate-400 mt-0.5">${r.requestedAt} · ${r.requestedBy}</div></td>
              <td class="px-4 py-3"><div class="font-mono text-xs font-semibold">${r.caseRef}</div><div class="text-[10px] text-slate-400">${r.company}</div></td>
              <td class="px-4 py-3 text-xs text-slate-600 max-w-[260px]">${r.note}${r.rejectReason?`<div class="text-red-600 mt-1">ปฏิเสธ: ${r.rejectReason}</div>`:''}</td>
              <td class="px-4 py-3 text-xs">${r.status==='approved'?`${r.prevRound} → <b>${r.newRound}</b>`:`รอบที่ ${r.prevRound}`}</td>
              <td class="px-4 py-3">${badge(r.status)}</td>
              <td class="px-4 py-3 text-right">
                ${r.status==='pending'
                  ? `<button data-modal="recycle" data-id="${r.id}" class="bg-slate-900 text-white px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-slate-800 focus-ring">พิจารณา</button>`
                  : `<span class="text-[10px] text-slate-400">${r.decidedBy} · ${r.decidedAt}</span>`}
              </td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
  } else {
    const rows = state.tab==='review' ? cases.filter(c=>['pending_review','need_info'].includes(c.status)) : cases;
    content = `
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-bold text-slate-800">${state.tab==='review'?'คิวพิจารณารับเคส — เจ้าหน้าที่อนุมัติเคส (Global ทุกเคส)':'รายการเคสทั้งหมด'}</h3>
        <button class="bg-slate-900 text-white px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-slate-800 focus-ring">+ รับเคสใหม่ (ฟอร์ม → 38-mockup)</button>
      </div>
      <div class="border border-slate-200 rounded-lg overflow-hidden bg-white">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-50 text-xs text-slate-600 border-b border-slate-200">
            <tr><th class="px-4 py-3">เคส / รอบ</th><th class="px-4 py-3">ไฟแนนซ์ · ช่องทาง</th><th class="px-4 py-3">ลูกหนี้ / ทรัพย์</th><th class="px-4 py-3">จังหวัด</th><th class="px-4 py-3">ทีม</th><th class="px-4 py-3 text-right">ประมาณการรายได้</th><th class="px-4 py-3">เอกสาร</th><th class="px-4 py-3">สถานะ</th><th class="px-4 py-3 text-right">จัดการ</th></tr>
          </thead>
          <tbody class="divide-y divide-slate-100">
            ${rows.map(c=>`
            <tr class="hover:bg-slate-50">
              <td class="px-4 py-3"><div class="font-mono text-xs font-semibold text-blue-600">${c.ref}</div>${c.round>1?`<span class="inline-block mt-1 px-1.5 py-0.5 rounded bg-purple-100 text-purple-700 text-[9px] font-bold">รอบที่ ${c.round}</span>`:`<span class="text-[10px] text-slate-400">รอบที่ 1</span>`}</td>
              <td class="px-4 py-3 text-xs"><div class="font-semibold">${c.company}</div><div class="text-[10px] text-slate-400 uppercase">${c.source}</div></td>
              <td class="px-4 py-3 text-xs"><div class="font-semibold">${c.debtor}</div><div class="text-slate-500">${c.asset}</div></td>
              <td class="px-4 py-3 text-xs text-slate-600">${c.province}</td>
              <td class="px-4 py-3 text-xs">${c.team ? c.team : `<span class="text-slate-400">เสนอ: ${c.suggestedTeam}</span>`}</td>
              <td class="px-4 py-3 text-right text-xs font-bold text-emerald-700">฿ ${money(c.projected)}</td>
              <td class="px-4 py-3">${docsOk(c.docs)?'<span class="text-emerald-600 text-xs font-bold">✓ ครบ</span>':'<span class="text-red-600 text-xs font-bold">✗ ไม่ครบ</span>'}</td>
              <td class="px-4 py-3">${badge(c.status)}</td>
              <td class="px-4 py-3 text-right">
                ${['pending_review','need_info'].includes(c.status)
                  ? `<button data-modal="review" data-id="${c.ref}" class="bg-slate-900 text-white px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-slate-800 focus-ring">พิจารณา</button>`
                  : `<button data-modal="review" data-id="${c.ref}" class="text-blue-600 border border-blue-200 bg-blue-50 hover:bg-blue-100 px-3 py-1.5 rounded-lg text-xs font-semibold focus-ring">ดู</button>`}
              </td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
      <div class="mt-3 text-xs text-slate-500 bg-slate-50 border border-slate-100 rounded-lg p-3">
        <b>กติกา (ไฟล์ 38):</b> เข้าสถานะ pending_review ได้ต้องมี สัญญา + บัตรประชาชนลูกหนี้ + รูปสินค้า ≥ 1 ครบ · projected_revenue คำนวณจาก Service Fee Template แบบ best-case (§6.5) ไม่ใช่รายได้จริง · ระบบเสนอทีมจากการจับคู่จังหวัด (suggested_team) เจ้าหน้าที่อนุมัติเคสยืนยัน/เปลี่ยนเองได้
      </div>
    </div>`;
  }

  document.getElementById('app').innerHTML = `
  <header class="bg-white border-b border-slate-200 sticky top-0 z-20">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-slate-900 text-white flex items-center justify-center font-bold text-sm">AR</div>
      <div><div class="font-bold text-slate-900 text-sm leading-tight">จัดการเคส (Case Management)</div>
      <div class="text-[10px] text-slate-400">มุมมอง: เจ้าหน้าที่อนุมัติเคส (system role — ดูแลทุกเคสแบบ Global, ไฟล์ 06 §6)</div></div>
    </div>
    <div class="max-w-7xl mx-auto px-4 flex gap-1 -mb-px">
      ${tabs.map(t=>`<button data-tab="${t.id}" class="px-4 py-2.5 text-xs font-semibold rounded-t-lg border-b-2 transition-colors focus-ring ${state.tab===t.id?'border-slate-900 text-slate-900 bg-slate-50':'border-transparent text-slate-500 hover:text-slate-800'}">${t.label}</button>`).join('')}
    </div>
  </header>
  <main class="max-w-7xl mx-auto px-4 py-6 w-full animate-fade-in">${content}</main>`;
  document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{state.tab=b.dataset.tab;render();}));
  document.querySelectorAll('[data-modal]').forEach(b=>b.addEventListener('click',()=>openModal(b.dataset.modal,b.dataset.id)));
}

function openModal(type,id){
  let title='', body='', footer='';
  if(type==='review'){
    const c = cases.find(x=>x.ref===id);
    const readonly = !['pending_review','need_info'].includes(c.status);
    title = `พิจารณารับเคส — ${c.ref} (รอบที่ ${c.round})`;
    body = `
      <div class="grid grid-cols-2 gap-3 text-xs">
        <div class="border border-slate-200 rounded-lg p-3 space-y-1.5">
          <div class="text-slate-400 font-bold mb-1">ข้อมูลเคส</div>
          <div class="flex justify-between"><span class="text-slate-400">ไฟแนนซ์:</span><b>${c.company}</b></div>
          <div class="flex justify-between"><span class="text-slate-400">ลูกหนี้:</span><b>${c.debtor}</b></div>
          <div class="flex justify-between"><span class="text-slate-400">ทรัพย์:</span><span>${c.asset}</span></div>
          <div class="flex justify-between"><span class="text-slate-400">จังหวัด:</span><span>${c.province}</span></div>
          <div class="flex justify-between"><span class="text-slate-400">ช่องทาง:</span><span class="uppercase">${c.source}</span></div>
        </div>
        <div class="border border-slate-200 rounded-lg p-3 space-y-1.5">
          <div class="text-slate-400 font-bold mb-1">การพิจารณา</div>
          <div class="flex justify-between"><span class="text-slate-400">ประมาณการรายได้:</span><b class="text-emerald-700">฿ ${money(c.projected)}</b></div>
          <div class="text-[10px] text-slate-400">best-case จาก Service Fee Template (§6.5) — ไม่ใช่รายได้จริง</div>
          <div class="pt-1"><label class="block text-[10px] font-bold text-slate-700 mb-1">ทีมที่รับผิดชอบ (ระบบเสนอจากจังหวัด — เปลี่ยนได้)</label>
          <select ${readonly?'disabled':''} class="w-full border border-slate-300 rounded-lg px-2 py-1.5 text-xs focus-ring"><option selected>${c.suggestedTeam} (เสนอโดยระบบ)</option><option>ทีม A</option><option>ทีม B</option><option>ทีมรับเหมาเหนือ</option><option>ทีมรับเหมาใต้</option></select></div>
        </div>
      </div>
      <div class="border border-slate-200 rounded-lg p-3 text-xs mt-3">
        <div class="text-slate-400 font-bold mb-2">เอกสารบังคับก่อนพิจารณา (§6.3)</div>
        <div class="flex flex-wrap gap-2">
          <span class="px-2 py-1 rounded ${c.docs.contract_doc?'bg-emerald-50 text-emerald-700':'bg-red-50 text-red-700'} font-semibold">${c.docs.contract_doc?'✓':'✗'} สัญญาเช่าซื้อ</span>
          <span class="px-2 py-1 rounded ${c.docs.national_id_doc?'bg-emerald-50 text-emerald-700':'bg-red-50 text-red-700'} font-semibold">${c.docs.national_id_doc?'✓':'✗'} บัตรประชาชนลูกหนี้</span>
          <span class="px-2 py-1 rounded ${c.docs.product_photo>0?'bg-emerald-50 text-emerald-700':'bg-red-50 text-red-700'} font-semibold">${c.docs.product_photo>0?'✓':'✗'} รูปสินค้า (${c.docs.product_photo}/8)</span>
        </div>
        ${c.needInfoNote?`<div class="mt-2 text-orange-700 bg-orange-50 border border-orange-200 rounded p-2">ขอข้อมูลเพิ่ม: ${c.needInfoNote}</div>`:''}
      </div>
      ${readonly?'':`<div class="mt-3"><label class="block text-xs font-bold text-slate-700 mb-1">หมายเหตุ (บังคับเมื่อ ขอข้อมูลเพิ่ม / ปฏิเสธ)</label>
      <input class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus-ring" placeholder="เช่น ขอรูปสินค้าเพิ่ม / เอกสารสัญญาไม่ชัด"></div>`}`;
    footer = readonly ? `<button data-close class="px-4 py-2 rounded-lg text-xs font-semibold border border-slate-300 hover:bg-slate-100 focus-ring">ปิดหน้าต่าง</button>`
      : `<button data-close class="px-4 py-2 rounded-lg text-xs font-semibold border border-slate-300 hover:bg-slate-100 focus-ring">ยกเลิก</button>
         <button data-close class="bg-red-50 border border-red-200 text-red-700 px-4 py-2 rounded-lg text-xs font-semibold hover:bg-red-100 focus-ring">ปฏิเสธ (rejected)</button>
         <button data-close class="bg-orange-50 border border-orange-200 text-orange-700 px-4 py-2 rounded-lg text-xs font-semibold hover:bg-orange-100 focus-ring">ขอข้อมูลเพิ่ม (need_info)</button>
         <button data-close class="bg-emerald-50 border border-emerald-200 text-emerald-700 px-4 py-2 rounded-lg text-xs font-semibold hover:bg-emerald-100 focus-ring" ${docsOk(cases.find(x=>x.ref===id).docs)?'':'disabled title="เอกสารบังคับยังไม่ครบ"'}>อนุมัติรับเคส (approved)</button>`;
  } else {
    const r = recycles.find(x=>x.id===id);
    title = `พิจารณา Recycle — ${r.id}`;
    body = `
      <div class="border border-slate-200 rounded-lg p-3 text-xs space-y-1.5">
        <div class="flex justify-between"><span class="text-slate-400">เคส:</span><b class="font-mono">${r.caseRef}</b></div>
        <div class="flex justify-between"><span class="text-slate-400">ไฟแนนซ์:</span><span>${r.company}</span></div>
        <div class="flex justify-between"><span class="text-slate-400">ยื่นโดย:</span><span>${r.requestedBy} · ${r.requestedAt}</span></div>
        <div class="flex justify-between"><span class="text-slate-400">รอบปัจจุบัน → ถ้าอนุมัติ:</span><b>${r.prevRound} → ${r.prevRound+1}</b></div>
      </div>
      <div class="mt-3 border border-slate-200 rounded-lg p-3 text-xs"><div class="text-slate-400 font-bold mb-1">เหตุผล/เบาะแสใหม่จากไฟแนนซ์ (requested_note)</div>${r.note}</div>
      <div class="mt-3"><label class="block text-xs font-bold text-slate-700 mb-1">เหตุผล (บังคับเมื่อปฏิเสธ)</label>
      <input class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus-ring" placeholder="เช่น ไม่มีข้อมูลใหม่จากรอบก่อน"></div>
      <div class="mt-3 bg-purple-50 border border-purple-200 rounded-lg p-3 text-xs text-purple-800">
        อนุมัติแล้ว: tracking_round +1, เคสกลับเข้าคิวมอบหมายใหม่ (approved), บันทึก recycle_history { requested_note, approved_by, approved_at, previous_round, new_round } — ไฟล์ 38 §6.4/§6.6
      </div>`;
    footer = `<button data-close class="px-4 py-2 rounded-lg text-xs font-semibold border border-slate-300 hover:bg-slate-100 focus-ring">ยกเลิก</button>
      <button data-close class="bg-red-50 border border-red-200 text-red-700 px-4 py-2 rounded-lg text-xs font-semibold hover:bg-red-100 focus-ring">ปฏิเสธ</button>
      <button data-close class="bg-emerald-50 border border-emerald-200 text-emerald-700 px-4 py-2 rounded-lg text-xs font-semibold hover:bg-emerald-100 focus-ring">อนุมัติ Recycle (รอบที่ ${r.prevRound+1})</button>`;
  }
  document.getElementById('modal').innerHTML = `
  <div class="fixed inset-0 modal-backdrop z-40 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-2xl animate-fade-in">
      <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between"><h3 class="font-bold text-slate-900 text-sm">${title}</h3><button data-close class="text-slate-400 hover:text-slate-700 focus-ring">✕</button></div>
      <div class="px-6 py-4 max-h-[65vh] overflow-y-auto text-sm">${body}</div>
      <div class="px-6 py-4 border-t border-slate-200 flex justify-end gap-2">${footer}</div>
    </div>
  </div>`;
  document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>{document.getElementById('modal').innerHTML='';}));
}
render();
</script>
</body>
</html>
