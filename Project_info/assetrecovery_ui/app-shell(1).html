<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AssetRecovery — ระบบ</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: 'Inter', 'Noto Sans Thai', sans-serif; background-color: #f8fafc; color: #0f172a; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  .focus-ring:focus { outline: 2px solid #0f172a; outline-offset: 2px; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
  /* ── กันหัวไฟล์ mockup เดิม (มี header/nav ของตัวเองฝังอยู่แล้ว) ไม่ให้ซ้อนกับ top nav ของ shell ──
     เทคนิค: ทำ iframe สูงกว่ากรอบจริงเท่ากับความสูง header เดิมของไฟล์นั้น แล้วเลื่อนขึ้นด้วย negative margin
     ให้ header เดิมโดนกรอบ overflow:hidden ของ wrapper บังไว้ ไม่ต้องแก้โค้ดในไฟล์ mockup แม้แต่บรรทัดเดียว */
  .frame-wrap { position: relative; flex: 1 1 auto; overflow: hidden; background: #f8fafc; }
  .frame-wrap iframe { position: absolute; left: 0; width: 100%; border: 0; display: block; }
</style>
</head>
<body class="flex flex-col h-screen overflow-hidden">
<div id="app" class="flex flex-col h-full min-h-0"></div>

<script>
/*
  app-shell.html — เปลือกนอกเชื่อมโยง Mockup ทุกไฟล์เข้าด้วยกัน (Top Nav Bar)
  อ้างอิง: 06-menu-and-navigation-map.md §7.1.1 (Role Group Visibility Matrix), §7.2 (Top Nav Visibility Matrix)
  หลักการ: ไม่แก้โค้ดภายในไฟล์ mockup เดิมแม้แต่บรรทัดเดียว — ใช้ <iframe> โหลดไฟล์เดิมตรง ๆ
  ปัญหาเดิม: แต่ละไฟล์ mockup มี header/nav ของตัวเองอยู่แล้ว พอโหลดผ่าน iframe ใต้ top nav ของ shell
  จึงเห็นเป็น "แถบเมนูซ้อนกัน 2 ชั้น" → แก้ด้วยการ crop ส่วน header เดิมของแต่ละไฟล์ออกด้วย CSS (ดู .frame-wrap ด้านบน)
  เมนู "แดชบอร์ด" ระดับ top-nav ยังไม่มี mockup จริงในโปรเจกต์ (มีแค่ 14-finance-dashboard.md ซึ่งเป็นแท็บย่อยในการเงิน)
  → ตามที่ยืนยัน: สร้าง placeholder เรียบ ๆ ในไฟล์นี้เอง ระบุชัดเจนว่ารอออกแบบจริง เมนูยังกดได้
*/

// ── Role Configuration ─────────────────────────────────────────────
// สมมติฐานที่ยังไม่มีระบุตรง ๆ ในเอกสาร (ทำเครื่องหมาย ASSUMPTION) ใช้เพื่อกำหนดหน้า landing/เมนูที่มองเห็นเท่านั้น
// ไม่กระทบ business logic ภายในแต่ละ mockup
const ROLE_CONFIG = {
  superadmin: {
    label: 'Superadmin', group: 'system',
    menus: ['dashboard', 'cases', 'finance', 'accounting', 'warehouse', 'reports', 'settings'],
    caseSubmenus: ['submit', 'assign', 'field'],
    landing: 'dashboard',
  },
  executive: {
    label: 'บริหาร (Executive)', group: 'system',
    menus: ['dashboard', 'cases', 'finance', 'accounting', 'warehouse', 'reports', 'settings'],
    caseSubmenus: ['submit', 'assign', 'field'], // ASSUMPTION: ไฟล์ 06 ไม่ได้ระบุ submenu ของบริหารตรง ๆ ให้เห็นเท่า Superadmin เพราะมีหน้าที่กำกับ policy ภาพรวม
    landing: 'dashboard',
  },
  case_approver: {
    label: 'เจ้าหน้าที่อนุมัติเคส', group: 'system',
    menus: ['dashboard', 'cases'],
    caseSubmenus: ['submit'], // ตรงตาม §7.1.1 — เห็นเฉพาะ "รับเคส"
    landing: 'cases:submit',
  },
  finance: {
    label: 'การเงิน (Finance)', group: 'system',
    menus: ['dashboard', 'finance', 'warehouse', 'reports'],
    caseSubmenus: [],
    landing: 'finance',
  },
  accounting: {
    label: 'บัญชี (Accounting)', group: 'system',
    menus: ['dashboard', 'accounting', 'warehouse', 'reports'],
    caseSubmenus: [],
    landing: 'accounting',
  },
  admin_office: {
    label: 'ธุรการ (Admin)', group: 'system',
    menus: ['dashboard', 'cases'],
    caseSubmenus: ['submit'], // ASSUMMENT: ไฟล์ 06 §7.2 ไม่มีแถวของ "ธุรการ" ในตาราง — อิงจากหน้าที่คีย์ข้อมูลเคส (ไฟล์ 38 §5)
    landing: 'cases:submit',
  },
  manager_inhouse: {
    label: 'ผู้จัดการทีม (Inhouse)', group: 'inhouse',
    menus: ['dashboard', 'cases', 'warehouse', 'reports'],
    caseSubmenus: ['assign'],
    landing: 'cases:assign',
  },
  supervisor_inhouse: {
    label: 'หัวหน้าทีม (Inhouse)', group: 'inhouse',
    menus: ['dashboard', 'cases', 'warehouse', 'reports'],
    caseSubmenus: ['assign'],
    landing: 'cases:assign',
  },
  field_agent_inhouse: {
    label: 'พนักงานติดตามทรัพย์ (Inhouse)', group: 'inhouse',
    menus: ['dashboard', 'cases'],
    caseSubmenus: ['field'],
    landing: 'cases:field',
  },
  manager_outsource: {
    label: 'ผู้จัดการทีม (Outsource)', group: 'outsource',
    menus: ['dashboard', 'cases', 'warehouse', 'reports'],
    caseSubmenus: ['assign'],
    landing: 'cases:assign',
  },
  supervisor_outsource: {
    label: 'หัวหน้าทีม (Outsource)', group: 'outsource',
    menus: ['dashboard', 'cases', 'warehouse', 'reports'],
    caseSubmenus: ['assign'],
    landing: 'cases:assign',
  },
  field_agent_outsource: {
    label: 'พนักงานติดตามทรัพย์ (Outsource)', group: 'outsource',
    menus: ['dashboard', 'cases'],
    caseSubmenus: ['field'],
    landing: 'cases:field',
  },
};

const MENU_LABELS = {
  dashboard: 'แดชบอร์ด', cases: 'จัดการเคส', finance: 'การเงิน',
  accounting: 'บัญชี', warehouse: 'คลังสินค้า', reports: 'รายงาน', settings: 'การตั้งค่า',
};

const CASE_SUBMENU_LABELS = { submit: 'รับเคส', assign: 'มอบหมายงาน', field: 'ติดตามภาคสนาม' };

// ไฟล์ mockup ต้นฉบับที่แต่ละเมนูจะโหลดผ่าน iframe — ห้ามแก้ไฟล์เหล่านี้
const MENU_FILES = {
  finance: 'finance.html',
  accounting: 'accounting.html',
  warehouse: 'warehouse.html',
  reports: 'reports.html',
  settings: 'settings.html',
};
const CASE_SUBMENU_FILES = {
  submit: '38-case-submission-mockup.html',
  assign: '40-case-assignment-mockup.html',
  field: { desktop: '41-field-tracker-desktop-mockup.html', mobile: '41-field-tracker-mobile-mockup.html' },
};

// ความสูง header/nav เดิมของแต่ละไฟล์ mockup (px) — วัดจากคลาส h-14/h-16 ในไฟล์ต้นฉบับจริง
// ใช้ครอบตัดผ่าน CSS เท่านั้น ไม่ได้แก้ไฟล์ต้นฉบับ — 41-desktop ใช้ sidebar อยู่แล้วไม่มี header บน จึงเป็น 0
const FRAME_CROP = {
  'finance.html': 64,
  'settings.html': 64,
  '38-case-submission-mockup.html': 64,
  'accounting.html': 56,
  'warehouse.html': 56,
  'reports.html': 56,
  '40-case-assignment-mockup.html': 56,
  '41-field-tracker-mobile-mockup.html': 64,
  '41-field-tracker-desktop-mockup.html': 0,
};

// ── App State ───────────────────────────────────────────────────────
function getQueryParam(name) {
  return new URLSearchParams(window.location.search).get(name);
}

const state = {
  roleKey: null,
  mainTab: 'dashboard',
  caseSubTab: 'submit',
  fieldView: 'desktop', // desktop | mobile — เฉพาะเมนูติดตามภาคสนาม
};

function init() {
  const roleKey = getQueryParam('role');
  const c = ROLE_CONFIG[roleKey];
  if (!c) {
    window.location.href = 'login.html';
    return;
  }
  state.roleKey = roleKey;
  const [mainTab, subTab] = c.landing.split(':');
  state.mainTab = mainTab;
  if (subTab) state.caseSubTab = subTab;
  render();
}

function cfg() { return ROLE_CONFIG[state.roleKey]; }

function setMainTab(tab) {
  if (!cfg().menus.includes(tab)) return;
  state.mainTab = tab;
  if (tab === 'cases' && !cfg().caseSubmenus.includes(state.caseSubTab)) {
    state.caseSubTab = cfg().caseSubmenus[0];
  }
  render();
}

function setCaseSubTab(sub) {
  if (!cfg().caseSubmenus.includes(sub)) return;
  state.caseSubTab = sub;
  render();
}

function toggleFieldView() {
  state.fieldView = state.fieldView === 'desktop' ? 'mobile' : 'desktop';
  render();
}

function currentIframeSrc() {
  if (state.mainTab === 'dashboard') return null; // ใช้ placeholder แทน iframe
  if (state.mainTab === 'cases') {
    const f = CASE_SUBMENU_FILES[state.caseSubTab];
    if (typeof f === 'string') return f;
    if (f && typeof f === 'object') return f[state.fieldView] || f.desktop;
    return null;
  }
  return MENU_FILES[state.mainTab] || null;
}

// ── Render ──────────────────────────────────────────────────────────
function renderTopNav() {
  const c = cfg();
  const tabs = c.menus.map(m => `
    <button data-action="main-tab" data-id="${m}"
      class="px-4 py-1.5 text-sm font-semibold rounded-md transition-colors focus-ring whitespace-nowrap
        ${state.mainTab === m ? 'bg-slate-900 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-200/60'}">
      ${MENU_LABELS[m]}
    </button>
  `).join('');

  return `
  <header class="bg-white border-b border-slate-200 flex-shrink-0 z-30">
    <div class="max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16 gap-4">
        <div class="flex items-center gap-6 min-w-0">
          <div class="flex items-center space-x-3 flex-shrink-0">
            <div class="bg-slate-900 text-white p-2 rounded">
              <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 9.7a1 1 0 0 1-.68 0C7.5 20.5 4 18 4 13V6a1 1 0 0 1 .76-.97l8-2a1 1 0 0 1 .48 0l8 2c.42.1.76.47.76.97Z"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
            </div>
            <div><span class="font-bold text-lg tracking-tight text-slate-900">AssetRecovery</span><span class="text-[10px] block text-slate-500 font-semibold leading-none mt-0.5">Unified Mockup Shell</span></div>
          </div>
          <nav class="hidden md:flex bg-slate-100 p-1 rounded-lg overflow-x-auto no-scrollbar">${tabs}</nav>
        </div>
        <div class="flex items-center gap-3 flex-shrink-0">
          <div class="text-right hidden sm:block">
            <div class="text-sm font-bold text-slate-900">${c.label}</div>
            <div class="text-[10px] text-slate-500 bg-slate-100 px-1.5 py-0.5 rounded font-mono inline-block">${c.group}</div>
          </div>
          <button data-action="switch-role" class="text-xs font-semibold text-slate-500 hover:text-slate-800 border border-slate-300 rounded-lg px-3 py-1.5 hover:bg-slate-50 focus-ring">
            เปลี่ยนสิทธิ์ / ออกจากระบบ
          </button>
        </div>
      </div>
      <nav class="flex md:hidden bg-slate-100 p-1 rounded-lg overflow-x-auto no-scrollbar mb-2 gap-1">${tabs}</nav>
    </div>
  </header>`;
}

function renderCaseSubNav() {
  if (state.mainTab !== 'cases') return '';
  const c = cfg();
  const subs = c.caseSubmenus.map(s => `
    <button data-action="case-sub-tab" data-id="${s}"
      class="px-3 py-1.5 text-xs font-semibold rounded-md transition-colors focus-ring
        ${state.caseSubTab === s ? 'bg-white text-slate-900 shadow-sm border border-slate-300' : 'text-slate-500 hover:text-slate-800'}">
      ${CASE_SUBMENU_LABELS[s]}
    </button>
  `).join('');
  const fieldToggle = state.caseSubTab === 'field' ? `
    <div class="ml-auto flex items-center gap-2">
      <span class="text-[11px] text-slate-400">มุมมอง:</span>
      <button data-action="toggle-field-view" class="text-[11px] font-semibold text-blue-700 bg-blue-50 border border-blue-200 rounded-md px-2 py-1 hover:bg-blue-100 focus-ring">
        ${state.fieldView === 'desktop' ? 'Desktop (กดดูเวอร์ชันมือถือ)' : 'Mobile (กดดูเวอร์ชัน Desktop)'}
      </button>
    </div>` : '';
  return `
  <div class="bg-slate-50 border-b border-slate-200 flex-shrink-0">
    <div class="max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8 py-2 flex items-center gap-2 overflow-x-auto no-scrollbar">
      ${subs}
      ${fieldToggle}
    </div>
  </div>`;
}

function renderDashboardPlaceholder() {
  const c = cfg();
  return `
  <div class="flex-1 overflow-y-auto flex items-center justify-center p-8">
    <div class="max-w-lg w-full text-center animate-fade-in">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-amber-50 border border-amber-200 text-amber-600 mb-4">
        <svg class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" /></svg>
      </div>
      <h2 class="text-lg font-bold text-slate-900 mb-1.5">แดชบอร์ดรวม (Global Dashboard)</h2>
      <p class="text-sm text-slate-500 mb-4">เมนูนี้ยังไม่มี Mockup จริงในโปรเจกต์ — มีเฉพาะ KPI Dashboard ของโมดูลการเงิน (<code class="font-mono text-xs bg-slate-100 px-1 rounded">14-finance-dashboard.md</code>) หน้านี้เป็น placeholder ชั่วคราวเพื่อให้เมนูกดได้ครบตามที่ร้องขอ รอออกแบบจริงภายหลัง</p>
      <div class="bg-white border border-slate-200 rounded-xl p-4 text-left text-sm space-y-2">
        <div class="flex justify-between"><span class="text-slate-500">สิทธิ์ปัจจุบัน</span><span class="font-semibold text-slate-800">${c.label}</span></div>
        <div class="flex justify-between"><span class="text-slate-500">เมนูที่มีสิทธิ์เข้าถึง</span><span class="font-mono text-xs text-slate-600 text-right">${c.menus.map(m => MENU_LABELS[m]).join(' · ')}</span></div>
      </div>
      <p class="text-xs text-slate-400 mt-4">เลือกเมนูด้านบนเพื่อไปยัง Mockup จริงของแต่ละโมดูล</p>
    </div>
  </div>`;
}

function renderFrame(src) {
  const crop = FRAME_CROP[src] || 0;
  // iframe สูงกว่ากรอบเท่ากับ crop แล้วเลื่อนขึ้น -crop เพื่อซ่อน header เดิมของไฟล์นั้นไว้นอกกรอบที่มองเห็น
  return `
  <div class="frame-wrap">
    <iframe id="content-frame" src="${src}" title="AssetRecovery module"
      style="top:-${crop}px; height:calc(100% + ${crop}px);"></iframe>
  </div>`;
}

function render() {
  const app = document.getElementById('app');
  const src = currentIframeSrc();
  app.innerHTML = `
    ${renderTopNav()}
    ${renderCaseSubNav()}
    ${src ? renderFrame(src) : renderDashboardPlaceholder()}
  `;
  attachEvents();
}

function attachEvents() {
  document.querySelectorAll('[data-action]').forEach(el => {
    el.addEventListener('click', () => {
      const action = el.dataset.action;
      if (action === 'main-tab') setMainTab(el.dataset.id);
      if (action === 'case-sub-tab') setCaseSubTab(el.dataset.id);
      if (action === 'toggle-field-view') toggleFieldView();
      if (action === 'switch-role') window.location.href = 'login.html';
    });
  });
}

init();
</script>
</body>
</html>
