// UI Helpers
function money(n) { return Number(n||0).toLocaleString('th-TH', { minimumFractionDigits: 0 }); }
function statusBadge(s) {
  const map = {
    completed:'bg-emerald-100 text-emerald-800', locked:'bg-emerald-100 text-emerald-800', matched:'bg-emerald-100 text-emerald-800', verified:'bg-emerald-100 text-emerald-800', paid:'bg-emerald-100 text-emerald-800', closed:'bg-emerald-100 text-emerald-800', approved:'bg-emerald-100 text-emerald-800', active:'bg-emerald-100 text-emerald-800', sent:'bg-blue-100 text-blue-800', ready_for_billing:'bg-blue-100 text-blue-800',
    checking:'bg-amber-100 text-amber-800', collecting:'bg-amber-100 text-amber-800', pending:'bg-amber-100 text-amber-800', manager_review:'bg-amber-100 text-amber-800', finance_review:'bg-amber-100 text-amber-800', waiting_settlement:'bg-purple-100 text-purple-800', draft:'bg-slate-100 text-slate-700',
    critical:'bg-red-100 text-red-800', open:'bg-red-100 text-red-800', unmatched:'bg-red-100 text-red-800', suspended:'bg-red-100 text-red-800', deactivated:'bg-red-100 text-red-800'
  };
  return `<span class="text-[10px] px-2 py-0.5 rounded-full font-bold uppercase tracking-wide ${map[s]||'bg-slate-100 text-slate-700'}">${s.replace('_', ' ')}</span>`;
}
function btnAction(label, action, type='', id='', cls='text-slate-600 hover:bg-slate-50 border-slate-300 bg-white') {
  return `<button data-action="${action}" data-type="${type}" data-id="${id}" class="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-semibold border transition-colors focus-ring shadow-sm ${cls}">${label}</button>`;
}
function formInput(id, label, val, type='text', placeholder='', required=false, extraAttr='') {
  const disabledClass = extraAttr.includes('disabled') ? 'bg-slate-50 text-slate-400' : '';
  return `<div><label class="block text-sm font-medium text-slate-700 mb-1">${label} ${required?'<span class="text-red-500">*</span>':''}</label><input type="${type}" id="${id}" value="${val}" placeholder="${placeholder}" ${extraAttr} class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus-ring ${disabledClass}"></div>`;
}
function formSelect(id, label, options, selectedVal) {
  return `<div><label class="block text-xs font-bold text-slate-700 mb-1">${label} <span class="text-red-500">*</span></label><select id="${id}" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus-ring">${options.map(o => `<option value="${o.val}" ${o.val===selectedVal?'selected':''}>${o.text}</option>`).join('')}</select></div>`;
}

function renderCompensationContent() {

    <div class="grid grid-cols-2 gap-3 mb-4">
      <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-100 col-span-2"><span class="text-slate-400 block text-[10px] uppercase font-bold tracking-wider mb-1">⛽ ค่าน้ำมัน (${ct.fuel.mode})</span><span class="font-bold text-slate-800 text-sm">${fuelLabel}</span></div>
      <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-100"><span class="text-slate-400 block text-[10px] uppercase font-bold tracking-wider mb-1">🍽️ เบี้ยเลี้ยง</span><span class="font-bold text-slate-800 text-sm">${ct.allowance} <span class="font-medium text-xs text-slate-500">บาท/วัน</span></span></div>

      <div class="bg-emerald-50 p-2.5 rounded-lg border border-emerald-100"><span class="text-emerald-600 block text-[10px] uppercase font-bold tracking-wider mb-1">✅ Commission (สำเร็จ)</span><span class="font-bold text-emerald-700 text-sm">${ct.commission} <span class="font-medium text-xs">บาท/เคส</span></span></div>
      <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-100"><span class="text-slate-400 block text-[10px] uppercase font-bold tracking-wider mb-1">🔄 เบี้ยเสี่ยง (ไม่สำเร็จ)</span><span class="font-bold text-slate-700 text-sm">${ct.noSuccessFee} <span class="font-medium text-xs text-slate-500">บาท/เคส</span></span></div>
    </div>
    ${ct.wht && ct.whtPct > 0 ? `<div class="text-[11px] text-amber-800 font-bold bg-amber-100 px-2.5 py-1 rounded inline-block mb-3 border border-amber-200">⚠️ หัก ณ ที่จ่าย ${ct.whtPct}% อัตโนมัติ</div>` : '<div class="text-[11px] text-slate-400 bg-slate-50 px-2.5 py-1 rounded inline-block mb-3 border border-slate-200">ไม่หัก WHT</div>'}
    <div class="pt-3 border-t border-slate-100 text-right"><button data-action="open-edit-comp" data-id="${ct.id}" class="text-xs text-slate-600 hover:text-slate-900 font-semibold px-3 py-1.5 border border-slate-200 rounded hover:bg-slate-50">⚙️ แก้ไขข้อมูล</button></div></div>`;

function renderServiceFeeContent() {
  // เปลี่ยนจากตารางเป็นการ์ด (04/07/2569 — คำขอ Product Owner: คอลัมน์เยอะ ตารางแสดงข้อมูลไม่พอ)
  // pattern เดียวกับการ์ดแผนค่าตอบแทน (renderCompensationContent) · สูตร/เงื่อนไขตามไฟล์ 12 §6.1-6.3
  const MODEL_BADGE = { SUCCESS_FEE: 'bg-emerald-100 text-emerald-800', FLAT: 'bg-blue-100 text-blue-800', HYBRID: 'bg-purple-100 text-purple-800' };
  const basisTh = b => b === 'debt_amount' ? 'มูลค่าหนี้คงเหลือ' : 'มูลค่าเครื่อง';
  return `<div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6"><div class="flex items-center justify-between mb-4"><h2 class="text-lg font-bold text-slate-900">เทมเพลตค่าบริการ (รับเข้า)</h2><button data-action="open-create-sf" class="flex items-center gap-1.5 bg-slate-900 text-white px-3 py-1.5 rounded-lg text-xs font-medium hover:bg-slate-800 focus-ring">${Icon.plus} สร้างเทมเพลต</button></div>
  <p class="text-xs text-slate-500 mb-4">ฐานคำนวณ "รายได้" (Revenue) ที่เรียกเก็บจากบริษัทไฟแนนซ์ — ตรงข้ามกับแผนค่าตอบแทน (จ่ายออก) · 3 model ตามไฟล์ 12 §6: SUCCESS_FEE / FLAT / HYBRID · ผูกกับบริษัทไฟแนนซ์ทุกรายเสมอ (ไฟล์ 10 §9)</p>
  <div class="grid grid-cols-1 xl:grid-cols-2 gap-4">${store.serviceFeeTemplates.map(sf => {
    const basisLabel = sf.basis ? basisTh(sf.basis) : null;
    // สูตรตามไฟล์ 12 §6.1-6.3
    const okFormula = sf.model === 'SUCCESS_FEE' ? `${sf.rate}% × ${basisLabel}`
      : sf.model === 'FLAT' ? `${sf.base.toLocaleString('th-TH')} บาท (เหมาคงที่)`
      : `${sf.base.toLocaleString('th-TH')} บาท + ${sf.rate}% × ${basisLabel}`;
    const failFormula = sf.model === 'SUCCESS_FEE' ? 'ไม่เรียกเก็บ (0 บาท)'
      : (sf.chargeOnFail ? `${sf.base.toLocaleString('th-TH')} บาท (base — charge_on_fail)` : 'ไม่เรียกเก็บ (0 บาท)');
    return `<div class="border border-slate-200 rounded-lg p-5 shadow-sm">
    <div class="flex justify-between items-start mb-4">
      <div>
        <div class="font-bold text-slate-900 text-base">${sf.name}</div>
        <span class="inline-block mt-1 px-2 py-0.5 rounded text-[10px] font-bold uppercase ${MODEL_BADGE[sf.model] || 'bg-slate-100 text-slate-700'}">${sf.model}</span>
      </div>
      ${sf.active ? `<span class="px-2 py-0.5 bg-emerald-100 text-emerald-800 rounded-full text-[10px] font-bold shrink-0">ใช้งาน</span>` : `<span class="px-2 py-0.5 bg-slate-100 text-slate-500 rounded-full text-[10px] font-bold shrink-0">ปิดใช้งาน</span>`}
    </div>
    <div class="grid grid-cols-2 gap-3 mb-4">
      <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-100"><span class="text-slate-400 block text-[10px] uppercase font-bold tracking-wider mb-1">💰 ค่าเปิดเคส (Base)</span><span class="font-bold text-slate-800 text-sm">${sf.base > 0 ? sf.base.toLocaleString('th-TH') + ' บาท' : '—'}</span></div>
      <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-100"><span class="text-slate-400 block text-[10px] uppercase font-bold tracking-wider mb-1">📊 อัตราความสำเร็จ</span><span class="font-bold text-slate-800 text-sm">${sf.rate > 0 ? `${sf.rate}% <span class="font-medium text-xs text-slate-500">× ${basisLabel}</span>` : '—'}</span></div>
      <div class="bg-emerald-50 p-2.5 rounded-lg border border-emerald-100 col-span-2"><span class="text-emerald-600 block text-[10px] uppercase font-bold tracking-wider mb-1">✅ เคสสำเร็จ (closed_success) เรียกเก็บ</span><span class="font-bold text-emerald-700 text-sm">${okFormula}</span></div>
      <div class="${sf.model !== 'SUCCESS_FEE' && sf.chargeOnFail ? 'bg-amber-50 border-amber-100' : 'bg-slate-50 border-slate-100'} p-2.5 rounded-lg border col-span-2"><span class="${sf.model !== 'SUCCESS_FEE' && sf.chargeOnFail ? 'text-amber-600' : 'text-slate-400'} block text-[10px] uppercase font-bold tracking-wider mb-1">🔄 เคสไม่สำเร็จ (closed_fail) เรียกเก็บ</span><span class="font-bold ${sf.model !== 'SUCCESS_FEE' && sf.chargeOnFail ? 'text-amber-700' : 'text-slate-600'} text-sm">${failFormula}</span></div>
    </div>
    ${sf.model === 'SUCCESS_FEE'
      ? '<div class="text-[11px] text-slate-400 bg-slate-50 px-2.5 py-1 rounded inline-block mb-3 border border-slate-200">เก็บเฉพาะเคสสำเร็จโดยนิยามของโมเดล (§6.1) — ไม่มีตัวเลือก charge_on_fail</div>'
      : (sf.chargeOnFail
        ? '<div class="text-[11px] text-amber-800 font-bold bg-amber-100 px-2.5 py-1 rounded inline-block mb-3 border border-amber-200">⚠️ charge_on_fail = true — เก็บค่า base เสมอไม่ว่าผลจะเป็นอย่างไร</div>'
        : '<div class="text-[11px] text-slate-400 bg-slate-50 px-2.5 py-1 rounded inline-block mb-3 border border-slate-200">charge_on_fail = false — เรียกเก็บเฉพาะเคสสำเร็จ</div>')}
    <div class="pt-3 border-t border-slate-100 text-right"><button data-action="open-edit-sf" data-id="${sf.id}" class="text-xs text-slate-600 hover:text-slate-900 font-semibold px-3 py-1.5 border border-slate-200 rounded hover:bg-slate-50">⚙️ แก้ไขข้อมูล</button></div>
    </div>`;
  }).join('')}</div></div>`;
}

function renderSettingsCycles() {
  const cycles = store.finSettings.cycles;
  return `<div class="flex items-center justify-between mb-4"><h2 class="text-lg font-bold text-slate-900">รอบบิลและรอบจ่าย (Cycles)</h2><button data-action="open-modal" data-type="fin-cycle-form" class="bg-emerald-50 border border-emerald-200 text-emerald-700 px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1 shadow-sm hover:bg-emerald-100">${Icon.plus} เพิ่มรอบ</button></div>

function renderSettingsApprovals() {

function renderToast() {
  if (!state.toast) return '';
  return `
  <div class="fixed bottom-6 right-6 z-50 animate-[fadeIn_0.3s_ease-out]">

    </div>
  </div>`;
}
 
// ===================== MAIN RENDER =====================
function render() {
  const app = document.getElementById('app');
  // Settings-only version: force the app to render only the Settings module.
  state.mainTab = 'settings';
  const mainContent = renderSettingsLayout();
 
  app.innerHTML = renderTopNav() + `<main class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">${mainContent}</main>` + renderModal() + renderToast();
}
 
// ===================== GLOBAL EVENT LISTENERS =====================
document.addEventListener('click', (e) => {
  if (e.target.id === 'modalBackdrop') { closeModal(); return; }
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;
 
  // Main Tabs
  if (action === 'set-main') setState({ mainTab: 'settings' });
  
  // Settings Top Tabs
  else if (action === 'set-settings-toptab') setState({ settingsTopTab: el.dataset.id });
 
  // Sub Tabs
  else if (action === 'set-sub') {
    const parent = el.dataset.parent;
    resetFilters();
    setState({ [parent]: el.dataset.id });
  }
  
  // General Settings Specific Actions
  else if (action === 'set-settings-tab') {
    resetFilters();
    setState({ settingsTab: el.dataset.tab, mainTab: 'settings' });
  }
  else if (action === 'set-roles-subtab') {
    resetFilters();
    setState({ rolesSubTab: el.dataset.subtab });
  }
  else if (action === 'set-roles-tracker-filter') {
    setState({ rolesTrackerFilter: el.dataset.filter });
  }
  else if (action === 'set-teams-side') {
    resetFilters();
    setState({ teamsSide: el.dataset.side });
  }
  else if (action === 'set-users-subtab') {
    resetFilters();
    setState({ usersSubTab: el.dataset.subtab });
  }
  else if (action === 'set-tracker-filter') {
    setState({ trackerFilter: el.dataset.filter });
  }
  else if (action === 'open-create-role' || action === 'open-create-team' || action === 'open-create-company' || action === 'open-create-user' || action === 'open-create-comp' || action === 'open-create-sf') {
    openModal(action.replace('open-', ''), { isEdit: false });
  }
  else if (action === 'open-edit-team' || action === 'open-edit-company' || action === 'open-edit-user' || action === 'open-edit-comp' || action === 'open-edit-sf') {
    const type = action.replace('open-', '');
    const dataKey = type === 'edit-team' ? 'team' : type === 'edit-company' ? 'company' : type === 'edit-user' ? 'user' : 'id';
    openModal(type, { id: el.dataset[dataKey], isEdit: true });
  }
  else if (action === 'edit-permission') {
    openModal('edit-permission', { id: el.dataset.role });
  }
  else if (action === 'try-delete-role') {
    showToast('ไม่สามารถลบ Role นี้ได้ (มีผู้ใช้งาน หรือเป็น Role พื้นฐาน)', 'error');
  }
  else if (action === 'audit-filter-export') {
    openModal('audit-filter-export', {});
  }
 
  // Modal Triggers
  else if (action === 'open-modal' || action === 'generic-detail') {
    openModal(el.dataset.type || 'generic-detail', { id: el.dataset.id });
  }
  else if (action === 'close-modal') closeModal();
  
  // Actions
  else if (action === 'toast') {
    closeModal();
    showToast(el.dataset.msg || 'ดำเนินการสำเร็จ', 'success');
  }
  else if (action === 'save-modal') {
    const { type } = state.modal;
    const exportTypes = ['billing-file', 'export-pack', 'audit-filter-export', 'payment-file', 'download-wht-cert'];
    const readOnlyTypes = ['generic-detail', 'payout-detail', 'revenue-calc-detail', 'profit-drilldown', 'accounting-checklist'];
    
    let saveMsg = 'บันทึกข้อมูลเรียบร้อยแล้ว';
    if (exportTypes.includes(type)) saveMsg = 'เตรียมไฟล์สำเร็จ เริ่มดาวน์โหลดเอกสาร';
    else if (type === 'action-approve-claim') saveMsg = 'อนุมัติรายการสำเร็จ';
    else if (type === 'action-reject-claim') saveMsg = 'ปฏิเสธรายการสำเร็จ';
    else if (type === 'action-clear-advance') saveMsg = 'เคลียร์ยอดเงินทดรองสำเร็จ';
 
    closeModal();
    if (!readOnlyTypes.includes(type)) {
      showToast(saveMsg, 'success');
    }
  }
});
 
// Fuel mode toggle helper (ใช้ใน compensation modal)
window.switchFuelMode = function(mode) {
  document.getElementById('m_ctFuelMode').value = mode;
  const pkmWrap  = document.getElementById('fuel-pkm-wrap');
  const flatWrap = document.getElementById('fuel-flat-wrap');
  const btnPkm   = document.getElementById('fuel-btn-pkm');
  const btnFlat  = document.getElementById('fuel-btn-flat');
  if (!pkmWrap || !flatWrap) return;
  if (mode === 'PER_KM') {
    pkmWrap.classList.remove('hidden');
    flatWrap.classList.add('hidden');
    btnPkm.classList.add('bg-white','shadow','text-slate-900');
    btnPkm.classList.remove('text-slate-500');
    btnFlat.classList.remove('bg-white','shadow','text-slate-900');
    btnFlat.classList.add('text-slate-500');
  } else {
    flatWrap.classList.remove('hidden');
    pkmWrap.classList.add('hidden');
    btnFlat.classList.add('bg-white','shadow','text-slate-900');
    btnFlat.classList.remove('text-slate-500');
    btnPkm.classList.remove('bg-white','shadow','text-slate-900');
    btnPkm.classList.add('text-slate-500');
  }
};

// Init
render();
