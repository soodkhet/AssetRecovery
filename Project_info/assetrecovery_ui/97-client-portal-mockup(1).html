const TZ = 'Asia/Bangkok';
function toBKK(d=new Date()){return new Date(d.toLocaleString('en-US',{timeZone:TZ}));}
function fmtDate(d=new Date()){const b=toBKK(d instanceof Date?d:new Date(d));return `${String(b.getDate()).padStart(2,'0')}/${String(b.getMonth()+1).padStart(2,'0')}/${b.getFullYear()+543}`;}
function nowDate(){return fmtDate(new Date());}

// STATUS LABEL MAPPING — ตาม 97-client-portal.md §10.1 / §10.2

function caseStatusInfo(c){
  if (c.internalStatus === 'rejected') return { label: 'ไม่รับเคส', cls: 'bg-red-100 text-red-800' };
  if (c.internalStatus === 'need_info') return { label: 'ขอข้อมูลเพิ่มเติม', cls: 'bg-purple-100 text-purple-800' };
  if (c.internalStatus === 'draft' || c.internalStatus === 'pending_review') return { label: 'อยู่ระหว่างตรวจสอบ', cls: 'bg-slate-100 text-slate-700' };
  if (c.internalStatus === 'approved') {
    if (c.fieldStatus === 'closed_success') return { label: 'ติดตามสำเร็จ', cls: 'bg-emerald-100 text-emerald-800' };
    if (c.fieldStatus === 'closed_fail') return { label: 'ติดตามไม่สำเร็จ', cls: 'bg-slate-200 text-slate-600' };
    return { label: 'กำลังดำเนินการติดตาม', cls: 'bg-amber-100 text-amber-800' };
  }
  return { label: c.internalStatus, cls: 'bg-slate-100 text-slate-700' };
}
function billingStatusInfo(s){
  const map = {
    sent: ['ส่งบิลแล้ว', 'bg-blue-100 text-blue-800'],
    partially_paid: ['ชำระบางส่วน', 'bg-cyan-100 text-cyan-800'],
    paid: ['ชำระครบแล้ว', 'bg-emerald-100 text-emerald-800'],
  };
  const [label, cls] = map[s] || [s, 'bg-slate-100 text-slate-700'];
  return { label, cls };
}
function invoiceStatusInfo(s){
  return s === 'active' ? { label: 'ใช้งานอยู่', cls: 'bg-emerald-100 text-emerald-800' } : { label: 'ยกเลิกแล้ว', cls: 'bg-red-100 text-red-800' };
}
function lotStatusInfo(l){
  const map = {
    pending_attach: ['รอดำเนินการส่งมอบ', 'bg-amber-100 text-amber-800'],
    pending_delivery_proof: ['จัดส่งแล้ว รอยืนยัน', 'bg-amber-100 text-amber-800'],
    confirmed: ['ส่งมอบสำเร็จ', 'bg-emerald-100 text-emerald-800'],
  };
  const [label, cls] = map[l.status] || [l.status, 'bg-slate-100 text-slate-700'];
  return { label, cls };
}
function conditionInfo(c){
  const map = { normal: ['สภาพปกติ', 'bg-emerald-100 text-emerald-800'], damaged: ['ชำรุด', 'bg-red-100 text-red-800'], partial_loss: ['สูญหายบางส่วน', 'bg-amber-100 text-amber-800'] };
  const [label, cls] = map[c] || [c, 'bg-slate-100 text-slate-700']; return { label, cls };
}
// ค้นหา asset ที่ตรงกับเคส (ผ่าน caseRef) ข้ามทุก Lot — ใช้แสดงรูปสินค้าตอนรับเข้าคลังในการ์ดเคสสำเร็จ
// (ไม่ใช่หลักฐานปิดงานภาคสนามจากไฟล์ 41 ซึ่งมี GPS/วิดีโอ/เสียงที่อ่อนไหวกว่า)
function findAssetByCaseRef(caseRef){
  for (const lotId in store.assetsByLot) {
    const found = store.assetsByLot[lotId].find(a => a.caseRef === caseRef);
    if (found) return { asset: found, lotId };
  }
  return null;
}

// ═══════════════════════════════════════════════════════
// SHARED: KPI Card / Table Container
// ═══════════════════════════════════════════════════════
function kpi(label, value, sub, color='slate'){
  const c = { slate:'text-slate-700 bg-slate-50 border-slate-100', emerald:'text-emerald-700 bg-emerald-50 border-emerald-100', amber:'text-amber-700 bg-amber-50 border-amber-100', blue:'text-blue-700 bg-blue-50 border-blue-100', red:'text-red-700 bg-red-50 border-red-100' }[color] || 'text-slate-700 bg-slate-50 border-slate-100';
  return `<div class="bg-white border ${c.split(' ')[2]} rounded-xl p-5 shadow-sm">
    <div class="text-xs text-slate-500 font-bold uppercase tracking-wider">${label}</div>
    <div class="mt-2 text-2xl font-extrabold ${c.split(' ')[0]}">${value}</div>
    ${sub ? `<div class="mt-1 text-[11px] font-medium text-slate-500 bg-white inline-block px-2 py-0.5 rounded border border-slate-100">${sub}</div>` : ''}
  </div>`;
}
function pageHeader(title, sub){
  return `<div class="mb-6"><h1 class="text-2xl font-bold tracking-tight text-slate-900">${title}</h1>${sub ? `<p class="text-sm text-slate-500 mt-1">${sub}</p>` : ''}</div>`;
}

function sectionHeader(title, tabKey, sub){
  return `<button data-action="nav" data-tab="${tabKey}" class="w-full flex items-center justify-between mb-3 focus-ring text-left hover:opacity-80">
    <div>
      <div class="font-bold text-slate-800">${title}</div>
      ${sub ? `<div class="text-[13px] text-slate-400">${sub}</div>` : ''}
    </div>
    <span class="text-slate-300">${SVG.eye}</span>
  </button>`;
}

// TAB: DASHBOARD — สรุปทุกหมวดในหน้าเดียว (ไม่ใช่รายงานละเอียด, ไม่ซ้ำกับ list ในแต่ละเมนู) + รวม Reports เดิม

      <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6">
        ${sectionHeader('การเงิน', 'billing', unpaidBatches + ' รอบวางบิลยังไม่ชำระครบ')}
        <div class="grid grid-cols-2 gap-4">
          ${kpi('ยอดค้างชำระรวม', '฿ ' + money(totalAR), 'ทุกรอบที่ยังไม่ paid', 'red')}
          ${kpi('ใบกำกับภาษีล่าสุด', activeInvoice ? activeInvoice.invoiceNumber : '—', activeInvoice ? 'ออกเมื่อ ' + activeInvoice.issueDate : '', 'blue')}
        </div>
      </div>
      <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6">
        ${sectionHeader('ใบส่งมอบทรัพย์', 'handover', store.handoverLots.length + ' Lot ทั้งหมด')}
        <div class="grid grid-cols-2 gap-4">

        <th class="px-4 py-3">เดือน</th><th class="px-4 py-3 text-right">ยอดเรียกเก็บ</th><th class="px-4 py-3 text-right">เคสทั้งหมด</th><th class="px-4 py-3 text-right">สำเร็จ</th><th class="px-4 py-3 text-right">ไม่สำเร็จ</th>
      </tr></thead><tbody class="divide-y divide-slate-100">

  </div>`;
}

    </div>
    <div class="border border-slate-200 rounded-lg overflow-hidden">

  const filteredLots = store.handoverLots.filter(l => state.handoverFilter === 'all' || lotStatusInfo(l).label === state.handoverFilter);
  return `
  ${pageHeader('ใบส่งมอบทรัพย์', 'สถานะการส่งมอบทรัพย์คืนของ ' + store.currentCompany.name)}
  <div class="flex flex-wrap items-center gap-2 mb-5">
    <select onchange="S({handoverFilter:this.value})" class="border border-slate-300 rounded-lg px-3 py-2 text-sm focus-ring bg-white">
      <option value="all" ${state.handoverFilter==='all'?'selected':''}>สถานะทั้งหมด</option>
      ${filterOptions.map(f=>`<option value="${f}" ${state.handoverFilter===f?'selected':''}>${f}</option>`).join('')}
    </select>
    <div class="text-xs text-slate-400 ml-auto">ทั้งหมด ${filteredLots.length} Lot</div>
  </div>
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
    ${filteredLots.map(l => { const info = lotStatusInfo(l); const canDownload = l.status === 'confirmed'; return `
    <div data-action="open-modal" data-type="lot-detail" data-id="${l.id}" class="bg-white rounded-xl border border-slate-200 shadow-sm p-5 hover:border-indigo-300 hover:shadow-md transition-all cursor-pointer">
      <div class="flex items-center justify-between mb-3">
        <span class="text-[13px] px-2 py-0.5 rounded-full font-bold uppercase ${l.type==='finance_pickup'?'bg-blue-100 text-blue-700':'bg-orange-100 text-orange-700'}">${l.type==='finance_pickup'?'🏢 รับเอง':'🚚 จัดส่ง'}</span>
        ${badge(info)}
      </div>
      <div class="font-mono font-bold text-slate-800 text-sm">${l.id}</div>
      <div class="text-xs text-slate-400 mt-0.5">เลขที่ใบส่งมอบ: ${l.docRef}</div>
      <div class="text-xs text-slate-500 mt-2">จำนวนเครื่อง: ${l.assetCount} เครื่อง · คลิกเพื่อดูรายการ</div>
      ${l.confirmedAt ? `<div class="text-xs text-emerald-600 mt-1">ยืนยันเมื่อ ${l.confirmedAt}</div>` : ''}
      <div class="border-t border-slate-100 mt-4 pt-3">
        ${canDownload
          ? `<button data-action="download" data-label="ใบส่งมอบ ${l.docRef}" class="w-full text-xs font-semibold text-blue-700 border border-blue-200 bg-blue-50 rounded-lg px-3 py-2 hover:bg-blue-100 focus-ring inline-flex items-center justify-center gap-1">${SVG.download} ดาวน์โหลดใบส่งมอบ</button>`
          : `<button disabled class="w-full text-xs font-semibold text-slate-400 border border-slate-200 bg-slate-50 rounded-lg px-3 py-2 cursor-not-allowed inline-flex items-center justify-center gap-1">${SVG.lock} รอยืนยันส่งมอบก่อนดาวน์โหลดได้</button>`}
      </div>
    </div>`}).join('')}
    ${filteredLots.length===0 ? `<div class="col-span-full text-center text-slate-400 text-sm py-10">ไม่พบ Lot ที่ตรงกับเงื่อนไข</div>` : ''}
  </div>`;
}

// ═══════════════════════════════════════════════════════
// SHARED: Bar Chart (ใช้ใน Dashboard)
// ═══════════════════════════════════════════════════════
function barChart(data, xKey, yKey, color, maxH=90){
  const max = Math.max(...data.map(d=>d[yKey]), 1);
  return `<div class="flex items-end gap-2 h-32">
    ${data.map(d => `<div class="flex-1 flex flex-col items-center gap-1">
      <div class="text-[12px] text-slate-500 font-semibold">${money(d[yKey])}</div>
      <div style="height:${Math.max(4,(d[yKey]/max)*maxH)}px; background:${color}" class="w-full rounded-t-md"></div>
      <div class="text-[12px] text-slate-400">${d[xKey]}</div>
    </div>`).join('')}
  </div>`;
}

// TAB: ข้อมูลบริษัท (10 §7.1 read-only)
// ═══════════════════════════════════════════════════════

  return `
  ${pageHeader('ข้อมูลบริษัท', 'ดูอย่างเดียว — หากต้องการแก้ไข กรุณาติดต่อเจ้าหน้าที่ภายใน')}
  <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6 max-w-xl">
    ${row('ชื่อบริษัท', co.name)}
    ${row('เลขประจำตัวผู้เสียภาษี', `<span class="font-mono">${co.taxId}</span>`)}
    ${row('ที่อยู่จดทะเบียน', co.address)}
    ${row('เบอร์โทรสำนักงาน', co.phone)}
    ${row('ผู้ติดต่อประจำวัน', `${co.contactName} (${co.contactPhone})`)}
    ${row('ผู้มีอำนาจลงนาม', co.signerName)}
    ${row('จดทะเบียน VAT', co.vatRegistered ? 'ใช่' : 'ไม่')}
    ${row('เทมเพลตค่าบริการที่ผูกอยู่', co.serviceFeeTemplateName)}

  <div class="mt-4 bg-amber-50 border border-amber-200 rounded-lg p-4 text-xs text-amber-800 max-w-xl">
    ต้องการแก้ไขข้อมูลบริษัทหรือจัดการผู้ใช้งานในบริษัทของท่าน กรุณาติดต่อเจ้าหน้าที่ AssetRecovery โดยตรง — พอร์ทัลนี้ไม่รองรับการแก้ไขข้อมูลด้วยตนเอง

// ═══════════════════════════════════════════════════════
// MODAL: รายละเอียดเคส
// ═══════════════════════════════════════════════════════
function renderModal(){
  if (!state.modal) return '';
  const { type, id } = state.modal;
  let body = '', title = '', footer = '', maxWidth = 'max-w-md';

  if (type === 'case-detail') {
    const c = store.cases.find(x=>x.id===id);
    const info = caseStatusInfo(c);
    const isSuccess = info.label === 'ติดตามสำเร็จ';
    const match = isSuccess ? findAssetByCaseRef(c.caseRef) : null;
    title = `รายละเอียดเคส ${c.caseRef}`;
    body = `
      <div class="space-y-3 text-sm">
        <div class="flex justify-between"><span class="text-slate-400">สถานะ</span>${badge(info)}</div>
        <div class="flex justify-between"><span class="text-slate-400">ลูกหนี้</span><span class="font-semibold">${c.debtor}</span></div>
        <div class="flex justify-between"><span class="text-slate-400">วันที่รับเคส</span><span>${c.createdAt}</span></div>
        ${c.recycleRound > 1 ? `<div class="flex justify-between"><span class="text-slate-400">รอบการติดตาม</span><span class="font-semibold text-violet-700">รอบที่ ${c.recycleRound}</span></div>` : ''}
        ${c.reason ? `<div class="bg-amber-50 border border-amber-200 rounded-lg p-3 text-xs text-amber-800 mt-2"><b>หมายเหตุจากเจ้าหน้าที่:</b><br/>${c.reason}</div>` : ''}

        ${match ? `
        <div class="pt-3 border-t border-slate-100">
          <div class="text-xs font-bold text-slate-600 mb-1">รูปสินค้า (แนบตอนรับเข้าคลัง)</div>
          <div class="text-sm font-semibold text-slate-800 mb-1.5">${match.asset.model}</div>
          <div class="flex items-center gap-2 mb-2">
            <span class="text-slate-500 text-xs">สภาพเครื่อง</span>${badge(conditionInfo(match.asset.condition))}
            <span class="text-[13px] text-slate-400 ml-auto">อยู่ใน Lot <span class="font-mono">${match.lotId}</span></span>
          </div>
          <div class="grid grid-cols-4 gap-2">
            ${match.asset.photos.map(label => `
            <button data-action="download" data-label="ภาพ: ${label}" class="flex flex-col items-center gap-1 focus-ring">
              <div class="w-full aspect-square rounded-lg bg-slate-100 border border-slate-200 flex items-center justify-center text-slate-400">${SVG.camera}</div>
              <div class="text-[11px] text-slate-500 text-center leading-tight">${label}</div>
            </button>`).join('')}
          </div>
          ${match.asset.conditionNote ? `<div class="bg-amber-50 border border-amber-200 rounded-lg p-3 text-xs text-amber-800 mt-2"><b>หมายเหตุสภาพเครื่อง:</b><br/>${match.asset.conditionNote}</div>` : ''}
        </div>` : ''}

        <div class="text-[14px] text-slate-400 pt-2 border-t border-slate-100 mt-3">รายละเอียดภาคสนาม (ผู้รับผิดชอบ / วันนัดหมาย / พิกัด GPS / วิดีโอ-เสียงหน้างาน) ไม่แสดงในพอร์ทัลนี้ — ตามนโยบายขอบเขตข้อมูล</div>
      </div>`;
  }

  else if (type === 'lot-detail') {
    const l = store.handoverLots.find(x=>x.id===id);
    const info = lotStatusInfo(l);
    const assets = store.assetsByLot[l.id] || [];
    const canDownload = l.status === 'confirmed';
    maxWidth = 'max-w-lg';
    title = `รายการทรัพย์ใน ${l.id}`;
    body = `
      <div class="space-y-3">
        <div class="flex items-center justify-between">
          <span class="text-[13px] px-2 py-0.5 rounded-full font-bold uppercase ${l.type==='finance_pickup'?'bg-blue-100 text-blue-700':'bg-orange-100 text-orange-700'}">${l.type==='finance_pickup'?'🏢 รับเอง':'🚚 จัดส่ง'}</span>
          ${badge(info)}
        </div>
        <div class="text-xs text-slate-400">เลขที่ใบส่งมอบ <span class="font-mono font-semibold text-slate-700">${l.docRef}</span> · ${assets.length} เครื่อง</div>
        <div class="space-y-2 pt-1 max-h-80 overflow-y-auto pr-1">
          ${assets.map((a,idx) => `
          <button data-action="open-modal" data-type="asset-detail" data-id="${a.id}" class="w-full text-left border border-slate-100 rounded-lg p-3 bg-slate-50 hover:border-indigo-300 hover:bg-white transition-colors flex items-center justify-between gap-2 focus-ring">
            <div class="min-w-0">
              <div class="flex items-center gap-2">
                <span class="font-mono text-xs font-bold text-slate-700">${a.caseRef}</span>
                <span class="text-[13px] text-slate-400">#${idx+1}</span>
              </div>
              <div class="text-sm font-semibold text-slate-800 mt-1 truncate">${a.debtor}</div>
              <div class="text-xs text-slate-500 mt-0.5 truncate">${a.model}</div>
            </div>
            <span class="text-slate-300 shrink-0">${SVG.eye}</span>
          </button>`).join('')}
        </div>
      </div>`;
    footer = canDownload
      ? `<button data-action="download" data-label="ใบส่งมอบ ${l.docRef}" class="text-xs font-semibold text-blue-700 border border-blue-200 bg-blue-50 rounded-lg px-4 py-2 hover:bg-blue-100 focus-ring inline-flex items-center gap-1 mr-auto">${SVG.download} ดาวน์โหลดใบส่งมอบ</button>`
      : `<button disabled class="text-xs font-semibold text-slate-400 border border-slate-200 bg-slate-50 rounded-lg px-4 py-2 cursor-not-allowed inline-flex items-center gap-1 mr-auto">${SVG.lock} รอยืนยันก่อนดาวน์โหลด</button>`;
  }

  else if (type === 'asset-detail') {
    let found = null, lotId = null;
    for (const lid in store.assetsByLot) { const a = store.assetsByLot[lid].find(x=>x.id===id); if (a) { found = a; lotId = lid; break; } }
    const a = found;
    title = 'รายละเอียดทรัพย์';
    body = `
      <div class="space-y-3 text-sm">
        <div class="flex justify-between"><span class="text-slate-400">เลขที่สัญญา</span><span class="font-mono font-bold">${a.caseRef}</span></div>
        <div class="flex justify-between"><span class="text-slate-400">ลูกหนี้</span><span class="font-semibold">${a.debtor}</span></div>
        <div class="flex justify-between"><span class="text-slate-400">รุ่นเครื่อง</span><span class="font-semibold text-right">${a.model}</span></div>
        <div class="flex justify-between items-center"><span class="text-slate-400">สภาพเครื่อง</span>${badge(conditionInfo(a.condition))}</div>
        <div class="flex justify-between"><span class="text-slate-400">วันที่รับเข้าคลัง</span><span>${a.receivedAt}</span></div>
        <div class="flex justify-between"><span class="text-slate-400">อยู่ใน Lot</span><span class="font-mono font-semibold">${lotId}</span></div>
        ${a.conditionNote ? `<div class="bg-amber-50 border border-amber-200 rounded-lg p-3 text-xs text-amber-800"><b>หมายเหตุสภาพเครื่อง:</b><br/>${a.conditionNote}</div>` : ''}
        <div class="pt-2 border-t border-slate-100">
          <div class="text-xs font-bold text-slate-600 mb-2">ภาพถ่ายสภาพเครื่อง (ถ่ายตอนรับเข้าคลัง)</div>
          <div class="grid grid-cols-4 gap-2">
            ${a.photos.map(label => `
            <button data-action="download" data-label="ภาพ: ${label}" class="flex flex-col items-center gap-1 focus-ring">
              <div class="w-full aspect-square rounded-lg bg-slate-100 border border-slate-200 flex items-center justify-center text-slate-400">${SVG.camera}</div>
              <div class="text-[11px] text-slate-500 text-center leading-tight">${label}</div>
            </button>`).join('')}
          </div>
        </div>
        <div class="pt-2 border-t border-slate-100">
          <div class="text-xs font-bold text-slate-600 mb-2">เอกสารที่เกี่ยวข้อง</div>
          <button data-action="open-modal" data-type="lot-detail" data-id="${lotId}" class="w-full flex items-center gap-2 border border-slate-200 rounded-lg p-3 text-left hover:bg-slate-50 focus-ring">
            ${SVG.download}
            <div class="min-w-0 flex-1">
              <div class="text-xs font-semibold text-slate-700">ใบส่งมอบของ Lot ${lotId}</div>
              <div class="text-[11px] text-slate-400">ดาวน์โหลดได้จากหน้ารายการ Lot — คลิกเพื่อย้อนกลับ</div>
            </div>
            <span class="text-slate-300 shrink-0">${SVG.chevron}</span>
          </button>
        </div>
        <div class="text-[14px] text-slate-400 pt-2 border-t border-slate-100">ไม่แสดงหมายเลข IMEI ในพอร์ทัลนี้ตามนโยบายขอบเขตข้อมูล</div>
      </div>`;
    footer = `<button data-action="open-modal" data-type="lot-detail" data-id="${lotId}" class="text-xs font-semibold text-slate-600 border border-slate-200 rounded-lg px-4 py-2 hover:bg-slate-50 focus-ring mr-auto inline-flex items-center gap-1">${SVG.eye} ย้อนกลับไปรายการทรัพย์</button>`;
  }

  return `
  <div class="fixed inset-0 modal-backdrop flex items-center justify-center z-50 p-4" data-action="close-modal">
    <div class="bg-white rounded-xl shadow-xl w-full ${maxWidth} animate-fade-in">
      <div class="flex items-center justify-between px-5 py-4 border-b border-slate-100">
        <div class="font-bold text-slate-800 text-sm">${title}</div>
        <button data-action="close-modal" class="text-slate-400 hover:text-slate-700 text-xl leading-none">&times;</button>
      </div>
      <div class="p-5">${body}</div>
      <div class="px-5 py-3 border-t border-slate-100 flex justify-end items-center gap-2">
        ${footer}
        <button data-action="close-modal" class="text-xs font-semibold text-white bg-slate-900 rounded-lg px-4 py-2 hover:bg-slate-800 focus-ring">ปิด</button>
      </div>
    </div>
  </div>`;
}

function renderToast(){
  if (!state.toast) return '';
  return `<div class="fixed bottom-6 right-6 bg-slate-900 text-white text-sm font-medium px-4 py-3 rounded-lg shadow-lg toast-in z-50 flex items-center gap-2">${SVG.download}${state.toast}</div>`;
}

// ═══════════════════════════════════════════════════════
// RENDER ROOT
// ═══════════════════════════════════════════════════════
function render(){
  const renderers = { dashboard: renderDashboard, cases: renderCases, billing: renderBilling, invoices: renderInvoices, handover: renderHandover, profile: renderProfile };
  document.getElementById('app').innerHTML = layout(renderers[state.tab]()) + renderModal() + renderToast();
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;
  // ป้องกัน backdrop ปิด modal เวลาคลิกโดน element ภายใน content ที่ไม่มี data-action ของตัวเอง
  // (closest() จะไล่ขึ้นไปเจอ data-action="close-modal" ที่ backdrop ได้ ถ้าไม่เช็คว่าคลิกโดน backdrop ตรงๆ)
  if (action === 'close-modal' && el.classList.contains('modal-backdrop') && e.target !== el) return;
  if (action === 'nav') S({ tab: el.dataset.tab, caseFilter: 'all', caseSearch: '' });
  else if (action === 'open-modal') { state.modal = { type: el.dataset.type, id: el.dataset.id }; render(); }
  else if (action === 'close-modal') { state.modal = null; render(); }
  else if (action === 'download') showToast(`กำลังดาวน์โหลด${el.dataset.label ? ' ' + el.dataset.label : 'เอกสาร'}...`);
  else if (action === 'logout') showToast('ออกจากระบบแล้ว (จำลอง)');
});

render();
</script>
