// Simple SVG bar chart
function barChart(data, xKey, yKey, color='#7c3aed', h=120){
  const vals = data.map(d=>d[yKey]);
  const max = Math.max(...vals)||1;
  const w = 40; const gap = 8;
  const totalW = data.length*(w+gap);
  return`<svg viewBox="0 0 ${totalW} ${h+30}" class="w-full" style="height:${h+30}px">
    ${data.map((d,i)=>{
      const bh = Math.round((d[yKey]/max)*(h-20));
      const x = i*(w+gap);
      return`<g>
        <rect x="${x}" y="${h-bh-10}" width="${w}" height="${bh}" rx="3" fill="${color}" opacity=".8" class="bar"/>
        <text x="${x+w/2}" y="${h+12}" text-anchor="middle" font-size="9" fill="#64748b">${d[xKey]}</text>
      </g>`;
    }).join('')}
  </svg>`;
}

// Simple SVG line chart
function lineChart(data, xKey, yKey, color='#7c3aed', h=100){
  const vals = data.map(d=>d[yKey]);
  const max = Math.max(...vals)||1;
  const min = Math.min(...vals)||0;
  const range = max-min||1;
  const totalW = 500; const gap = totalW/(data.length-1);
  const pts = data.map((d,i)=>{
    const x = i*gap;
    const y = h-((d[yKey]-min)/range)*(h-20)-10;
    return`${x},${y}`;
  }).join(' ');
  return`<svg viewBox="0 0 ${totalW} ${h+20}" class="w-full" style="height:${h+20}px">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${data.map((d,i)=>{
      const x=i*gap;const y=h-((d[yKey]-min)/range)*(h-20)-10;
      return`<circle cx="${x}" cy="${y}" r="4" fill="${color}"/>
      <text x="${x}" y="${h+18}" text-anchor="middle" font-size="9" fill="#64748b">${d[xKey]}</text>`;
    }).join('')}
  </svg>`;
}

      <div class="overflow-y-auto px-6 py-5 flex-1">${body}</div>
      <div class="flex justify-end px-6 py-4 border-t border-slate-100 bg-slate-50 rounded-b-2xl shrink-0">
        <button data-action="close-modal" class="px-4 py-2 text-sm font-semibold text-white bg-slate-900 rounded-lg hover:bg-slate-800 focus-ring">ปิด</button>
      </div>
    </div>
  </div>`;
}

// ═══════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════
function renderToast(){
  if(!st.toast)return'';
  return`<div class="fixed bottom-6 right-6 z-50 slide-up">
    <div class="bg-slate-900 text-white px-5 py-3.5 rounded-xl shadow-2xl text-sm font-semibold flex items-center gap-3">
      <div class="w-5 h-5 rounded-full bg-emerald-500 flex items-center justify-center">✓</div>
      ${st.toast}
    </div>
  </div>`;
}

// ═══════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════
const CONTENT = {
  f1:renderF1,f2:renderF2,f3:renderF3,f4:renderF4,f5:renderF5,
  o1:renderO1,o2:renderO2,o3:renderO3,o4:renderO4,o5:renderO5,
  a1:renderA1,a2:renderA2,a3:renderA3,a4:renderA4,
  e1:renderE1,e2:renderE2,e3:renderE3,
};

function render(){
  const fn=CONTENT[st.subTab]||renderE1;
  document.getElementById('app').innerHTML=`
    ${renderNav()}
    ${renderMainTabs()}
    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
      <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 fade-in">
        ${fn()}
      </div>
    </main>
    ${renderModal()}
    ${renderToast()}`;
}

// ═══════════════════════════════════════════════
// EVENTS
// ═══════════════════════════════════════════════
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]');
  if(!el){if(e.target.id==='modal-backdrop')closeModal();return;}
  const {action,id,msg,first}=el.dataset;
  if(action==='set-main')  S({mainTab:id,subTab:first});
  else if(action==='set-sub')    S({subTab:id});
  else if(action==='set-period') S({period:id});
  else if(action==='open-modal') openModal(el.dataset.type,id);
  else if(action==='close-modal')closeModal();
  else if(action==='toast-msg')  toast(msg);
});

render();
</script>
</body>
</html>
