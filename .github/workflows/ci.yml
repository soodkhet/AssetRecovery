name: CI

on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [staging, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    env:
      # DB ชั่วคราวของ CI เท่านั้น — ไม่แตะ staging/production DB (Rule 07)
      DATABASE_URL: postgresql://assetrecovery:assetrecovery@localhost:5432/assetrecovery_test?schema=public
      DIRECT_URL: postgresql://assetrecovery:assetrecovery@localhost:5432/assetrecovery_test?schema=public
      # เทสต์ที่แตะ DB จริง (เช่น audit_logs immutable) อ่านตัวนี้ — ไม่มีค่า = ข้ามเทสต์นั้นเงียบ ๆ
      TEST_DATABASE_URL: postgresql://assetrecovery:assetrecovery@localhost:5432/assetrecovery_test?schema=public
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      TZ: Asia/Bangkok
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: assetrecovery
          POSTGRES_PASSWORD: assetrecovery
          POSTGRES_DB: assetrecovery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assetrecovery"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # เทสต์ระดับ DB (audit_logs immutable — `90` §16) ต้องมี schema จริงก่อน
      - name: Migrate test DB
        run: pnpm db:deploy:test

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
