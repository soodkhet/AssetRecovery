// ═══════════════════════════════════════════════════════
// DATE UTILITIES — Asia/Bangkok (UTC+7), พุทธศักราช (พ.ศ.)
// Standard: DD/MM/YYYY หรือ DD/MM/YYYY HH:mm  (ไฟล์ 03 §6.5)
// ═══════════════════════════════════════════════════════
const TZ = 'Asia/Bangkok';
function toBKK(d = new Date()) {
  return new Date(d.toLocaleString('en-US', { timeZone: TZ }));
}
function fmtDate(d = new Date()) {
  const b = toBKK(d instanceof Date ? d : new Date(d));
  return `${String(b.getDate()).padStart(2,'0')}/${String(b.getMonth()+1).padStart(2,'0')}/${b.getFullYear()+543}`;
}
function fmtDateTime(d = new Date()) {
  const b = toBKK(d instanceof Date ? d : new Date(d));
  return `${String(b.getDate()).padStart(2,'0')}/${String(b.getMonth()+1).padStart(2,'0')}/${b.getFullYear()+543} ${String(b.getHours()).padStart(2,'0')}:${String(b.getMinutes()).padStart(2,'0')}`;
}
function nowDate()     { return fmtDate(new Date()); }
function nowDateTime() { return fmtDateTime(new Date()); }

let state = {
  tab: 'dashboard', // dashboard | pending_accept | unscheduled | scheduled | closed | expense
  scheduleView: 'me', // me | team
  modal: null, // { type, data }
  toast: null,
  draggingCaseId: null,
  hamburgerOpen: false,
  expenseExpanded: '',
  calendarViewMonth: null, // { year, month } — set เมื่อเปิด pickDate modal
  incomeMonthFilter: null, // null = สะสมตลอด (default), หรือ 'YYYY-MM' เพื่อกรองเฉพาะเดือน
  dayClickPopup: null, // { date, caseId } — popup เล็กตอนกดวันในปฏิทิน
  closedFilters: { status: 'all', month: '' }, // 'all' | 'closed_success' | 'closed_fail'
  expenseTab: 'caseBound', // 'caseBound' | 'separate'
  expenseFilters: { caseBoundStatus: 'all', separateStatus: 'all', separateMonth: '' },
  reassignmentPopupDismissedIds: [], // caseId ที่กด "ดูทีหลัง" ไปแล้วในเซสชันนี้ — ไม่เด้ง modal ซ้ำ แต่ badge ยังค้างอยู่
  reassignedAwayToastShownIds: [], // caseId ที่เคยแสดง toast "ถูกโอนไปแล้ว" ในเซสชันนี้แล้ว — กันไม่ให้เด้งซ้ำ
  reassignmentModalCaseId: null, // caseId ที่กำลังเปิด modal ตอบรับ/ปฏิเสธอยู่ (เปิดจาก auto-popup หรือกดจาก badge)
};

function setState(p) { state = { ...state, ...p }; render(); }
function showToast(msg, type = 'success') {
  state.toast = { msg, type };
  render();
  setTimeout(() => { state.toast = null; render(); }, 2400);
}
function money(n) { return Number(n || 0).toLocaleString('th-TH'); }
function openModal(type, data = {}) {
  if (type === 'closeCase') {
    const c = store.cases.find(x => x.id === data.id);
    const existingDraft = store.closeDrafts[data.id];
    if (c && c.status === 'needs_revision') {
      // โหมดแก้ไขหลักฐาน — โหลด evidence/travelOrigin/outcome ของรอบที่ปิดไปแล้วจากตัวเคสเอง (closeDrafts ถูกลบไปตอน submit ครั้งแรกแล้ว)
      state.outcome = c.outcome;
      state.evidence = JSON.parse(JSON.stringify(c.evidence || {})); // copy ลึกกันแก้ไขแล้วกระทบของเดิมก่อน resubmit
      state.travelOrigin = c.travelOrigin ? { ...c.travelOrigin } : null;
    } else {
      const draft = existingDraft || { outcome: null, evidence: {}, travelOrigin: null };
      state.outcome = draft.outcome;
      state.evidence = draft.evidence;
      state.travelOrigin = draft.travelOrigin || null;
      // เปิดฟอร์มครั้งแรกของเคสนี้ (ยังไม่มี draft ค้าง) + ทีมใช้ Fuel Rule โหมด PER_KM → ดึง GPS อัตโนมัติเป็น travel_origin ทันที (ปุ่ม "เริ่มงาน")
      const teamComp = teamCompensation[me.team_id];
      const isPerKm = teamComp && teamComp.fuel && teamComp.fuel.mode === 'PER_KM';
      if (!existingDraft && isPerKm && !state.travelOrigin) {
        state.travelOrigin = {
          lat: 13.8762 + Math.random() * 0.01,
          lng: 100.3922 + Math.random() * 0.01,
          source: 'gps_auto',
          set_at: new Date().toLocaleString('th-TH', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }),
        };
      }
      // บันทึก draft ทันที (แม้ยังไม่เช็คอิน) เพื่อให้ปุ่มในการ์ดเปลี่ยนเป็น "จบงาน" ทันทีที่เคยเปิดฟอร์มนี้ไปแล้วครั้งหนึ่ง
      if (!existingDraft) {
        store.closeDrafts[data.id] = { outcome: state.outcome, evidence: { ...(state.evidence || {}) }, travelOrigin: state.travelOrigin || null };
      }
    }
  }
  if (type === 'pickDate') {
    const today = new Date();
    state.calendarViewMonth = { year: today.getFullYear(), month: today.getMonth() };
    state.dayClickPopup = null;
  }
  setState({ modal: { type, data } });
}
function closeModal() { setState({ modal: null, dayClickPopup: null }); }
function myCases() { return store.cases.filter(c => c.agent_id === me.id); }
function myPendingReassignments() { return store.cases.filter(c => c.agent_id === me.id && c.pending_reassignment); }
function myUnseenPendingReassignments() { return myPendingReassignments().filter(c => !state.reassignmentPopupDismissedIds.includes(c.id)); }

// ===================== DASHBOARD =====================
function renderDashboard() {
  const mine = myCases();
  const counts = {
    pending: mine.filter(c => c.status === 'pending_accept').length,
    unscheduled: mine.filter(c => c.status === 'accepted_unscheduled').length,
    scheduled: mine.filter(c => c.status === 'scheduled').length,
    success: mine.filter(c => c.status === 'closed_success').length,
    fail: mine.filter(c => c.status === 'closed_fail').length,
  };

  const allClosed = mine.filter(c => c.status === 'closed_success' || c.status === 'closed_fail');
  const successRate = allClosed.length > 0 ? Math.round((counts.success / allClosed.length) * 100) : null;

  const todayStr = new Date().toISOString().slice(0, 10);
  const todayCases = mine.filter(c => c.status === 'scheduled' && c.schedule_date === todayStr).sort((a, b) => a.order - b.order);

  const teamComp = teamCompensation[me.team_id];
  const thisMonth = `${new Date().getFullYear()}-${String(new Date().getMonth() + 1).padStart(2, '0')}`;
  const successThisMonth = allClosed.filter(c => c.status === 'closed_success' && parseThaiDateToYearMonth(c.closed_at) === thisMonth).length;
  const commissionThisMonth = teamComp ? successThisMonth * teamComp.commission : 0;

  const draftCases = mine.filter(c => c.status === 'scheduled' && store.closeDrafts[c.id]);

  // นับเคสปิดแล้วของ 7 วันล่าสุด สำหรับกราฟแนวโน้ม
  const last7Days = [...Array(7)].map((_, i) => {
    const d = new Date(); d.setDate(d.getDate() - (6 - i));
    return d.toISOString().slice(0, 10);
  });
  const trendData = last7Days.map(dateStr => {
    const dayCases = allClosed.filter(c => c.closed_at.startsWith(formatDDMMYYYY(dateStr)));
    return { date: dateStr, success: dayCases.filter(c => c.status === 'closed_success').length, fail: dayCases.filter(c => c.status === 'closed_fail').length };
  });
  const maxTrend = Math.max(1, ...trendData.map(d => d.success + d.fail));

  return `
  ${renderTopBar('สวัสดี, ' + me.name)}
  <div class="p-4 space-y-4 animate-fade-in">

    ${draftCases.length > 0 ? `
    <button onclick="setState({tab:'scheduled'})" class="w-full bg-amber-50 border-2 border-amber-300 rounded-2xl p-4 shadow-sm active-scale text-left flex items-center gap-3">
      <span class="text-amber-600 scale-125">${Icon.alert}</span>
      <div class="flex-1">
        <div class="text-[14px] font-extrabold text-amber-800">มี ${draftCases.length} เคสที่บันทึก Draft ไว้ยังไม่ปิดงาน</div>
        <div class="text-[12px] text-amber-600 mt-0.5">แตะเพื่อไปทำต่อให้เสร็จ</div>
      </div>
    </button>` : ''}

    ${todayCases.length > 0 ? `
    <div class="bg-slate-900 rounded-2xl p-4 shadow-sm">
      <div class="text-[13px] font-extrabold text-white mb-2.5 flex items-center gap-1.5">${Icon.compass} เคสที่ต้องไปวันนี้ (${todayCases.length})</div>
      <div class="space-y-1.5">
        ${todayCases.map((c, i) => `
          <button onclick="openModal('caseDetail',{id:'${c.id}'})" class="w-full flex items-center gap-2.5 bg-white/10 rounded-xl px-3 py-2.5 active-scale">
            <div class="bg-white/20 text-white font-bold text-[12px] w-6 h-6 rounded-full flex items-center justify-center flex-shrink-0">${i + 1}</div>
            <div class="flex-1 text-left text-[13px] font-bold text-white truncate">${c.debtor}</div>
            <span class="text-white/50 text-[11px]">${c.district}</span>
          </button>`).join('')}
      </div>
    </div>` : ''}

    <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
      <div class="flex items-center justify-between mb-3">
        <span class="text-sm font-bold text-slate-800">สรุปภาพรวม</span>
      </div>
      <div class="grid grid-cols-3 gap-2 text-center">
        <div class="bg-amber-50 rounded-xl py-3">
          <div class="text-xl font-extrabold text-amber-700">${counts.pending}</div>
          <div class="text-[10px] font-semibold text-amber-600 mt-0.5">รอรับงาน</div>
        </div>
        <div class="bg-indigo-50 rounded-xl py-3">
          <div class="text-xl font-extrabold text-indigo-700">${counts.scheduled}</div>
          <div class="text-[10px] font-semibold text-indigo-600 mt-0.5">กำลังติดตาม</div>
        </div>
        <div class="bg-emerald-50 rounded-xl py-3">
          <div class="text-xl font-extrabold text-emerald-700">${counts.success}</div>
          <div class="text-[10px] font-semibold text-emerald-600 mt-0.5">สำเร็จ</div>
        </div>
      </div>
    </div>

function formatDateTH(isoDate) {
  const d = new Date(isoDate + 'T00:00:00');
  const days = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'];
  const months = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
  return `วัน${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear() + 543}`;
}

// แปลง ISO date (YYYY-MM-DD) เป็น DD/MM/YYYY เพื่อเทียบกับ prefix ของ closed_at ("DD/MM/YYYY HH:mm")
function formatDDMMYYYY(isoDate) {
  const [y, m, d] = isoDate.split('-');
  return `${d}/${m}/${y}`;
}

function onDragStart(e, caseId) { state.draggingCaseId = caseId; }
function onDropReorder(e, date, targetCaseId) {
  e.preventDefault();
  const draggedId = state.draggingCaseId;
  if (!draggedId || draggedId === targetCaseId) return;
  const list = store.cases.filter(c => c.schedule_date === date).sort((a, b) => a.order - b.order);
  const draggedIdx = list.findIndex(c => c.id === draggedId);
  const targetIdx = list.findIndex(c => c.id === targetCaseId);
  if (draggedIdx === -1 || targetIdx === -1) return;
  const [moved] = list.splice(draggedIdx, 1);
  list.splice(targetIdx, 0, moved);
  list.forEach((c, i) => { c.order = i + 1; });
  state.draggingCaseId = null;
  render();
  showToast('สลับลำดับเรียบร้อย');
}

  let cases = allCases;
  if (f.status !== 'all') cases = cases.filter(c => c.status === f.status);
  if (f.month) cases = cases.filter(c => parseThaiDateToYearMonth(c.status === 'reassigned_away' ? c.reassigned_away_info.resolved_at : c.closed_at) === f.month);

  const months = [...new Set(allCases.map(c => parseThaiDateToYearMonth(c.status === 'reassigned_away' ? c.reassigned_away_info.resolved_at : c.closed_at)))].sort().reverse();

    const [y, m] = ym.split('-');

      <button onclick="setState({closedFilters:{...state.closedFilters, status:'reassigned_away'}})" class="flex-1 py-2.5 rounded-xl text-[12px] font-extrabold ${f.status === 'reassigned_away' ? 'bg-purple-600 text-white' : 'bg-slate-100 text-slate-500'}">ถูกโอนไป</button>

    <select onchange="setState({closedFilters:{...state.closedFilters, month:this.value}})" class="w-full border-2 border-slate-200 rounded-xl px-3 py-2.5 text-[13px] font-bold text-slate-700 bg-white">
      <option value="" ${!f.month ? 'selected' : ''}>ทุกเดือน</option>
      ${months.map(ym => `<option value="${ym}" ${f.month === ym ? 'selected' : ''}>${monthLabel(ym)}</option>`).join('')}
    </select>

    ${cases.length === 0 ? renderEmptyState('ไม่พบเคสตามเงื่อนไขที่กรอง', '') : cases.map(c => c.status === 'reassigned_away' ? `
      <div class="bg-white rounded-2xl border border-purple-200 p-3.5 shadow-sm">

        <div class="text-[13px] text-slate-500 flex items-center gap-1">${Icon.map} ${c.district}, ${c.province} • รอบที่ ${c.round}</div>
        <div class="mt-2 pt-2 border-t border-slate-100 text-[12px] text-slate-500 space-y-0.5">
          <div>โอนไปให้ <strong class="text-slate-700">${c.reassigned_away_info.new_agent_name}</strong> เมื่อ ${c.reassigned_away_info.resolved_at}</div>
          <div>เหตุผล: ${c.reassigned_away_info.reason}</div>
        </div>
      </div>` : `
      <div class="bg-white rounded-2xl border border-slate-200 p-3.5 shadow-sm" onclick="openModal('caseDetail', {id:'${c.id}'})">

function renderCaseFullDetailBody(c) {
  const files = c.files || { contract: [], id_card: [], other: [], photos: [] };
  function fileRow(f, idx, group) {
    const icon = f.type === 'image' ? Icon.eye : Icon.file;
    return `<button onclick="viewFile('${group}', ${idx}, '${c.id}')" class="flex items-center gap-2.5 text-[14px] text-slate-700 active:bg-slate-100 rounded-lg px-2 py-2.5 w-full text-left">${icon}<span class="truncate font-semibold">${f.name}</span></button>`;

  function addressBlock(addr) {

function renderPickDateModal(c) {

  return `
  <div class="p-4 space-y-3">

      ${Icon.alert}
      <div class="text-[12px] text-purple-700">มี <strong>${teammateName(teammatesOnSameProvince[0].agent_id)}</strong> มีเคสในจังหวัด${c.province}ด้วย — ลองคุยเรื่องจัดวันที่/ที่พักร่วมกันไหม?</div>
    </div>` : ''}

    <div class="text-[13px] font-extrabold text-slate-500">เลือกวันที่จะไปติดตาม</div>
    ${renderCalendarGrid(year, month, c.id)}

    <div class="text-[13px] font-extrabold text-slate-500 pt-1">รายละเอียดเคสที่กำลังจัดวันที่</div>
    ${renderCaseFullDetailBody(c)}

    ${renderDayClickPopup()}
  </div>`;
}

function renderDayClickPopup() {
  if (!state.dayClickPopup) return '';
  const { date, caseId } = state.dayClickPopup;
  const casesOnDate = store.cases.filter(x => x.agent_id === me.id && x.status === 'scheduled' && x.schedule_date === date).sort((a, b) => a.order - b.order);
  const c = store.cases.find(x => x.id === caseId);

  return `
  <div class="fixed inset-0 z-[60] flex items-center justify-center p-5" style="background:rgba(15,23,42,0.55)" onclick="if(event.target===this) setState({dayClickPopup:null})">
    <div class="bg-white rounded-2xl w-full max-w-[340px] p-4 animate-fade-in" onclick="event.stopPropagation()">
      <div class="font-extrabold text-[16px] text-slate-900 mb-3">${formatDateTH(date).replace('วัน', '')}</div>

      ${casesOnDate.length > 0 ? `
      <div class="text-[12px] font-extrabold text-slate-500 mb-1.5">เคสที่จัดไว้วันนี้แล้ว (${casesOnDate.length})</div>
      <div class="space-y-1.5 mb-3 max-h-[180px] overflow-y-auto">
        ${casesOnDate.map((cc, i) => `
          <div class="bg-slate-50 rounded-lg px-3 py-2 flex items-center gap-2">
            <div class="bg-indigo-100 text-indigo-700 font-bold text-[12px] w-6 h-6 rounded-full flex items-center justify-center flex-shrink-0">${i + 1}</div>
            <div class="text-[13px] font-bold text-slate-700 truncate">${cc.debtor}</div>
          </div>`).join('')}

      <p class="text-[12px] text-slate-500 mb-3">ยืนยันจัดเคส <strong>${c.debtor}</strong> ลงวันนี้${casesOnDate.length > 0 ? ` (จะเป็นลำดับที่ ${casesOnDate.length + 1})` : ''}?</p>

      <div class="flex gap-2">
        <button onclick="setState({dayClickPopup:null})" class="flex-1 py-3 rounded-xl border-2 border-slate-300 text-slate-700 font-extrabold text-[14px] active-scale">ยกเลิก</button>
        <button onclick="confirmScheduleFromPopup()" class="flex-1 py-3 rounded-xl bg-slate-900 text-white font-extrabold text-[14px] active-scale">ยืนยันเลือกวันนี้</button>
      </div>
    </div>

}

function confirmScheduleFromPopup() {
  const { date, caseId } = state.dayClickPopup;
  state.dayClickPopup = null;
  scheduleCase(caseId, date);
}

function renderCalendarGrid(year, month, caseId) {
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const startWeekday = firstDay.getDay(); // 0 = อาทิตย์
  const daysInMonth = lastDay.getDate();
  const todayStr = new Date().toISOString().slice(0, 10);
  const monthNames = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
  const weekdayLabels = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'];

  // นับจำนวนเคสของฉันต่อวัน (เฉพาะที่ scheduled แล้ว) เพื่อโชว์ badge แบบ Google Calendar
  const myScheduled = store.cases.filter(x => x.agent_id === me.id && x.status === 'scheduled');
  const countByDate = {};
  myScheduled.forEach(x => { countByDate[x.schedule_date] = (countByDate[x.schedule_date] || 0) + 1; });

  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  return `
  <div class="bg-white border-2 border-slate-200 rounded-2xl p-3">
    <div class="flex items-center justify-between mb-3">
      <button onclick="changeCalendarMonth(-1)" class="p-2 rounded-lg active:bg-slate-100 active-scale text-slate-600">${Icon.back}</button>
      <div class="font-extrabold text-[16px] text-slate-800">${monthNames[month]} ${year + 543}</div>
      <button onclick="changeCalendarMonth(1)" class="p-2 rounded-lg active:bg-slate-100 active-scale text-slate-600" style="transform:scaleX(-1)">${Icon.back}</button>
    </div>
    <div class="grid grid-cols-7 gap-1 mb-1.5">
      ${weekdayLabels.map(w => `<div class="text-center text-[12px] font-extrabold text-slate-400 py-1">${w}</div>`).join('')}
    </div>
    <div class="grid grid-cols-7 gap-1">
      ${cells.map(d => {
        if (!d) return `<div></div>`;
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const isPast = dateStr < todayStr;
        const isToday = dateStr === todayStr;
        const count = countByDate[dateStr];
        return `
        <button ${isPast ? 'disabled' : `onclick='setState({dayClickPopup:{date:"${dateStr}",caseId:"${caseId}"}})'`} class="aspect-square rounded-xl flex flex-col items-center justify-center relative ${isPast ? 'text-slate-300' : 'text-slate-800 active:bg-blue-100 active-scale'} ${isToday ? 'ring-2 ring-slate-900' : ''}">
          <span class="text-[15px] font-extrabold">${d}</span>
          ${count ? `<span class="absolute bottom-1 w-1.5 h-1.5 rounded-full bg-indigo-500"></span><span class="absolute -top-0.5 -right-0.5 bg-indigo-600 text-white text-[9px] font-extrabold rounded-full w-4 h-4 flex items-center justify-center">${count}</span>` : ''}
        </button>`;
      }).join('')}
    </div>
  </div>`;
}

function changeCalendarMonth(delta) {
  let { year, month } = state.calendarViewMonth;
  month += delta;
  if (month < 0) { month = 11; year -= 1; }
  if (month > 11) { month = 0; year += 1; }
  state.calendarViewMonth = { year, month };
  render();
}

function scheduleCase(caseId, date) {
  const c = store.cases.find(x => x.id === caseId);
  const existing = store.cases.filter(x => x.schedule_date === date && x.agent_id === me.id);
  c.status = 'scheduled';
  c.schedule_date = date;
  c.order = existing.length + 1;
  closeModal();
  showToast(`จัดวันที่ติดตามเคส ${c.case_ref} แล้ว — ดูได้ที่แท็บ "กำลังติดตาม"`);
}

// คำนวณระยะทาง origin → checkins[1..n] ตามลำดับเวลาจริง (ของจริงเรียก Google Maps Distance Matrix API ทีละช่วง)
// mockup ใช้ Haversine ประมาณระยะทางเส้นตรง คูณ 1.3 จำลองระยะทางตามถนนจริงที่มักไกลกว่าเส้นตรง
function haversineKm(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function calculateTravelDistanceKm(origin, checkins) {
  if (!origin || !checkins || checkins.length === 0) return 0;
  const points = [origin, ...checkins];
  let total = 0;
  for (let i = 0; i < points.length - 1; i++) {
    total += haversineKm(points[i].lat, points[i].lng, points[i + 1].lat, points[i + 1].lng) * 1.3; // ×1.3 จำลองระยะทางตามถนนจริง (ของจริงใช้ Google Maps Distance Matrix API)
  }
  return Math.round(total * 10) / 10;
}

function saveDraftSilently() {

  if (!caseId) return;
  store.closeDrafts[caseId] = { outcome: state.outcome, evidence: { ...(state.evidence || {}) }, travelOrigin: state.travelOrigin || null };
}

  showToast('บันทึก Draft แล้ว — เปิดเคสนี้อีกครั้งเพื่อทำต่อได้ทุกเมื่อ');
}

function submitCloseCase(caseId) {
  const ev = state.evidence || {};
  const missing = [];
  const teamComp = teamCompensation[me.team_id];
  const fuelRule = teamComp && teamComp.fuel;
  const isPerKm = fuelRule && fuelRule.mode === 'PER_KM';
  if (isPerKm && !state.travelOrigin) missing.push('กดปุ่ม "เริ่มเดินทาง" ก่อนปิดงาน');
  if (!ev.checkins || ev.checkins.length === 0) missing.push('เช็คอินอย่างน้อย 1 จุด');
  if (!ev.photos || ev.photos.length === 0) missing.push('รูปถ่ายอย่างน้อย 1 รูป');
  if (!ev.videos || ev.videos.length === 0) missing.push('วิดีโออย่างน้อย 1 คลิป');
  if (state.outcome === 'success' && !ev.product) missing.push('รูปสินค้ายืนยัน');
  if (missing.length > 0) { showToast('ยังขาดหลักฐาน: ' + missing.join(', '), 'error'); return; }

  const wasSuccess = state.outcome === 'success'; // เก็บค่าไว้ก่อน reset state ด้านล่าง
  const c = store.cases.find(x => x.id === caseId);
  c.status = wasSuccess ? 'closed_success' : 'closed_fail';
  c.closed_at = new Date().toLocaleString('th-TH', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  c.expense_status = wasSuccess ? 'pending_warehouse_confirm' : 'pending_approval';
  // เก็บ evidence/outcome/travelOrigin ของรอบนี้ไว้กับตัวเคสเอง (ไม่ใช่แค่ใน closeDrafts ที่ลบทิ้งตอน submit สำเร็จ)
  // เพื่อให้ผู้จัดการพื้นที่ตีกลับ (reject_evidence) แล้วเปิดมาแก้ไขต่อได้ (resubmitCloseCase) — ดู §10.1
  c.outcome = state.outcome;
  c.evidence = JSON.parse(JSON.stringify(ev));
  c.travelOrigin = state.travelOrigin ? { ...state.travelOrigin } : null;

  // คำนวณค่าน้ำมัน — PER_KM ใช้ travelOrigin + checkins จริง, DAILY_FLAT ใช้ค่าคงที่ ไม่คำนวณระยะทาง
  let fuelAmount = 0;
  let distanceKm = null;
  if (isPerKm) {
    distanceKm = calculateTravelDistanceKm(state.travelOrigin, ev.checkins);
    const rawAmount = distanceKm * fuelRule.rate_per_km;
    fuelAmount = fuelRule.max_per_case ? Math.min(rawAmount, fuelRule.max_per_case) : rawAmount;
    fuelAmount = Math.round(fuelAmount);
  } else if (fuelRule && fuelRule.mode === 'DAILY_FLAT') {
    fuelAmount = fuelRule.daily_flat_rate || 0;
  }

  // สร้างรายการเบิกค่าน้ำมัน/เบี้ยเลี้ยงอัตโนมัติ
  store.expenses.fuelAllowance.push({ id: 'e' + Date.now(), case_id: c.id, type: 'fuel', amount: fuelAmount, distance_km: distanceKm, status: c.expense_status, date: c.closed_at.split(' ')[0] });
  store.expenses.fuelAllowance.push({ id: 'e' + (Date.now() + 1), case_id: c.id, type: 'allowance', amount: teamComp ? teamComp.allowance : 300, status: c.expense_status, date: c.closed_at.split(' ')[0] });

  delete store.closeDrafts[caseId]; // ปิดงานสำเร็จแล้ว ไม่ใช่ draft ที่ค้างอยู่อีกต่อไป
  state.outcome = null;
  state.evidence = {};
  state.travelOrigin = null;
  closeModal();
  setState({ tab: 'closed' });
  showToast(wasSuccess
    ? `ปิดงานสำเร็จ — รายการเบิกรอยืนยันคืนคลังก่อนเข้าสู่การอนุมัติจ่าย`
    : `ปิดงานเรียบร้อย — รายการเบิกถูกส่งไปรออนุมัติแล้ว`);
}

// ===================== RESUBMIT: ส่งกลับยืนยันอีกครั้งหลังถูกตีกลับ (needs_revision) =====================
// ตาม §10.1 — แก้ได้เฉพาะรูป/วิดีโอ/เสียง/รูปสินค้า (เช็คอิน+outcome ล็อกไว้ตามรอบเดิม ไม่เปลี่ยน)
// กลับเป็น closed_success/closed_fail เดิม + รายการเบิกรอบเดิม mark เป็น superseded + สร้างรายการเบิกใหม่ตามกฎปกติ
function resubmitCloseCase(caseId) {
  const c = store.cases.find(x => x.id === caseId);
  const ev = state.evidence || {};
  const missing = [];
  if (!ev.photos || ev.photos.length === 0) missing.push('รูปถ่ายอย่างน้อย 1 รูป');
  if (!ev.videos || ev.videos.length === 0) missing.push('วิดีโออย่างน้อย 1 คลิป');
  if (c.outcome === 'success' && !ev.product) missing.push('รูปสินค้ายืนยัน');
  if (missing.length > 0) { showToast('ยังขาดหลักฐาน: ' + missing.join(', '), 'error'); return; }

  const wasSuccess = c.outcome === 'success'; // outcome ล็อกตามรอบเดิม ไม่ใช้ state.outcome เพราะแก้ไม่ได้ในโหมดนี้
  c.status = wasSuccess ? 'closed_success' : 'closed_fail';
  c.closed_at = new Date().toLocaleString('th-TH', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  c.evidence = JSON.parse(JSON.stringify(ev)); // บันทึก evidence ที่แก้ไขแล้วทับของเดิม (เช็คอินเหมือนเดิมเพราะแก้ไม่ได้)
  c.travelOrigin = state.travelOrigin ? { ...state.travelOrigin } : c.travelOrigin;
  delete c.qc_reject_info;

  // mark รายการเบิกของรอบนี้ที่เคยสร้างไว้เป็น superseded (เก็บ audit ไม่ลบ) แล้วสร้างรายการใหม่ตามกฎปกติ
  const oldExpenses = store.expenses.fuelAllowance.filter(e => e.case_id === caseId && e.status !== 'superseded');
  oldExpenses.forEach(e => { e.status = 'superseded'; });

  const newExpenseStatus = wasSuccess ? 'pending_warehouse_confirm' : 'pending_approval';
  c.expense_status = newExpenseStatus;
  const teamComp = teamCompensation[me.team_id];
  const fuelRule = teamComp && teamComp.fuel;
  let fuelAmount = 0;
  let distanceKm = null;
  if (fuelRule && fuelRule.mode === 'PER_KM') {
    distanceKm = calculateTravelDistanceKm(c.travelOrigin, ev.checkins);
    const rawAmount = distanceKm * fuelRule.rate_per_km;
    fuelAmount = fuelRule.max_per_case ? Math.min(rawAmount, fuelRule.max_per_case) : rawAmount;
    fuelAmount = Math.round(fuelAmount);
  } else if (fuelRule && fuelRule.mode === 'DAILY_FLAT') {
    fuelAmount = fuelRule.daily_flat_rate || 0;
  }
  store.expenses.fuelAllowance.push({ id: 'e' + Date.now(), case_id: c.id, type: 'fuel', amount: fuelAmount, distance_km: distanceKm, status: newExpenseStatus, date: c.closed_at.split(' ')[0] });

function parseThaiDateToYearMonth2(dateStr) {
  // dateStr format: "DD/MM/YYYY" (ไม่มีเวลา ต่างจาก closed_at)
  const parts = dateStr.split('/');
  if (parts.length < 3) return null;
  const [, mm, yyyy] = parts;
  return `${yyyy}-${mm}`;
}

// ===================== MODAL: สรุปรายได้ =====================
function parseThaiDateToYearMonth(dateStr) {
  // dateStr format: "DD/MM/YYYY HH:mm"
  const [datePart] = dateStr.split(' ');
  const [, mm, yyyy] = datePart.split('/');
  return `${yyyy}-${mm}`;
}

function renderModal() {

        <div class="text-[13px] text-purple-700 mt-1">เหตุผล: ${c.pending_reassignment.reason}</div>
        <div class="text-[12px] text-purple-500 mt-2 flex items-center gap-1">${Icon.calendar} หมดเขตตอบ ${c.pending_reassignment.expires_at}</div>
      </div>
      <p class="text-[12px] text-slate-400 mb-4">ถ้าไม่ตอบภายในเวลาที่กำหนด ระบบจะเปลี่ยนผู้รับผิดชอบให้อัตโนมัติ</p>
      <div class="flex gap-2.5 mb-2">
        <button onclick="setState({reassignmentModalCaseId:'${c.id}'})" class="flex-1 py-3.5 rounded-xl bg-slate-900 text-white font-extrabold text-[14px] active-scale">ตอบเลย</button>
      </div>
      <button onclick="dismissReassignmentPopup('${c.id}')" class="w-full py-2.5 text-[13px] font-bold text-slate-400 active-scale">ดูทีหลัง</button>
    </div>
  </div>`;
}

function dismissReassignmentPopup(caseId) {
  if (!state.reassignmentPopupDismissedIds.includes(caseId)) {
    state.reassignmentPopupDismissedIds.push(caseId);
  }
  render();
}

function renderReassignmentResponseModal() {
  const c = store.cases.find(x => x.id === state.reassignmentModalCaseId);
  if (!c || !c.pending_reassignment) return '';
  const pr = c.pending_reassignment;
  const showDeclineForm = state.reassignmentDeclining;

  return `
  <div class="fixed inset-0 z-[70] flex items-center justify-center p-5" style="background:rgba(15,23,42,0.6)" onclick="if(event.target===this) setState({reassignmentModalCaseId:null, reassignmentDeclining:false})">
    <div class="bg-white rounded-3xl w-full max-w-[420px] p-5 animate-fade-in" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between mb-3">
        <div class="font-extrabold text-[17px] text-slate-900">คำขอเปลี่ยนผู้รับผิดชอบ</div>
        <button onclick="setState({reassignmentModalCaseId:null, reassignmentDeclining:false})" class="p-1.5 rounded-lg active:bg-slate-100 text-slate-400">${Icon.x}</button>
      </div>
      <div class="bg-purple-50 border-2 border-purple-200 rounded-2xl p-3.5 mb-4">
        <div class="text-[14px] font-bold text-slate-800">${c.debtor}</div>
        <div class="text-[12px] text-slate-500 mb-2">${c.district}, ${c.province}</div>
        <div class="text-[13px] text-purple-700"><strong>${pr.requested_by}</strong> ขอเปลี่ยนผู้รับผิดชอบเป็น <strong>${pr.new_agent_name}</strong></div>
        <div class="text-[13px] text-purple-700 mt-1">เหตุผล: ${pr.reason}</div>
        <div class="text-[12px] text-purple-500 mt-2 flex items-center gap-1">${Icon.calendar} หมดเขตตอบ ${pr.expires_at}</div>
      </div>

      ${showDeclineForm ? `
      <div class="mb-3">
        <label class="text-[13px] font-bold text-slate-600 block mb-1.5">เหตุผลที่ไม่ยินยอม (จำเป็น)</label>
        <textarea id="declineReasonInput" rows="3" class="w-full border-2 border-slate-200 rounded-xl px-3 py-2.5 text-[14px]" placeholder="ระบุเหตุผล เช่น กำลังเดินทางไปหาลูกหนี้แล้ว ใกล้ถึงแล้ว"></textarea>
      </div>
      <div class="flex gap-2.5">
        <button onclick="setState({reassignmentDeclining:false})" class="flex-1 py-3.5 rounded-xl border-2 border-slate-300 text-slate-700 font-extrabold text-[14px] active-scale">กลับ</button>
        <button onclick="submitDeclineReassignment('${c.id}')" class="flex-1 py-3.5 rounded-xl bg-red-600 text-white font-extrabold text-[14px] active-scale">ยืนยันไม่ยินยอม</button>
      </div>` : `
      <div class="grid grid-cols-2 gap-2.5">
        <button onclick="setState({reassignmentDeclining:true})" class="py-4 rounded-xl border-2 border-red-300 text-red-600 font-extrabold text-[15px] active-scale">ไม่ยินยอม</button>
        <button onclick="submitConsentReassignment('${c.id}')" class="py-4 rounded-xl bg-emerald-600 text-white font-extrabold text-[15px] active-scale">ยินยอม</button>
      </div>`}
    </div>
  </div>`;
}

function submitConsentReassignment(caseId) {
  const c = store.cases.find(x => x.id === caseId);
  const pr = c.pending_reassignment;
  showToast(`ยินยอมเปลี่ยนผู้รับผิดชอบเป็น "${pr.new_agent_name}" แล้ว — เคสนี้จะหายจากรายการของคุณ`);
  c.status = 'reassigned_away';
  c.reassigned_away_info = {
    resolved_at: new Date().toLocaleString('th-TH', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }),
    resolution: 'consented',
    new_agent_name: pr.new_agent_name,
    reason: pr.reason,
  };
  c.pending_reassignment = null;
  state.reassignmentModalCaseId = null;
  state.reassignmentDeclining = false;
  render();
}

function submitDeclineReassignment(caseId) {
  const reasonEl = document.getElementById('declineReasonInput');
  const reason = reasonEl ? reasonEl.value.trim() : '';
  if (!reason) { showToast('กรุณาระบุเหตุผลก่อนยืนยันไม่ยินยอม', 'error'); return; }
  const c = store.cases.find(x => x.id === caseId);
  c.pending_reassignment = null;
  state.reassignmentModalCaseId = null;
  state.reassignmentDeclining = false;
  showToast('ไม่ยินยอมแล้ว — เคสยังเป็นของคุณตามปกติ');
  render();
}

// ===================== AUTO-RESOLVE: pending_reassignment เกิน expires_at =====================
// ระบบ background job ตรวจ expires_at ของทุกเคสที่มี pending_reassignment — ถ้าเกินแล้วและพนักงานยังไม่ตอบ
// → เปลี่ยน agent_id เป็นคนใหม่อัตโนมัติ (ของจริงตามไฟล์ 40 §8) — ในมุมมองไฟล์นี้ของพนักงานคนเดิม คือ reassigned_away
// mockup: ฟังก์ชันนี้จำลอง background job — ของจริงรันที่ backend ไม่ใช่ฝั่ง client
function checkAndAutoResolveReassignments() {
  const now = new Date();
  store.cases.forEach(c => {
    if (!c.pending_reassignment) return;
    const expiresAt = parseThaiDateTimeToDate(c.pending_reassignment.expires_at);
    if (expiresAt && now > expiresAt) {
      const pr = c.pending_reassignment;
      c.status = 'reassigned_away';
      c.reassigned_away_info = {
        resolved_at: now.toLocaleString('th-TH', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }),
        resolution: 'timeout_auto',
        new_agent_name: pr.new_agent_name,
        reason: 'เกินกำหนดเวลาตอบรับ',
      };
      c.pending_reassignment = null;
      if (!state.reassignedAwayToastShownIds.includes(c.id)) {
        state.reassignedAwayToastShownIds.push(c.id);
        showToast(`เคส "${c.debtor}" ถูกโอนไปแล้วเพราะไม่ได้ตอบทันเวลา`, 'info');
      }
    }
  });
}

// แปลงรูปแบบ "DD/MM/YYYY HH:mm" (พ.ศ.) เป็น Date object (ค.ศ.) เพื่อเทียบเวลาปัจจุบัน
function parseThaiDateTimeToDate(thaiStr) {
  const m = thaiStr.match(/(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2})/);
  if (!m) return null;
  const [, d, mo, y, h, mi] = m;
  return new Date(parseInt(y, 10) - 543, parseInt(mo, 10) - 1, parseInt(d, 10), parseInt(h, 10), parseInt(mi, 10));
}

// ===================== QC OUTCOME: อ่าน reject_evidence จากไฟล์ 38 (ผู้จัดการพื้นที่) ผ่าน localStorage =====================
// mockup: 2 ไฟล์รันแยก store กันคนละหน้า ใช้ localStorage จำลองการเชื่อมต่อข้ามไฟล์ (ของจริงคือ backend เดียวกัน ไม่ต้องผ่าน localStorage)
function checkAndApplyQcActions() {
  const qcActions = JSON.parse(localStorage.getItem('assetrecovery_qc_actions') || '[]');
  const remaining = [];
  qcActions.forEach(action => {
    const c = store.cases.find(x => x.id === action.case_id && x.agent_id === me.id);
    if (!c) { remaining.push(action); return; } // เคสไม่ใช่ของพนักงานคนนี้ หรือยังไม่เจอ — เก็บไว้รอ (เผื่อพนักงานอื่นมาเช็คทีหลัง)
    if (action.type === 'reject_evidence') {
      if (c.status === 'closed_success' || c.status === 'closed_fail') {
        c.qc_reject_info = { reason: action.reason, rejected_by: action.rejected_by, rejected_at: action.rejected_at, original_status: c.status };
        c.status = 'needs_revision';
        showToast(`เคส "${c.debtor}" ถูกตีกลับหลักฐานปิดงาน — ดูเหตุผลและแก้ไขได้ที่แท็บ "จบงาน"`, 'error');
      }
      // ถ้าเคสถูก apply แล้ว (ไม่ใช่ closed_success/closed_fail อีกต่อไป) ไม่ต้อง push กลับ remaining — ถือว่า action นี้ใช้แล้ว
    }
  });
  localStorage.setItem('assetrecovery_qc_actions', JSON.stringify(remaining));
}

function render() {
  let content = '';
  if (state.tab === 'dashboard') content = renderDashboard();
  else if (state.tab === 'pending_accept') content = renderPendingAcceptTab();
  else if (state.tab === 'accepted_unscheduled') content = renderUnscheduledTab();
  else if (state.tab === 'scheduled') content = renderScheduledTab();
  else if (state.tab === 'closed') content = renderClosedTab();

  document.getElementById('app').innerHTML = `
    ${content}
    ${renderBottomNav()}
    ${renderHamburgerMenu()}
    ${renderModal()}
    ${renderReassignmentAutoPopup()}
    ${renderReassignmentResponseModal()}
    ${renderToast()}
  `;
}

checkAndAutoResolveReassignments(); // จำลองผลของ background job ที่ backend รันไปก่อนหน้า — ตรวจตอนเปิดแอปครั้งแรก
checkAndApplyQcActions(); // อ่านผลตีกลับหลักฐานจากไฟล์ 38 (ผู้จัดการพื้นที่) ผ่าน localStorage
render();
</script>
