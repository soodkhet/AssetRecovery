// HELPERS — เงินเก็บเป็น satang (integer) · แสดง 2 ตำแหน่ง + comma
// ═══════════════════════════════════════════════════════
const money = (s) => {
  const neg = s < 0; const a = Math.abs(s);
  const baht = Math.floor(a / 100).toLocaleString('en-US');
  const st = String(a % 100).padStart(2, '0');
  return (neg ? '-' : '') + baht + '.' + st;
};
const pct = (base, p) => Math.round(base * p / 100); // ปัดครึ่งขึ้นระดับสตางค์
const sum = (arr, k) => arr.reduce((t, r) => t + (k ? r[k] : r), 0);
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// จำนวนเงินตัวอักษรไทย (บาท/สตางค์)
const DIGITS = ['', 'หนึ่ง', 'สอง', 'สาม', 'สี่', 'ห้า', 'หก', 'เจ็ด', 'แปด', 'เก้า'];
const POS = ['', 'สิบ', 'ร้อย', 'พัน', 'หมื่น', 'แสน'];
function readInt(n) {
  if (n === 0) return '';
  if (n >= 1000000) {
    const hi = Math.floor(n / 1000000), lo = n % 1000000;
    return readInt(hi) + 'ล้าน' + (lo ? readLow(lo, true) : '');
  }
  return readLow(n, false);
}
function readLow(n, afterMillion) {
  const s = String(n); let out = '';
  for (let i = 0; i < s.length; i++) {
    const d = +s[i]; const p = s.length - i - 1;
    if (d === 0) continue;
    if (p === 1 && d === 1) out += 'สิบ';
    else if (p === 1 && d === 2) out += 'ยี่สิบ';
    else if (p === 0 && d === 1 && (s.length > 1 || afterMillion)) out += 'เอ็ด';
    else out += DIGITS[d] + POS[p];
  }
  return out;
}
function bahtText(satang) {
  const b = Math.floor(satang / 100), st = satang % 100;
  if (b === 0 && st === 0) return 'ศูนย์บาทถ้วน';
  return (b ? readInt(b) + 'บาท' : '') + (st ? readInt(st) + 'สตางค์' : 'ถ้วน');
}

        <tr class="deduct"><td colspan="2" class="num">หัก ภาษีเงินได้หัก ณ ที่จ่าย ${CUST_WHT}% (ผู้ชำระหัก)</td><td class="num">(${money(wht)})</td></tr>

  return paper(inner, { compact });

function docTaxInvoice() {
  const before = sum(CASES, 'fee'); const vat = pct(before, VAT_PCT); const wht = pct(before, CUST_WHT);
  const rows = CASES.map((c, i) => `<tr><td class="center">${i + 1}</td><td>ค่าบริการติดตามทรัพย์คืน เคส <span class="mono">${c.ref}</span> สัญญา <span class="mono">${c.contract}</span><div class="text-slate-600">${c.model}</div></td><td class="num">${money(c.fee)}</td></tr>`).join('');
  const channel = 'โอนเข้าบัญชี ธนาคารกสิกรไทย เลขที่ 123-4-56789-0 เมื่อ 20/11/2569';
  const main = taxInvoicePaper({ no: 'INV-0005', date: '20/11/2569', rows, before, vat, wht, refNote: 'BL-2569-005', channel });

  // ก. ใบแทน
  const repl = taxInvoicePaper({ no: 'INV-0007', date: '24/11/2569', rows, before, vat, wht, refNote: 'BL-2569-005', channel, compact: true,
    banner: 'ออกแทนฉบับเลขที่ INV-0005 ลงวันที่ 20/11/2569 เนื่องจาก ที่อยู่ผู้ซื้อไม่ถูกต้อง (ฉบับเดิมยกเลิกแล้ว)' });

  // ข. รับชำระบางส่วน — ยอดที่รับเป็นยอดรวม VAT แล้วถอด VAT ออก
  const invTotal = 1070000; const recvGross = 321000;
  const pBefore = Math.round(recvGross * 100 / (100 + VAT_PCT)); const pVat = recvGross - pBefore; const pWht = pct(pBefore, CUST_WHT);
  const pRows = `<tr><td class="center">1</td><td>ค่าบริการติดตามทรัพย์คืน รอบเดือน ตุลาคม 2569 — รับชำระบางส่วน<div class="text-slate-600">ยอดตามใบแจ้งหนี้ <span class="mono">BL-2569-006</span> รวม ${money(invTotal)} บาท</div></td><td class="num">${money(pBefore)}</td></tr>`;
  const partial = taxInvoicePaper({ no: 'INV-0006', date: '22/11/2569', rows: pRows, before: pBefore, vat: pVat, wht: pWht, refNote: 'BL-2569-006', compact: true,
    channel: 'โอนเข้าบัญชี ธนาคารกสิกรไทย เลขที่ 123-4-56789-0 เมื่อ 22/11/2569',
    banner: 'รับชำระบางส่วนครั้งที่ 1 ของใบแจ้งหนี้เลขที่ BL-2569-006',
    extraRows: `<tr><td colspan="2" class="num">ยอดคงค้างตามใบแจ้งหนี้ (รวมภาษีมูลค่าเพิ่ม)</td><td class="num">${money(invTotal - recvGross)}</td></tr>` });

  return main + notes([
    ['ข้อมูลที่ใช้', 'ใบแจ้งหนี้ที่อ้างอิง · ยอดรับเงินจริง + วันที่รับ · อัตรา VAT ณ วันรับเงิน · ข้อมูลผู้ซื้อ/ผู้ขาย (ชื่อ ที่อยู่ เลขผู้เสียภาษี สาขา) บันทึกถาวรลงเอกสารตอนออก'],
    ['ใครได้รับ', 'บริษัทไฟแนนซ์ (ต้นฉบับ) · สำเนาเก็บเข้าชุดเอกสารบัญชีส่งสำนักงานบัญชี (รายงานภาษีขาย)'],
    ['ออกเมื่อ', 'ตอนบันทึกรับเงินจากบริษัทไฟแนนซ์ — 1 ครั้งที่รับ = 1 ฉบับ · เลขเรียงต่อเนื่อง วันที่ไม่ย้อน/ไม่ล่วงหน้า'],
  ])
  + sectionTitle('ตัวอย่างย่อย ก — ใบแทน', 'ออกแทนฉบับเดิมที่ยกเลิก ต้องระบุเลขที่ + วันที่ฉบับเดิม + เหตุผล') + repl
  + sectionTitle('ตัวอย่างย่อย ข — รับชำระบางส่วน', 'ยอดที่รับเป็นยอดรวมภาษีมูลค่าเพิ่ม · ครั้งถัดไปออกใบใหม่ปิดยอดคงค้าง ผลรวมทุกใบเท่ากับใบแจ้งหนี้') + partial;
}

  { id: 'billing', name: 'ใบแจ้งหนี้/ใบวางบิล', render: docBilling, to: 'บริษัทไฟแนนซ์', when: 'ตอนวางบิล', status: ['มีแล้ว', 'ปรับหน้าตาตามแบบนี้ + เพิ่มแถวภาษีที่ลูกค้าหัก/ยอดที่คาดว่าได้รับ และบัญชีรับโอน'] },
  { id: 'taxinv', name: 'ใบเสร็จรับเงิน/ใบกำกับภาษี', render: docTaxInvoice, to: 'บริษัทไฟแนนซ์', when: 'ตอนรับเงิน (รวมใบแทน/รับบางส่วน)', status: ['มีแล้ว', 'ปรับหน้าตา + เพิ่มแถวภาษีหัก ณ ที่จ่าย/ยอดรับจริง/ช่องทางชำระ'] },
  { id: 'handover', name: 'ใบส่งมอบทรัพย์', render: docHandover, to: 'บริษัทไฟแนนซ์ + คลัง', when: 'ตอนส่งมอบล็อต', status: ['มีแล้ว', 'ปรับหน้าตาตามแบบนี้'] },
  { id: 'voucher', name: 'ใบสำคัญจ่าย', render: docVoucher, to: 'การเงิน/บัญชี (ผู้รับเงินเซ็น)', when: 'ตอนรอบจ่ายโอนสำเร็จ', status: ['มีแล้ว', 'ปรับหน้าตา + แยกรายการตามประเภทค่าตอบแทน'] },
  { id: 'payslip', name: 'สลิปค่าตอบแทน', render: docPayslip, to: 'พนักงานภาคสนาม', when: 'ตอนรอบจ่ายโอนสำเร็จ', status: ['มีแล้ว', 'ปรับหน้าตา + สรุปจำนวนเคส/วัน/คืน'] },
  { id: 'advance', name: 'ใบเบิกเงินทดรอง', render: docAdvance, to: 'ผู้เบิก + การเงิน', when: 'ตอนอนุมัติ/จ่ายเงินทดรอง', status: ['มีแล้ว', 'ดาวน์โหลดจากหน้าเงินทดรอง (การเงิน + เจ้าของ) หลังอนุมัติ'] },
  { id: 'advreturn', name: 'ใบรับคืนเงินทดรอง', render: docAdvanceReturn, to: 'ผู้เบิก + การเงิน', when: 'ตอนรับคืน/หักกลบสำเร็จ', status: ['มีแล้ว', 'ต่อรายการรับคืน (เลข RAV) · รายการที่กลับรายการพิมพ์ป้ายยกเลิก'] },
  { id: 'noreceipt', name: 'ใบรับรองแทนใบเสร็จรับเงิน', render: docNoReceipt, to: 'การเงิน/บัญชี', when: 'ตอนเคลียร์เงินทดรอง/อนุมัติรายจ่าย', status: ['มีแล้ว', 'ติ๊ก "ไม่มีใบเสร็จ" ในฟอร์มเบิกค่าที่พัก/เคลียร์เงินทดรอง → ดาวน์โหลดเซ็น → อัปโหลดฉบับเซ็น'] },
  { id: 'internal', name: 'หัวเอกสารภายใน', render: docInternal, to: 'ภายใน', when: 'สรุปรอบจ่าย/หน้าปก/รายงาน', status: ['มีแล้ว', 'เปลี่ยนเป็นหัวกลางตามแบบนี้'] },
  { id: 'wht', name: '50 ทวิ', render: docWht, to: 'ผู้ถูกหักภาษี', when: 'ตอนรอบจ่ายโอนสำเร็จ', status: ['มีแล้ว', 'แบบทางการ — ไม่เปลี่ยน'] },
];
let current = 'billing';
try { const s = localStorage.getItem('docs-mock-current'); if (s && DOCS.some((d) => d.id === s)) current = s; } catch (e) { /* ignore */ }

function render() {
  document.getElementById('doc-tabs').innerHTML = DOCS.map((d, i) => `
    <button data-doc="${d.id}" class="focus-ring shrink-0 px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap ${d.id === current ? 'bg-slate-900 text-white' : 'text-slate-600 hover:bg-slate-100'}">${i + 1}. ${d.name}</button>`).join('');
  document.querySelectorAll('.copy-btn').forEach((b) => {
    const on = b.dataset.copy === COPY;
    b.className = `copy-btn focus-ring px-3 py-1.5 rounded-md text-xs font-semibold ${on ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500'}`;
  });
  const doc = DOCS.find((d) => d.id === current);
  document.getElementById('doc-area').innerHTML = doc.render();
}
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-doc],[data-copy]');
  if (!t) return;
  if (t.dataset.doc) { current = t.dataset.doc; try { localStorage.setItem('docs-mock-current', current); } catch (err) { /* ignore */ } }
  if (t.dataset.copy) COPY = t.dataset.copy;
  render();
});

const badge = (s) => s === 'มีแล้ว'
  ? 'bg-emerald-50 text-emerald-700 border-emerald-200'
  : s === 'ต้องเพิ่ม PDF' ? 'bg-amber-50 text-amber-700 border-amber-200' : 'bg-rose-50 text-rose-700 border-rose-200';
document.getElementById('summary-body').innerHTML = DOCS.map((d) => `
  <tr>
    <td class="px-3 py-2 font-medium text-slate-900">${d.name}</td>
    <td class="px-3 py-2 text-slate-700">${d.to}</td>
    <td class="px-3 py-2 text-slate-700">${d.when}</td>
    <td class="px-3 py-2"><span class="inline-block px-2 py-0.5 rounded-full border text-xs font-semibold ${badge(d.status[0])}">${d.status[0]}</span><div class="text-xs text-slate-500 mt-0.5">${d.status[1]}</div></td>
  </tr>`).join('');

render();
</script>
</body>
</html>
