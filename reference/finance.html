function toBKK(d=new Date()){return new Date(d.toLocaleString('en-US',{timeZone:TZ}));}
function fmtDate(d=new Date()){const b=toBKK(d instanceof Date?d:new Date(d));return `${String(b.getDate()).padStart(2,'0')}/${String(b.getMonth()+1).padStart(2,'0')}/${b.getFullYear()+543}`;}
function fmtDateTime(d=new Date()){const b=toBKK(d instanceof Date?d:new Date(d));return `${String(b.getDate()).padStart(2,'0')}/${String(b.getMonth()+1).padStart(2,'0')}/${b.getFullYear()+543} ${String(b.getHours()).padStart(2,'0')}:${String(b.getMinutes()).padStart(2,'0')}`;}

function nowDateTime(){return fmtDateTime(new Date());}

}

// ===================== GLOBAL EVENT LISTENERS =====================
document.addEventListener('click', (e) => {
  if (e.target.id === 'modalBackdrop') { closeModal(); return; }
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;
 
  // Main Tabs
  if (action === 'set-main') setState({ mainTab: el.dataset.id });
  
  // Settings Top Tabs
  else if (action === 'set-settings-toptab') setState({ settingsTopTab: el.dataset.id });
 
  // Sub Tabs
  else if (action === 'set-sub') {
    const parent = el.dataset.parent;
    resetFilters();
    setState({ [parent]: el.dataset.id });
  }
  
  // General Settings Specific Actions
  else if (action === 'set-settings-tab') {
    resetFilters();
    setState({ settingsTab: el.dataset.tab, mainTab: 'settings' });
  }
  else if (action === 'set-roles-subtab') {
    resetFilters();
    setState({ rolesSubTab: el.dataset.subtab });
  }
  else if (action === 'set-roles-tracker-filter') {
    setState({ rolesTrackerFilter: el.dataset.filter });
  }
  else if (action === 'set-teams-side') {
    resetFilters();
    setState({ teamsSide: el.dataset.side });
  }
  else if (action === 'set-users-subtab') {
    resetFilters();
    setState({ usersSubTab: el.dataset.subtab });
  }
  else if (action === 'set-tracker-filter') {
    setState({ trackerFilter: el.dataset.filter });
  }
  else if (action === 'open-create-role' || action === 'open-create-team' || action === 'open-create-company' || action === 'open-create-user' || action === 'open-create-comp' || action === 'open-create-sf') {
    openModal(action.replace('open-', ''), { isEdit: false });
  }
  else if (action === 'open-edit-team' || action === 'open-edit-company' || action === 'open-edit-user' || action === 'open-edit-comp' || action === 'open-edit-sf') {
    const type = action.replace('open-', '');
    const dataKey = type === 'edit-team' ? 'team' : type === 'edit-company' ? 'company' : type === 'edit-user' ? 'user' : 'id';
    openModal(type, { id: el.dataset[dataKey], isEdit: true });
  }
  else if (action === 'edit-permission') {
    openModal('edit-permission', { id: el.dataset.role });
  }
  else if (action === 'try-delete-role') {
    showToast('ไม่สามารถลบ Role นี้ได้ (มีผู้ใช้งาน หรือเป็น Role พื้นฐาน)', 'error');
  }
  else if (action === 'audit-filter-export') {
    openModal('audit-filter-export', {});
  }
 
  // Modal Triggers
  else if (action === 'open-modal' || action === 'generic-detail') {
    openModal(el.dataset.type || 'generic-detail', { id: el.dataset.id });
  }
  else if (action === 'close-modal') closeModal();
  
  // Actions
  else if (action === 'toast') {
    closeModal();
    showToast(el.dataset.msg || 'ดำเนินการสำเร็จ', 'success');
  }
  else if (action === 'save-modal') {
    const { type } = state.modal;
    const exportTypes = ['billing-file', 'billing-send', 'export-pack', 'audit-filter-export', 'payment-file', 'download-wht-cert'];
    const readOnlyTypes = ['generic-detail', 'payout-detail', 'revenue-calc-detail', 'profit-drilldown', 'accounting-checklist'];

    if (exportTypes.includes(type)) saveMsg = 'เตรียมไฟล์สำเร็จ เริ่มดาวน์โหลดเอกสาร';
    else if (type === 'action-approve-claim') saveMsg = 'อนุมัติรายการสำเร็จ';
    else if (type === 'action-reject-claim') saveMsg = 'ปฏิเสธรายการสำเร็จ';
    else if (type === 'action-clear-advance') saveMsg = 'เคลียร์ยอดเงินทดรองสำเร็จ';
    else if (type === 'approve-advance') saveMsg = 'อนุมัติเงินทดรองจ่ายสำเร็จ';
    else if (type === 'reject-advance') saveMsg = 'ปฏิเสธคำขอเงินทดรองจ่ายแล้ว';
    else if (type === 'action-reject-claim-final') saveMsg = 'ปฏิเสธถาวรสำเร็จ';
 
    closeModal();
    if (!readOnlyTypes.includes(type)) {
      showToast(saveMsg, 'success');
    }
  }
});
 
// Init
render();
</script>
</body>
</html>
