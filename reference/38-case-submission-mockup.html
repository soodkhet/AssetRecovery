function setState(patch) { state = { ...state, ...patch }; render(); }
function openModal(type, data = {}) { setState({ modal: { type, data }, showAllTeams: false, pendingTeamChange: null, rejectEvidenceCaseId: null }); }
function closeModal() { setState({ modal: null, showAllTeams: false, pendingTeamChange: null, rejectEvidenceCaseId: null }); }
function showToast(msg, type = 'success') { state.toast = { msg, type }; render(); setTimeout(() => { state.toast = null; render(); }, 2600); }
function money(n) { return Number(n || 0).toLocaleString('th-TH', { minimumFractionDigits: 0 }); }

// คำนวณประมาณการรายได้ "ถ้าเคสสำเร็จ" ตามไฟล์ 38 §6.5 — อ้างอิง Service Fee Template ของไฟแนนซ์ (ไฟล์ 12)
function getCompanyByName(name) { return store.companies.find(c => c.name === name); }
function calcProjectedRevenue(c) {
  const company = getCompanyByName(c.company);
  if (!company || !company.service_fee) return null;
  const fee = company.service_fee;
  const basisAmount = c.debt; // basis = 'debt' ตามที่ template กำหนด (มูลหนี้คงเหลือ)
  let amount = 0;
  if (fee.model === 'FLAT') amount = fee.base;
  else if (fee.model === 'SUCCESS_FEE') amount = basisAmount * fee.rate;
  else if (fee.model === 'HYBRID') amount = fee.base + (basisAmount * fee.rate);
  return { model: fee.model, base: fee.base, rate: fee.rate, amount };
}
function feeModelLabel(model) {
  return { FLAT: 'Flat (ค่าดำเนินการคงที่)', SUCCESS_FEE: 'Success Fee (% ความสำเร็จ)', HYBRID: 'Hybrid (คงที่ + %)' }[model] || model;
}

function getTeamByName(name) { return store.teams.find(t => t.name === name); }
function renderTeamCostBox(teamName) {
  const team = getTeamByName(teamName);
  if (!team || !team.compensation) return '';
  const comp = team.compensation;
  const fuelText = comp.fuel.mode === 'PER_KM'
    ? `${money(comp.fuel.rate_per_km)} บาท/กม. (เพดานไม่เกิน ${money(comp.fuel.max_per_case)} บาท/เคส)`
    : `เหมาจ่าย ${money(comp.fuel.daily_flat_rate)} บาท/วัน (ไม่จำกัดระยะทาง)`;
  return `
  <div class="bg-amber-50 border border-amber-200 rounded-lg p-4 mt-3">
    <div class="text-xs font-bold text-amber-800 mb-2 flex items-center gap-1.5">${Icon.file} ค่าใช้จ่ายของทีม "${teamName}"</div>
    <div class="grid grid-cols-2 gap-y-1.5 gap-x-3 text-xs text-amber-700">
      <span>⛽ ค่าน้ำมัน:</span><span class="font-semibold">${fuelText}</span>
      <span>🍽️ เบี้ยเลี้ยง:</span><span class="font-semibold">${money(comp.allowance)} บาท/วัน</span>
      <span>🏨 ค่าที่พัก:</span><span class="font-semibold">${money(comp.hotel)} บาท/คืน</span>
      <span>✅ คอมมิชชั่น (สำเร็จ):</span><span class="font-semibold text-emerald-700">${money(comp.commission)} บาท/เคส</span>
      <span>⚠️ เบี้ยเสี่ยง/ค่าออกพื้นที่ (ไม่สำเร็จ):</span><span class="font-semibold text-red-600">${money(comp.no_success_fee)} บาท/เคส</span>
    </div>
  </div>`;
}

function statusBadge(s) {
  const map = {
    approved: 'bg-emerald-100 text-emerald-800',
    pending_review: 'bg-amber-100 text-amber-800',
    draft: 'bg-slate-100 text-slate-700',
    need_info: 'bg-purple-100 text-purple-800',
    rejected: 'bg-red-100 text-red-800',
  };
  const labelMap = { pending_review: 'รอพิจารณา', draft: 'ร่าง', approved: 'รับเคสแล้ว', need_info: 'ขอข้อมูลเพิ่ม', rejected: 'ไม่รับเคส' };
  return `<span class="text-[10px] px-2 py-0.5 rounded-full font-bold uppercase tracking-wide ${map[s] || 'bg-slate-100 text-slate-700'}">${labelMap[s] || s}</span>`;
}
// แสดงสถานะที่มาจากไฟล์ 41 (ติดตามภาคสนาม) — คนละ state machine กับ status ของไฟล์นี้ (38)
function fieldStatusBadge(fs) {
  const map = {
    closed_success: ['ภาคสนาม: ปิดงานสำเร็จ', 'bg-indigo-100 text-indigo-700'],
    closed_fail: ['ภาคสนาม: ปิดงานไม่สำเร็จ', 'bg-indigo-100 text-indigo-700'],
    needs_revision: ['ภาคสนาม: รอแก้ไขหลักฐาน', 'bg-orange-100 text-orange-700'],
  };
  const [label, cls] = map[fs] || ['', ''];
  if (!label) return '';
  return `<span class="text-[10px] px-2 py-0.5 rounded-full font-bold uppercase tracking-wide ${cls}">${label}</span>`;
}
function sourceBadge(s) {
  const map = { api: 'bg-blue-50 text-blue-700 border-blue-200', import: 'bg-indigo-50 text-indigo-700 border-indigo-200', manual: 'bg-slate-50 text-slate-600 border-slate-200' };
  const labelMap = { api: 'API', import: 'Import', manual: 'กรอกมือ' };
  return `<span class="text-[10px] px-2 py-0.5 rounded-full font-semibold border ${map[s]}">${labelMap[s]}</span>`;
}
function btnAction(label, action, type = '', id = '', cls = 'text-slate-600 hover:bg-slate-50 border-slate-300 bg-white') {
  return `<button data-action="${action}" data-type="${type}" data-id="${id}" class="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-semibold border transition-colors focus-ring shadow-sm ${cls}">${label}</button>`;
}
function formInput(id, label, val = '', type = 'text', placeholder = '', required = false, extra = '') {
  return `<div><label class="block text-xs font-bold text-slate-700 mb-1">${label} ${required ? '<span class="text-red-500">*</span>' : ''}</label><input type="${type}" id="${id}" value="${val}" placeholder="${placeholder}" ${extra} class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus-ring"></div>`;
}
function formSelect(id, label, options, selectedVal = '', required = true, extra = '') {
  return `<div><label class="block text-xs font-bold text-slate-700 mb-1">${label} ${required ? '<span class="text-red-500">*</span>' : ''}</label><select id="${id}" ${extra} class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus-ring bg-white">${options.map(o => `<option value="${o.val}" ${o.val === selectedVal ? 'selected' : ''}>${o.text}</option>`).join('')}</select></div>`;
}

  </div>`;

async function handlePostalLookup(prefix, code) {
  const statusEl = document.getElementById(prefix + '_postal_status');
  if (code.length !== 5) { if (statusEl) statusEl.innerHTML = ''; return; }
  if (statusEl) statusEl.innerHTML = `<span class="text-slate-400">กำลังค้นหา...</span>`;
  const result = await lookupPostalCode(code);
  if (!result) {
    if (statusEl) statusEl.innerHTML = `<span class="text-amber-600">${Icon.alert}</span>`;
    return;
  }
  if (statusEl) statusEl.innerHTML = `<span class="text-emerald-600">${Icon.check}</span>`;
  // เติม province → trigger district list → เติม district → trigger subdistrict list → เติม subdistrict
  document.getElementById(prefix + '_province_wrap').innerHTML =
    formSelect(prefix + '_province', 'จังหวัด', [{ val: '', text: '— เลือกจังหวัด —' }, ...ALL_PROVINCES.map(p => ({ val: p, text: p }))], result.province, true, `onchange="onProvinceChange('${prefix}', this.value)"`);
  const districts = getDistricts(result.province);
  document.getElementById(prefix + '_district_wrap').innerHTML =
    formSelect(prefix + '_district', 'อำเภอ/เขต', districts.map(d => ({ val: d, text: d })), result.district, true, `onchange="onDistrictChange('${prefix}', '${result.province}', this.value)"`);
  const subs = getSubDistricts(result.province, result.district);
  document.getElementById(prefix + '_subdistrict_wrap').innerHTML =
    formSelect(prefix + '_subdistrict', 'ตำบล/แขวง', subs.map(s => ({ val: s, text: s })), result.subdistrict, true);
  if (prefix === 'current') updateTeamSuggestion(result.province);
}

function onProvinceChange(prefix, province) {
  const districts = getDistricts(province);
  document.getElementById(prefix + '_district_wrap').innerHTML =
    formSelect(prefix + '_district', 'อำเภอ/เขต', [{ val: '', text: districts.length ? '— เลือกอำเภอ —' : '— ไม่มีข้อมูลตัวอย่าง —' }, ...districts.map(d => ({ val: d, text: d }))], '', true, districts.length ? `onchange="onDistrictChange('${prefix}', '${province}', this.value)"` : 'disabled');
  document.getElementById(prefix + '_subdistrict_wrap').innerHTML =
    formSelect(prefix + '_subdistrict', 'ตำบล/แขวง', [{ val: '', text: '— เลือกอำเภอก่อน —' }], '', true, 'disabled');
  if (prefix === 'current') updateTeamSuggestion(province);
}
function onDistrictChange(prefix, province, district) {
  const subs = getSubDistricts(province, district);
  document.getElementById(prefix + '_subdistrict_wrap').innerHTML =
    formSelect(prefix + '_subdistrict', 'ตำบล/แขวง', [{ val: '', text: subs.length ? '— เลือกตำบล —' : '— ไม่มีข้อมูลตัวอย่าง —' }, ...subs.map(s => ({ val: s, text: s }))], '', true, subs.length ? '' : 'disabled');
}
function updateTeamSuggestion(province) {
  const team = store.teams.find(t => t.provinces.includes(province));
  const box = document.getElementById('teamSuggestionBox');
  if (!box) return;
  box.innerHTML = team
    ? `<span class="font-bold text-blue-900 text-sm">${team.name}</span><p class="text-[11px] text-blue-600 mt-1">จับคู่จากจังหวัด "${province}" — ผู้จัดการยืนยัน/เปลี่ยนได้ในขั้นพิจารณาเคส</p>`
    : `<span class="text-slate-500 text-sm italic">ไม่พบทีมที่ดูแลจังหวัด "${province}" — ต้องเลือกทีมเองแบบ manual ในขั้นพิจารณาเคส</span>`;
}

function onNationalityChange(value) {
  const otherWrap = document.getElementById('otherNationalityWrap');
  const idDocWrap = document.getElementById('debtorIdDocWrap');
  otherWrap.classList.toggle('hidden', value !== 'OTHER');
  if (value === 'TH') {
    idDocWrap.innerHTML = formInput('debtor_national_id', 'เลขบัตรประชาชน', '', 'text', '13 หลัก', true, `maxlength="13" inputmode="numeric" oninput="this.value=this.value.replace(/\\D/g,'')"`);
  } else {
    idDocWrap.innerHTML = formInput('debtor_passport_no', 'เลข Passport / เอกสารอื่น (ใบอนุญาตทำงาน ฯลฯ)', '', 'text', 'กรอกตามเอกสารจริง', true) +
      `<p class="text-[11px] text-slate-400 mt-1">ไม่จำกัดรูปแบบ/จำนวนหลัก เนื่องจากแต่ละประเทศมี format ต่างกัน</p>`;
  }
}

let uploadedPhotos = []; // [{id, name, dataUrl}]
function renderPhotoUploader() {
  return `
  <div>
    <div id="photoDropzone" class="border-2 border-dashed border-slate-300 rounded-lg p-6 text-center bg-slate-50 hover:bg-slate-100 hover:border-slate-400 transition-colors cursor-pointer"
         ondragover="event.preventDefault(); this.classList.add('border-blue-400','bg-blue-50')"
         ondragleave="this.classList.remove('border-blue-400','bg-blue-50')"
         ondrop="handlePhotoDrop(event)"
         onclick="document.getElementById('photoFileInput').click()">
      <div class="text-slate-400 mb-2 flex justify-center">${Icon.upload}</div>
      <p class="text-sm text-slate-600 font-semibold">ลากรูปสินค้ามาวาง หรือคลิกเพื่อเลือกไฟล์</p>
      <p class="text-xs text-slate-400 mt-1">รองรับ JPG/PNG — อัปโหลดได้สูงสุด 8 รูป (<span id="photoCount">${uploadedPhotos.length}</span>/8)</p>
      <input type="file" id="photoFileInput" accept="image/*" multiple class="hidden" onchange="handlePhotoSelect(event)">
    </div>
    <div id="photoPreviewGrid" class="grid grid-cols-3 sm:grid-cols-4 gap-3 mt-3">${renderPhotoThumbnails()}</div>
  </div>`;
}
function renderPhotoThumbnails() {
  return uploadedPhotos.map(p => `
    <div class="relative group aspect-square rounded-lg overflow-hidden border border-slate-200 bg-slate-100 flex items-center justify-center">
      ${p.dataUrl ? `<img src="${p.dataUrl}" class="w-full h-full object-cover" alt="${p.name}">` : `<div class="text-slate-400 text-center"><div class="flex justify-center mb-1">${Icon.eye}</div><div class="text-[9px] px-1 truncate">${p.name}</div></div>`}
      <button onclick="removePhoto('${p.id}')" class="absolute top-1 right-1 bg-slate-900/70 hover:bg-red-600 text-white rounded-full p-1 transition-colors" title="ลบรูป">${Icon.x}</button>
    </div>`).join('');
}
function handlePhotoFiles(files) {
  const remaining = 8 - uploadedPhotos.length;
  Array.from(files).slice(0, remaining).forEach(file => {
    if (!file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      uploadedPhotos.push({ id: 'p' + Date.now() + Math.random().toString(36).slice(2, 6), name: file.name, dataUrl: e.target.result });
      refreshPhotoUI();
    };
    reader.readAsDataURL(file);
  });
}
function handlePhotoDrop(e) { e.preventDefault(); e.currentTarget.classList.remove('border-blue-400', 'bg-blue-50'); handlePhotoFiles(e.dataTransfer.files); }
function handlePhotoSelect(e) { handlePhotoFiles(e.target.files); }
function removePhoto(id) { uploadedPhotos = uploadedPhotos.filter(p => p.id !== id); refreshPhotoUI(); }
function refreshPhotoUI() {
  const grid = document.getElementById('photoPreviewGrid');
  const count = document.getElementById('photoCount');
  if (grid) grid.innerHTML = renderPhotoThumbnails();
  if (count) count.textContent = uploadedPhotos.length;
}

function kpi(label, value, sub, color) {
  const colorMap = { emerald: 'text-emerald-700', amber: 'text-amber-700', slate: 'text-slate-700', purple: 'text-purple-700' };
  return `<div class="bg-white rounded-xl border border-slate-200 shadow-sm p-4"><div class="text-xs font-semibold text-slate-500 mb-1">${label}</div><div class="text-2xl font-bold ${colorMap[color]}">${value}</div><div class="text-[11px] text-slate-400 mt-1">${sub}</div></div>`;

}

function canEditCase(c) {
  return ['draft', 'pending_review', 'need_info'].includes(c.status);
}

function docChip(c) {
  const total = 3; // contract + id_card + product_photo (required slots)
  const have = (c.docs.contract ? 1 : 0) + (c.docs.id_card ? 1 : 0) + (c.docs.product_photo ? 1 : 0);
  const complete = have === total;
  return `<div class="flex items-center gap-1">
    <span class="text-[10px] px-1.5 py-0.5 rounded-md font-bold ${complete ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-700'}">${Icon.file} ${have}/${total}</span>
    ${!complete ? `<span class="text-amber-500" title="เอกสารยังไม่ครบ">${Icon.alert}</span>` : ''}
  </div>`;
}

          <div class="text-[11px] font-semibold ${files.id_card.length ? 'text-emerald-600' : 'text-red-500'} mb-1 flex items-center gap-1">${Icon.check} บัตรประชาชน/เอกสารยืนยันตัวตน ${files.id_card.length ? `(${files.id_card.length})` : '✗ ยังไม่มี'}</div>
          ${files.id_card.map((f, i) => fileRow(f, i, 'id_card')).join('') || '<div class="text-[11px] text-slate-400">— ไม่มีไฟล์ —</div>'}
        </div>
        <div>
          <div class="text-[11px] font-semibold text-slate-600 mb-1">เอกสารอื่น (${files.other.length})</div>
          ${files.other.map((f, i) => fileRow(f, i, 'other')).join('') || '<div class="text-[11px] text-slate-400">— ไม่มีไฟล์ —</div>'}
        </div>
      </div>
    </div>

    <div class="border border-slate-200 rounded-lg p-3">
      <div class="text-xs font-bold ${files.photos.length ? 'text-emerald-600' : 'text-red-500'} mb-2 flex items-center gap-1">${Icon.check} รูปสินค้า (${files.photos.length}) — คลิกเพื่อดูภาพขยาย</div>
      ${files.photos.length ? `
      <div class="grid grid-cols-4 gap-2">
        ${files.photos.map((f, i) => `<button onclick="viewFile('photos', ${i}, '${c.id}')" class="aspect-square rounded-lg bg-slate-100 border border-slate-200 flex items-center justify-center text-slate-400 hover:border-slate-400 hover:text-slate-600 transition-colors" title="${f.name}">${Icon.eye}</button>`).join('')}
      </div>` : `<div class="text-[11px] text-slate-400">— ยังไม่มีรูปสินค้า —</div>`}
    </div>

    ${(() => {
      const proj = calcProjectedRevenue(c);
      if (!proj) return '';
      return `
      <div class="bg-emerald-50 border border-emerald-200 rounded-lg p-3 flex items-center justify-between gap-3">
        <div>
          <div class="text-xs font-bold text-emerald-700 flex items-center gap-1.5">${Icon.trend} ประมาณการรายได้ (ถ้าเคสสำเร็จ)</div>
          <div class="text-[11px] text-emerald-600 mt-0.5">โมเดล: ${feeModelLabel(proj.model)}${proj.model !== 'FLAT' ? ` — ฐานคำนวณจากมูลหนี้คงเหลือ × ${(proj.rate * 100).toFixed(0)}%` : ''}${proj.model === 'HYBRID' ? ` + ฐาน ฿${money(proj.base)}` : ''}</div>
        </div>
        <div class="text-xl font-bold text-emerald-700 whitespace-nowrap">฿ ${money(proj.amount)}</div>
      </div>`;
    })()}

    <div class="bg-blue-50 border border-blue-200 rounded-lg p-4">
      <div class="text-xs font-bold text-blue-800 mb-2 flex items-center gap-1.5">${Icon.map} ทีมที่ระบบเสนอ (จับคู่จากจังหวัด)</div>
      <div id="reviewTeamSection">${renderTeamSelectionSection(c)}</div>
    </div>

    ${(c.edit_history && c.edit_history.length > 0) ? `
    <div class="border border-slate-200 rounded-lg p-3">
      <div class="text-xs font-bold text-slate-600 mb-2">ประวัติการแก้ไข (${c.edit_history.length} ครั้ง)</div>
      <div class="space-y-2">
        ${c.edit_history.map(h => `
          <div class="text-xs flex items-start gap-2 border-l-2 border-slate-200 pl-2.5">
            <div>
              <span class="font-semibold text-slate-800">${h.by}</span>
              <span class="text-slate-400"> — ${h.at}</span>
              <div class="text-slate-600">${h.note}</div>
            </div>
          </div>`).join('')}
      </div>
    </div>` : ''}

    ${canAct ? `
    <div>
      <label class="block text-xs font-bold text-slate-700 mb-1">หมายเหตุ/เหตุผล (จำเป็นเมื่อไม่รับ หรือขอข้อมูลเพิ่ม)</label>
      <textarea class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus-ring" rows="2" placeholder="ระบุเหตุผล..."></textarea>
    </div>` : ''}
  </div>`;
}

function viewFile(group, idx, caseId) {
  const c = store.cases.find(x => x.id === caseId);
  const f = group === 'photos' ? c.files.photos[idx] : c.files[group][idx];
  showToast('เปิดไฟล์: ' + f.name + ' (mockup — ของจริงเปิด viewer/lightbox จากไฟล์จริงใน storage)');
}

// แสดงทีมที่เสนอ + รายการทีมอื่นที่จังหวัดตรงเงื่อนไข (และ toggle ดูทีมอื่นทั้งหมด) ตามไฟล์ 38 §7.4
function renderTeamSelectionSection(c) {
  const canAct = c.status === 'pending_review';
  const currentTeamName = c.suggested_team;
  const matchingTeams = store.teams.filter(t => t.provinces.includes(c.province) && t.name !== currentTeamName);
  const otherTeams = store.teams.filter(t => !t.provinces.includes(c.province) && t.name !== currentTeamName);
  const teamsToShow = state.showAllTeams ? [...matchingTeams, ...otherTeams] : matchingTeams;
  const pending = state.pendingTeamChange && state.pendingTeamChange.caseId === c.id ? state.pendingTeamChange : null;

  return `
    <div class="border border-blue-300 bg-white rounded-lg p-3 mb-2">
      <div class="flex items-center justify-between">
        <span class="font-bold text-blue-900 text-sm">${currentTeamName || '— ไม่พบทีมที่ตรงจังหวัด —'}</span>
        <span class="text-[10px] bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full font-bold">ทีมที่เลือกอยู่</span>
      </div>
      ${renderTeamCostBox(currentTeamName)}
    </div>

    ${pending ? `
    <div class="bg-amber-50 border border-amber-300 rounded-lg p-3 mb-2">
      <div class="text-xs font-bold text-amber-800 mb-1.5">ยืนยันเปลี่ยนทีมเป็น "${pending.teamName}"</div>
      <label class="block text-[11px] font-semibold text-amber-700 mb-1">เหตุผลที่เปลี่ยน (จำเป็น) <span class="text-red-500">*</span></label>
      <textarea id="teamChangeReason" class="w-full border border-amber-300 rounded-lg px-2.5 py-1.5 text-xs focus-ring" rows="2" placeholder="ระบุเหตุผลที่เปลี่ยนทีม..."></textarea>
      <div class="flex gap-2 mt-2">
        <button class="px-3 py-1.5 text-xs font-semibold text-white bg-amber-600 hover:bg-amber-700 rounded-lg" onclick="confirmTeamChange('${c.id}')">ยืนยันเปลี่ยนทีม</button>
        <button class="px-3 py-1.5 text-xs font-semibold text-slate-600 hover:bg-slate-100 border border-slate-300 rounded-lg bg-white" onclick="cancelTeamChange()">ยกเลิก</button>
      </div>
    </div>` : ''}

    ${canAct && !pending ? `
    <div>
      <div class="text-[11px] font-bold text-slate-500 mb-1.5">
        ${state.showAllTeams ? 'ทุกทีมในระบบ (ไม่กรองจังหวัด)' : `ทีมอื่นที่เข้าเงื่อนไข (จังหวัด${c.province})`}
        — กดเพื่อเลือก
      </div>
      ${teamsToShow.length === 0 ? `<div class="text-[11px] text-slate-400 italic py-2">ไม่มีทีมอื่นที่ตรงจังหวัดนี้</div>` : `
      <div class="space-y-2 mb-2">
        ${teamsToShow.map(t => `
          <div class="border border-slate-200 rounded-lg p-3 bg-white hover:border-blue-300 transition-colors">
            <div class="flex items-center justify-between mb-1">
              <span class="font-semibold text-slate-800 text-sm">${t.name}</span>
              <button class="px-2.5 py-1 text-[11px] font-semibold text-blue-700 border border-blue-300 rounded-md hover:bg-blue-50" onclick="selectTeamChange('${c.id}', '${t.name}')">เลือกทีมนี้</button>
            </div>
            <div class="text-[10px] text-slate-400 mb-1.5 flex items-center gap-1">${Icon.map} ${t.provinces.join(', ')}</div>
            ${renderTeamCostBox(t.name)}
          </div>`).join('')}
      </div>`}
      <button class="text-[11px] font-semibold text-blue-600 underline" onclick="toggleShowAllTeams()">
        ${state.showAllTeams ? '▲ ซ่อนทีมที่ไม่ตรงจังหวัด' : '▼ ดูทีมอื่นทั้งหมด (รวมทีมที่ไม่ตรงจังหวัด)'}
      </button>
    </div>` : ''}
  `;
}

function refreshTeamSection(caseId) {
  const c = store.cases.find(x => x.id === caseId);
  const el = document.getElementById('reviewTeamSection');
  if (el) el.innerHTML = renderTeamSelectionSection(c);
}

function toggleShowAllTeams() {
  state.showAllTeams = !state.showAllTeams;
  const caseId = state.modal && state.modal.data && state.modal.data.id;
  if (caseId) refreshTeamSection(caseId);
}

function selectTeamChange(caseId, teamName) {
  state.pendingTeamChange = { caseId, teamName };
  refreshTeamSection(caseId);
}

function cancelTeamChange() {
  const caseId = state.pendingTeamChange && state.pendingTeamChange.caseId;
  state.pendingTeamChange = null;
  if (caseId) refreshTeamSection(caseId);
}

function confirmTeamChange(caseId) {
  const reasonEl = document.getElementById('teamChangeReason');
  const reason = reasonEl ? reasonEl.value.trim() : '';
  if (!reason) { showToast('ต้องระบุเหตุผลก่อนเปลี่ยนทีม', 'error'); return; }

  const c = store.cases.find(x => x.id === caseId);
  const newTeamName = state.pendingTeamChange.teamName;
  const oldTeamName = c.suggested_team;
  c.suggested_team = newTeamName;
  c.edit_history = c.edit_history || [];
  c.edit_history.unshift({ by: store.currentUser.name + ' (' + store.currentUser.role + ')', at: new Date().toLocaleString('th-TH', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }), note: `เปลี่ยนทีมจาก "${oldTeamName}" เป็น "${newTeamName}" — เหตุผล: ${reason}` });

  state.pendingTeamChange = null;
  state.showAllTeams = false;
  refreshTeamSection(caseId);
  showToast(`เปลี่ยนทีมเป็น "${newTeamName}" แล้ว — บันทึก audit log เรียบร้อย`);
}

// ===================== MODAL ROUTER =====================
function renderModal() {
  if (!state.modal) return '';
  const { type, data } = state.modal;
  let title = '', body = '', footer = '';

  if (type === 'create') {
    title = 'รับเคส (กรอกฟอร์มมือ)';
    body = renderCreateCaseModal();
    footer = `<button data-action="close-modal" class="px-4 py-2 text-sm font-semibold text-slate-700 rounded-lg hover:bg-slate-200 border border-slate-300 bg-white focus-ring transition-colors shadow-sm">ยกเลิก</button>
    <button data-action="save-case" class="px-5 py-2 text-sm font-semibold text-white bg-slate-900 rounded-lg hover:bg-slate-800 focus-ring shadow-sm transition-colors flex items-center gap-1.5">${Icon.check} บันทึกเป็นร่าง</button>`;
  } else if (type === 'edit') {
    const c = store.cases.find(x => x.id === data.id);
    title = `แก้ไขเคส — ${c.id}`;
    body = renderCreateCaseModal(c);
    footer = `<button data-action="close-modal" class="px-4 py-2 text-sm font-semibold text-slate-700 rounded-lg hover:bg-slate-200 border border-slate-300 bg-white focus-ring transition-colors shadow-sm">ยกเลิก</button>
    <button data-action="save-edit" data-id="${c.id}" class="px-5 py-2 text-sm font-semibold text-white bg-slate-900 rounded-lg hover:bg-slate-800 focus-ring shadow-sm transition-colors flex items-center gap-1.5">${Icon.check} บันทึกการแก้ไข</button>`;
  } else if (type === 'import') {
    title = 'Import เคสจากไฟล์ Excel/CSV';
    body = `<div class="space-y-4">
      <div class="border-2 border-dashed border-slate-300 rounded-lg p-8 text-center bg-slate-50">
        <div class="text-slate-400 mb-2 flex justify-center">${Icon.upload}</div>
        <p class="text-sm text-slate-600 font-semibold">ลากไฟล์มาวาง หรือคลิกเพื่อเลือกไฟล์</p>
        <p class="text-xs text-slate-400 mt-1">รองรับ .xlsx, .csv — ขนาดไม่เกิน 10MB</p>
      </div>
      <div class="bg-amber-50 border border-amber-200 rounded-lg p-3 text-xs text-amber-800 flex items-start gap-2">
        ${Icon.alert}<span>แถวที่มี case_ref ซ้ำกับเคสเดิมของไฟแนนซ์เดียวกันจะถูก reject เฉพาะแถวนั้น พร้อมแสดงรายงานสรุปหลังนำเข้า</span>
      </div>
    </div>`;
    footer = `<button data-action="close-modal" class="px-4 py-2 text-sm font-semibold text-slate-700 rounded-lg hover:bg-slate-200 border border-slate-300 bg-white focus-ring transition-colors shadow-sm">ยกเลิก</button>
    <button data-action="close-modal" class="px-5 py-2 text-sm font-semibold text-white bg-slate-900 rounded-lg hover:bg-slate-800 focus-ring shadow-sm transition-colors flex items-center gap-1.5">${Icon.upload} เริ่ม Import</button>`;
  } else if (type === 'review' || type === 'detail') {
    const c = store.cases.find(x => x.id === data.id);
    const canAct = c.status === 'pending_review';
    const canRejectEvidence = c.field_status === 'closed_success' || c.field_status === 'closed_fail';
    const isRejectingEvidence = state.rejectEvidenceCaseId === c.id;
    title = isRejectingEvidence ? `ตีกลับหลักฐานปิดงาน — ${c.id}` : (canAct ? `พิจารณาเคส — ${c.id}` : `รายละเอียดเคส — ${c.id}`);
    if (isRejectingEvidence) {
      body = `<div class="space-y-3">
        <div class="bg-orange-50 border border-orange-200 rounded-lg p-3 text-xs text-orange-800 flex items-start gap-2">
          ${Icon.alert}<span>เคส <strong>${c.debtor}</strong> จะถูกส่งกลับให้พนักงาน (${c.id}) แก้ไขหลักฐานปิดงานในไฟล์ 41 — เช็คอินและผลการติดตามจะล็อกไว้ตามเดิม แก้ได้แค่รูป/วิดีโอ/เสียง</span>
        </div>
        <div>
          <label class="text-sm font-semibold text-slate-700 block mb-1.5">เหตุผลที่ตีกลับ <span class="text-red-500">*</span></label>
          <textarea id="rejectEvidenceReasonInput" rows="3" placeholder="เช่น รูปหลักฐานไม่ชัด ดูไม่เหมือนสถานที่จริงตามที่อยู่ลูกหนี้" class="w-full border-2 border-slate-200 rounded-lg px-3 py-2.5 text-sm focus:border-orange-400 focus:outline-none"></textarea>
        </div>
      </div>`;
      footer = `<button data-action="cancel-reject-evidence" class="px-4 py-2 text-sm font-semibold text-slate-700 rounded-lg hover:bg-slate-200 border border-slate-300 bg-white focus-ring transition-colors shadow-sm">ยกเลิก</button>
      <button data-action="confirm-reject-evidence" data-id="${c.id}" class="px-5 py-2 text-sm font-semibold text-white bg-orange-600 rounded-lg hover:bg-orange-700 focus-ring shadow-sm transition-colors flex items-center gap-1.5">${Icon.alert} ยืนยันตีกลับ</button>`;
    } else {
      body = renderReviewModal(c);

        <button data-action="need-info-case" data-id="${c.id}" class="px-4 py-2 text-sm font-semibold text-purple-700 rounded-lg hover:bg-purple-50 border border-purple-300 bg-white focus-ring transition-colors shadow-sm">ขอข้อมูลเพิ่ม</button>
        <button data-action="accept-case" data-id="${c.id}" class="px-5 py-2 text-sm font-semibold text-white bg-emerald-600 rounded-lg hover:bg-emerald-700 focus-ring shadow-sm transition-colors flex items-center gap-1.5">${Icon.check} รับเคส & ยืนยันทีม</button>`;
      } else if (canRejectEvidence) {
        footer = `<button data-action="close-modal" class="px-4 py-2 text-sm font-semibold text-slate-700 rounded-lg hover:bg-slate-200 border border-slate-300 bg-white focus-ring transition-colors shadow-sm">ปิดหน้าต่าง</button>
        <button data-action="start-reject-evidence" data-id="${c.id}" class="px-5 py-2 text-sm font-semibold text-white bg-orange-600 rounded-lg hover:bg-orange-700 focus-ring shadow-sm transition-colors flex items-center gap-1.5">${Icon.alert} ตีกลับหลักฐานปิดงาน</button>`;
      } else {
        footer = `<button data-action="close-modal" class="px-5 py-2 text-sm font-semibold text-white bg-slate-900 rounded-lg hover:bg-slate-800 focus-ring shadow-sm transition-colors">ปิดหน้าต่าง</button>`;
      }
    }
  }

  return `
  <div class="fixed inset-0 modal-backdrop flex items-center justify-center z-50 p-4" id="modalBackdrop" data-action="backdrop-close">
    <div class="bg-white rounded-xl shadow-2xl max-w-2xl w-full max-h-[90vh] flex flex-col relative transform transition-all scale-100 opacity-100">
      <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100 bg-slate-50/50 rounded-t-xl">
        <h2 class="text-lg font-bold text-slate-900">${title}</h2>
        <button data-action="close-modal" class="text-slate-400 hover:text-slate-700 hover:bg-slate-200 focus-ring rounded p-1.5 transition-colors">${Icon.x}</button>
      </div>
      <div class="px-6 py-5 overflow-y-auto">${body}</div>
      <div class="flex justify-end gap-3 px-6 py-4 border-t border-slate-100 bg-slate-50 rounded-b-xl flex-wrap">${footer}</div>
    </div>
  </div>`;
}

// ===================== TOAST =====================
function renderToast() {
  if (!state.toast) return '';
  const colors = { success: 'bg-emerald-600', error: 'bg-red-600' };
  return `<div class="fixed bottom-6 right-6 ${colors[state.toast.type] || colors.success} text-white px-4 py-3 rounded-lg shadow-lg text-sm font-semibold z-50 animate-fade-in">${state.toast.msg}</div>`;
}

function render() {
  document.getElementById('app').innerHTML = `
    ${renderTopNav()}
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
      ${renderCaseList()}
    </main>
    ${renderModal()}
    ${renderToast()}
  `;
}

function updateFilter(key, val) {
  state.filters[key] = val;
  render();
  setTimeout(() => { const el = document.getElementById('searchInput'); if (el && key === 'search') { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }, 0);
}

// ===================== EVENT DELEGATION =====================
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');

  if (e.target.id === 'addContactBtn' || e.target.closest('#addContactBtn')) {
    const list = document.getElementById('contactPersonsList');
    const newIdx = state.contactRowCount;
    state.contactRowCount++;
    list.insertAdjacentHTML('beforeend', renderContactPersonRow(newIdx));
    return;
  }

  if (!el) return;
  const action = el.dataset.action;
  const type = el.dataset.type;
  const id = el.dataset.id;

  if (action === 'remove-contact-row') {
    const row = el.closest('.contact-row');
    if (row) row.remove();
    return;
  }
  if (action === 'open-modal') {
    if (type === 'create' || type === 'edit') {
      const c = type === 'edit' ? store.cases.find(x => x.id === id) : null;
      state.contactRowCount = c && c.contacts && c.contacts.length ? c.contacts.length : 1;
    }
    openModal(type, { id });
  }
  else if (action === 'close-modal') closeModal();
  else if (action === 'backdrop-close' && e.target.id === 'modalBackdrop') closeModal();
  else if (action === 'save-case') { closeModal(); showToast('บันทึกเคสเป็นร่างสำเร็จ — รอเอกสารครบเพื่อเข้าสู่การพิจารณา'); }
  else if (action === 'save-edit') {
    const c = store.cases.find(x => x.id === el.dataset.id);
    if (c) {
      c.edit_history = c.edit_history || [];
      c.edit_history.unshift({ by: store.currentUser.name + ' (' + store.currentUser.role + ')', at: new Date().toLocaleString('th-TH', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }), note: 'แก้ไขข้อมูลเคสผ่านฟอร์ม' });
    }
    closeModal();
    showToast('บันทึกการแก้ไขสำเร็จ — บันทึกลงประวัติการแก้ไขแล้ว');
  }
  else if (action === 'accept-case') { closeModal(); showToast('รับเคสและยืนยันทีมสำเร็จ — ส่งต่อไปมอบหมายงานแล้ว'); }
  else if (action === 'reject-case') { closeModal(); showToast('บันทึกการไม่รับเคสแล้ว', 'error'); }
  else if (action === 'need-info-case') { closeModal(); showToast('ส่งคำขอข้อมูลเพิ่มเติมแล้ว'); }
  else if (action === 'start-reject-evidence') {
    setState({ rejectEvidenceCaseId: el.dataset.id });
  }
  else if (action === 'cancel-reject-evidence') {
    setState({ rejectEvidenceCaseId: null });
  }
  else if (action === 'confirm-reject-evidence') {
    const c = store.cases.find(x => x.id === el.dataset.id);
    const reasonEl = document.getElementById('rejectEvidenceReasonInput');
    const reason = reasonEl ? reasonEl.value.trim() : '';
    if (!reason) { showToast('ต้องระบุเหตุผลก่อนตีกลับหลักฐาน', 'error'); return; }
    // เขียนผลลง localStorage เพื่อให้ไฟล์ 41 (มุมมอง field agent) อ่านไปประมวลผลต่อ — จำลองการเชื่อมต่อข้ามไฟล์ระหว่าง 2 mockup ที่ไม่ได้ใช้ store เดียวกันจริง
    const qcActions = JSON.parse(localStorage.getItem('assetrecovery_qc_actions') || '[]');
    qcActions.push({ type: 'reject_evidence', case_id: c.id, reason, rejected_by: store.currentUser.name + ' (' + store.currentUser.role + ')', rejected_at: new Date().toLocaleString('th-TH', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) });
    localStorage.setItem('assetrecovery_qc_actions', JSON.stringify(qcActions));
    c.field_status = 'needs_revision';
    state.rejectEvidenceCaseId = null;
    closeModal();
    showToast(`ตีกลับหลักฐานปิดงานของ "${c.debtor}" แล้ว — แจ้งพนักงานให้แก้ไขที่ไฟล์ 41`);
  }
});

render();
</script>
</body>
</html>
