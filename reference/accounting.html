function setState(patch) { Object.assign(state, patch); render(); }
function openModal(type, data = {}) { setState({ modal: { type, data } }); }
function closeModal() { setState({ modal: null }); }
function showToast(msg, type = 'success') {
  setState({ toast: { msg, type } });
  setTimeout(() => { if (state.toast?.msg === msg) setState({ toast: null }); }, 3000);
}

function statusBadge(s) {
  const cls = STATUS_BADGE[s] || 'bg-slate-100 text-slate-600';
  const lbl = STATUS_LABEL[s] || s;
  return `<span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wide ${cls}">${lbl}</span>`;
}

function btnAction(label, action, type, id = '', extra = '') {
  const base = 'inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-semibold border focus-ring transition-colors';
  const def  = 'bg-white border-slate-200 text-slate-700 hover:bg-slate-50';
  return `<button data-action="${action}" data-type="${type}" data-id="${id}" class="${base} ${extra || def}">${label}</button>`;
}

function formInput(id, label, val = '', type = 'text', placeholder = '', required = false) {
  return `<div><label class="block text-xs font-bold text-slate-700 mb-1">${label}${required ? ' <span class="text-red-500">*</span>' : ''}</label><input id="${id}" type="${type}" value="${val}" placeholder="${placeholder}" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus-ring"></div>`;
}
function formSelect(id, label, options, selected = '') {
  return `<div><label class="block text-xs font-bold text-slate-700 mb-1">${label}</label><select id="${id}" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus-ring">${options.map(o => `<option value="${o.val}" ${selected === o.val ? 'selected' : ''}>${o.text}</option>`).join('')}</select></div>`;
}
function formTextarea(id, label, val = '', placeholder = '', rows = 3, required = false) {
  return `<div><label class="block text-xs font-bold text-slate-700 mb-1">${label}${required ? ' <span class="text-red-500">*</span>' : ''}</label><textarea id="${id}" rows="${rows}" placeholder="${placeholder}" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus-ring">${val}</textarea></div>`;
}

// ===================== TOAST =====================
function renderToast() {
  if (!state.toast) return '';
  const isError = state.toast.type === 'error';
  return `
  <div class="fixed bottom-6 right-6 z-50 animate-[fadeIn_0.3s_ease-out] max-w-sm">
    <div class="${isError ? 'bg-red-700 border-red-600' : 'bg-slate-900 border-slate-700'} text-white px-5 py-3.5 rounded-xl shadow-2xl text-sm font-semibold flex items-center gap-3 border">
      <div class="${isError ? 'bg-red-400' : 'bg-emerald-500'} rounded-full p-0.5 text-white shrink-0">
        ${isError ? Icon.x : Icon.check}
      </div>
      <span>${state.toast.msg}</span>
    </div>
  </div>`;
}

// ===================== MAIN RENDER =====================
function render() {
  const app = document.getElementById('app');
  const mainContent = renderAccountingOperations();
  app.innerHTML = renderTopNav()
    + `<main class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">${mainContent}</main>`
    + renderModal()
    + renderToast();
}

// ===================== EVENT LISTENER =====================
document.addEventListener('click', e => {
  if (e.target.id === 'modalBackdrop') { closeModal(); return; }
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;

  if (action === 'set-main') {
    setState({ mainTab: el.dataset.id });
  }
  else if (action === 'set-sub') {
    setState({ [el.dataset.parent]: el.dataset.id });
  }
  else if (action === 'open-modal') {
    openModal(el.dataset.type, { id: el.dataset.id });
  }
  else if (action === 'close-modal') {
    closeModal();
  }
  else if (action === 'toast') {
    closeModal();
    showToast(el.dataset.msg || 'ดำเนินการสำเร็จ', 'success');
  }
  else if (action === 'save-modal') {
    const msg = el.dataset.msg || 'บันทึกข้อมูลเรียบร้อยแล้ว';

    // ── Readiness Guard: send-to-accountant (ไฟล์ 30 §6.2) ──────────
    // ตรวจ 3 เงื่อนไขก่อนอนุญาต — ถ้าไม่ผ่านให้ reject พร้อมข้อความ
    if (state.modal && state.modal.type === 'send-to-accountant') {
      const ap = store.accountingPeriods.find(p => p.id === state.modal.data.id);
      if (ap) {
        const fails = [
          ap.critical > 0         && `❌ มี ${ap.critical} Critical Exception เปิดอยู่ (NOT_READY_CRITICAL_OPEN)`,
          !ap.reconcileOk         && `❌ Bank Reconcile ไม่ครบ — มี ${ap.unmatchedCount} รายการ unmatched (NOT_READY_RECONCILE_INCOMPLETE)`,
          !ap.billingOk           && `❌ Billing Batch ไม่ตรงกับ Revenue`,
        ].filter(Boolean);
        if (fails.length > 0) {
          showToast(`ยังไม่พร้อม: ${fails[0]}`, 'error');
          return; // หยุด — ไม่ปิด modal ไม่แสดง success
        }
      }
    }

    closeModal();
    showToast(msg, 'success');
  }
});

// Init
render();
</script>
</body>
</html>
