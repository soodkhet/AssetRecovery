# PostgreSQL สำหรับ dev/test บนเครื่อง local (PLAN §0.1 หมายเหตุ local-first)
# ใช้กับ Prisma migrate/seed และ unit test ที่แตะ DB — ห้ามยิง staging/production DB ใน test (Rule 07)
# เริ่มใช้งาน: docker compose -f docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:17-alpine
    container_name: assetrecovery-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: assetrecovery
      POSTGRES_PASSWORD: assetrecovery
      POSTGRES_DB: assetrecovery_dev
      # timezone ของ container — เวลาใน DB เก็บเป็น UTC เสมอ (Rule 01)
      TZ: UTC
      PGTZ: UTC
    # 5433 กันชนกับ Postgres ตัวอื่นบนเครื่อง (port 5432)
    ports:
      - '5433:5432'
    volumes:
      - assetrecovery-pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U assetrecovery -d assetrecovery_dev']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  assetrecovery-pgdata:
