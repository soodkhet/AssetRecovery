<script>
const DOCS = [
  { group: 'เริ่มที่นี่', items: [
    { id: 'start', no: '', title: 'ภาพรวมและวิธีใช้คู่มือ', file: null },
  ]},
  { group: 'คู่มือผู้ใช้ 7 เล่ม', items: [
    { id: 'book-01', no: '1', title: 'ผู้ดูแลระบบ', file: 'books/01-admin.md' },
    { id: 'book-02', no: '2', title: 'ธุรการและเจ้าหน้าที่อนุมัติเคส', file: 'books/02-intake.md' },
    { id: 'book-03', no: '3', title: 'ทีมติดตามทรัพย์', file: 'books/03-field-team.md' },
    { id: 'book-04', no: '4', title: 'คลังและส่งมอบ', file: 'books/04-warehouse.md' },
    { id: 'book-05', no: '5', title: 'การเงิน', file: 'books/05-finance.md' },
    { id: 'book-06', no: '6', title: 'บัญชีและผู้บริหาร', file: 'books/06-accounting-exec.md' },
    { id: 'book-07', no: '7', title: 'พอร์ทัลบริษัทไฟแนนซ์', file: 'books/07-portal.md' },
  ]},
  { group: 'ผังระบบ', items: [
    { id: 'diagram-workflow', no: 'A', title: 'Work Flow Diagram', file: 'diagrams/01-workflow.md' },
    { id: 'diagram-usecase', no: 'B', title: 'Use Case Diagram', file: 'diagrams/02-use-case.md' },
    { id: 'diagram-roles', no: 'C', title: 'Flow Chart ราย role', file: 'diagrams/03-role-flowcharts.md' },
  ]},
  { group: 'อ้างอิง', items: [
    { id: 'preset', no: '', title: 'ค่าตั้งมาตรฐานการเงิน/ภาษีไทย', file: 'settings-preset.md' },
  ]},
]
const FLAT = DOCS.flatMap((g) => g.items)
const byFile = new Map(FLAT.filter((d) => d.file).map((d) => [d.file, d.id]))

const START = `# คู่มือ AssetRecovery

ระบบนี้ใช้บริหารงานติดตามทรัพย์ (มือถือ/อุปกรณ์) คืนจากลูกหนี้ให้บริษัทไฟแนนซ์ ตั้งแต่รับเคส ส่งทีมลงพื้นที่ รับเครื่องเข้าคลัง ส่งมอบคืน ไปจนถึงวางบิล จ่ายค่าตอบแทน และส่งข้อมูลให้สำนักงานบัญชีปิดงวด

## เลือกเล่มตามหน้าที่ของคุณ

| คุณคือ | อ่านเล่ม |
|---|---|
| ผู้ดูแลระบบ (ตั้งค่าครั้งแรก · ผู้ใช้ · สิทธิ์) | เล่ม 1 |
| ธุรการรับเคส · เจ้าหน้าที่อนุมัติเคส | เล่ม 2 |
| ผู้จัดการทีม · หัวหน้าทีม · พนักงานภาคสนาม (มือถือ) | เล่ม 3 |
| ธุรการคลัง (รับเครื่อง · ล็อตส่งมอบ) | เล่ม 4 |
| ฝ่ายการเงิน | เล่ม 5 |
| ฝ่ายบัญชี · ผู้บริหาร | เล่ม 6 |
| พนักงานบริษัทไฟแนนซ์ (ลูกค้า) | เล่ม 7 |

## เส้นทางงานหลักในหนึ่งเคส

1. **รับเคส** — ธุรการกรอกหรือนำเข้าไฟล์ แนบสัญญาและบัตรประชาชน แล้วส่งตรวจ
2. **อนุมัติเคส** — เจ้าหน้าที่ตรวจเอกสาร ยืนยันทีมที่ระบบเสนอจากจังหวัดของลูกหนี้
3. **มอบหมาย** — หัวหน้าหรือผู้จัดการทีมเลือกพนักงาน
4. **ลงพื้นที่** — พนักงานรับงานบนมือถือ จัดวัน เช็คอิน ถ่ายหลักฐาน ปิดงานสำเร็จหรือไม่สำเร็จ
5. **รับเครื่องเข้าคลัง** — ตรวจ IMEI 15 หลักและสภาพเครื่อง
6. **ส่งมอบคืนบริษัทไฟแนนซ์** — รวมเครื่องเป็นล็อตต่อบริษัท แนบใบเซ็นรับ แล้วยืนยันล็อต
7. **อนุมัติค่าตอบแทน** — ผู้จัดการขั้นที่ 1 · การเงินขั้นที่ 2 (ยอดสูงต้องผ่านผู้บริหาร)
8. **รายได้และวางบิล** — รายได้เกิดเมื่อค่าตอบแทนอนุมัติครบและล็อตยืนยันแล้ว จากนั้นวางบิลและส่งบิล
9. **รับชำระ** — ฝ่ายบัญชีนำเข้ารายการเดินบัญชี จับคู่ยอด ออกใบเสร็จ/ใบกำกับภาษี
10. **จ่ายค่าตอบแทน** — การเงินสร้างรอบจ่าย ไฟล์โอนธนาคาร และหนังสือรับรองการหักภาษี ณ ที่จ่าย (50 ทวิ)
11. **ปิดงวด** — ฝ่ายบัญชีส่งชุดเอกสาร (Accounting Pack) ให้สำนักงานบัญชีหลังสิ้นเดือน แล้วล็อกงวด

> ภาพหน้าจอในคู่มือนี้มาจากการทดลองใช้งานจริงบนระบบทดสอบ ชื่อบุคคล บริษัท และตัวเลขทั้งหมดเป็นข้อมูลสมมติ

## เรื่องที่ควรรู้ก่อนเริ่ม

- วันที่บนหน้าจอเป็นปี **พ.ศ.** รูปแบบ วว/ดด/ปปปป เวลาเป็นเวลาไทย
- เงินแสดงเป็นบาท ทศนิยม 2 ตำแหน่ง
- แต่ละคนเห็นเมนูตามสิทธิ์ของตำแหน่ง ถ้าไม่เห็นเมนูที่คู่มือพูดถึง ให้ติดต่อผู้ดูแลระบบ
- ทุกการแก้ไขสำคัญมีบันทึกการใช้งาน (ใคร ทำอะไร เมื่อไร เหตุผล) แก้ย้อนหลังหรือลบไม่ได้
`

function navLink(d) {
  const a = document.createElement('a')
  a.href = `#${d.id}`
  a.dataset.id = d.id
  a.innerHTML = `<span class="no">${d.no}</span><span></span>`
  a.lastChild.textContent = d.title
  return a
}
const groupsEl = document.getElementById('groups')
const pick = document.getElementById('pick')
for (const g of DOCS) {
  const wrap = document.createElement('div'); wrap.className = 'group'
  const h = document.createElement('h2'); h.textContent = g.group; wrap.append(h)
  const og = document.createElement('optgroup'); og.label = g.group
  for (const d of g.items) {
    wrap.append(navLink(d))
    const o = document.createElement('option'); o.value = d.id; o.textContent = (d.no ? d.no + ' · ' : '') + d.title; og.append(o)
  }
  groupsEl.append(wrap); pick.append(og)
}
pick.addEventListener('change', () => { location.hash = pick.value })

marked.setOptions({ gfm: true, breaks: false })
const cache = new Map()
async function loadText(file) {
  if (cache.has(file)) return cache.get(file)
  const res = await fetch(file)
  if (!res.ok) throw new Error(`เปิดไฟล์ ${file} ไม่ได้ (${res.status})`)
  const text = await res.text(); cache.set(file, text); return text
}

/** ปรับลิงก์/ภาพที่เขียนสัมพัทธ์กับไฟล์ต้นฉบับ ให้ชี้ไฟล์ที่เผยแพร่คู่กับหน้านี้ */
function resolvePath(base, href) {
  const dir = base.includes('/') ? base.slice(0, base.lastIndexOf('/') + 1) : ''
  const parts = (dir + href).split('/'); const out = []
  for (const p of parts) { if (p === '..') out.pop(); else if (p !== '.') out.push(p) }
  return out.join('/')
}

function render(md, file) {
  const doc = document.getElementById('doc')
  doc.innerHTML = marked.parse(md)
  for (const img of doc.querySelectorAll('img')) {
    const src = img.getAttribute('src') || ''
    if (file && !/^(https?:|data:)/.test(src)) img.src = resolvePath(file, src)
    img.loading = 'lazy'; img.decoding = 'async'
  }
  for (const a of doc.querySelectorAll('a[href]')) {
    const href = a.getAttribute('href')
    if (/^(https?:|mailto:)/.test(href)) { a.target = '_blank'; a.rel = 'noopener'; continue }
    if (href.startsWith('#')) continue
    const [path, frag] = href.split('#')
    const target = file ? resolvePath(file, path) : path
    const id = byFile.get(target)
    if (id) a.href = `#${id}`
    else if (/\.(md)$/.test(target)) { a.removeAttribute('href'); a.title = 'ไฟล์นี้ไม่ได้อยู่ในชุดคู่มือออนไลน์' }
  }
  for (const t of doc.querySelectorAll('table')) {
    const w = document.createElement('div'); w.className = 'tablewrap'; t.replaceWith(w); w.append(t)
  }
  let hasMermaid = false
  for (const code of doc.querySelectorAll('pre > code.language-mermaid')) {
    const pre = document.createElement('pre'); pre.className = 'mermaid'; pre.textContent = code.textContent
    const w = document.createElement('div'); w.className = 'mermaidwrap'; w.append(pre)
    code.parentElement.replaceWith(w); hasMermaid = true
  }
  if (hasMermaid && window.mermaid?.run) window.mermaid.run({ querySelector: 'pre.mermaid' }).catch(() => {})
}

function pager(id) {
  const i = FLAT.findIndex((d) => d.id === id)
  const prev = FLAT[i - 1], next = FLAT[i + 1]
  const nav = document.createElement('nav'); nav.className = 'pager'; nav.setAttribute('aria-label', 'เล่มก่อนหน้าและถัดไป')
  nav.innerHTML = `<span>${prev ? '' : ''}</span><span></span>`
  if (prev) { const a = document.createElement('a'); a.href = `#${prev.id}`; a.textContent = `← ${prev.title}`; nav.firstChild.replaceWith(a) }
  if (next) { const a = document.createElement('a'); a.href = `#${next.id}`; a.textContent = `${next.title} →`; nav.lastChild.replaceWith(a) }
  document.getElementById('doc').append(nav)
}

async function show() {
  const id = location.hash.slice(1) || 'start'
  const d = FLAT.find((x) => x.id === id) || FLAT[0]
  for (const a of groupsEl.querySelectorAll('a')) {
    if (a.dataset.id === d.id) a.setAttribute('aria-current', 'page')
    else a.removeAttribute('aria-current')
  }
  pick.value = d.id
  const doc = document.getElementById('doc')
  try {
    if (!d.file) render(START, null)
    else { doc.innerHTML = '<p class="status">กำลังเปิดคู่มือ…</p>'; render(await loadText(d.file), d.file) }
    pager(d.id)
    document.title = d.id === 'start' ? 'คู่มือ AssetRecovery' : `${d.title} · คู่มือ AssetRecovery`
    window.scrollTo(0, 0)
  } catch (e) {
    doc.innerHTML = '<p class="status"></p>'
    doc.firstChild.textContent = `เปิดเล่มนี้ไม่ได้: ${e.message} — ลองโหลดหน้าใหม่`
  }
}
window.addEventListener('hashchange', show)
show()
</script>
